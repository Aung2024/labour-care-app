<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Patient Transfers</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="css/vendor/fontawesome-all.min.css" />
  <style>
    body {
      font-family: 'Pyidaungsu', 'Myanmar Text', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 1rem; }
    .head {
      background: linear-gradient(135deg,#10b981,#059669);
      color: #fff;
      border-radius: 18px;
      padding: 1.2rem;
      box-shadow: 0 10px 24px rgba(0,0,0,.2);
    }
    .transfer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .transfer-card {
      position: relative;
      background: #fff;
      border: 0;
      border-radius: 18px;
      padding: 1.25rem;
      text-align: left;
      box-shadow: 0 8px 20px rgba(0,0,0,.12);
      transition: transform .2s ease, box-shadow .2s ease;
      width: 100%;
      min-height: 180px;
    }
    .transfer-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0,0,0,.16);
    }
    .transfer-icon {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #d1fae5;
      color: #047857;
      font-size: 1.45rem;
      margin-bottom: .85rem;
    }
    .title { font-weight: 800; color: #111827; font-size: 1.15rem; }
    .desc { color: #6b7280; margin-top: .35rem; font-size: .93rem; line-height: 1.45; }
    .action { margin-top: 1rem; font-weight: 700; color: #059669; }
    .transfer-notify-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      min-width: 22px;
      height: 22px;
      border-radius: 999px;
      padding: 0 6px;
      background: #ef4444;
      color: #fff;
      font-size: 0.72rem;
      line-height: 22px;
      text-align: center;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
    }
    .transfer-card.has-pending {
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.3), 0 12px 28px rgba(0,0,0,.16);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head d-flex justify-content-between align-items-center gap-2 flex-wrap">
      <div>
        <div class="fw-bold" style="font-size:1.25rem;"><i class="fas fa-exchange-alt me-2"></i>Patient Transfers</div>
        <div style="opacity:.9;font-size:.92rem;">Send or receive patient transfer requests.</div>
      </div>
      <a href="home.html" class="btn btn-outline-light btn-sm"><i class="fas fa-home me-1"></i>Home</a>
    </div>

    <div class="transfer-grid">
      <button class="transfer-card" type="button" onclick="goToTransfer('send')">
        <div class="transfer-icon"><i class="fas fa-paper-plane"></i></div>
        <div class="title">Transfer Patient</div>
        <div class="desc">Select one of your patients and send a transfer request to another midwife.</div>
        <div class="action">Start transfer <i class="fas fa-arrow-right ms-1"></i></div>
      </button>

      <button class="transfer-card" type="button" id="receiveTransfersCard" onclick="goToTransfer('requests')">
        <span class="transfer-notify-badge d-none" id="receiveTransferBadge">0</span>
        <div class="transfer-icon"><i class="fas fa-inbox"></i></div>
        <div class="title">Receive Transfers</div>
        <div class="desc" id="receiveTransferDesc">Review incoming transfer requests and accept patients into your care.</div>
        <div class="action">View requests <i class="fas fa-arrow-right ms-1"></i></div>
      </button>
    </div>
  </div>

  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/vendor/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script>
    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      alert('Patient transfers are available online only. Please reconnect to the internet and try again.');
      window.location.href = 'home.html';
    }

    firebase.auth().onAuthStateChanged(async function (user) {
      user = window.resolvePilotAuthUser ? window.resolvePilotAuthUser(user) : user;
      if (!user || user.isPilotCachedUser) return;
      await loadIncomingTransferBadge(user.uid);
    });

    async function loadIncomingTransferBadge(uid) {
      const badge = document.getElementById('receiveTransferBadge');
      const card = document.getElementById('receiveTransfersCard');
      const desc = document.getElementById('receiveTransferDesc');
      if (!badge || !card) return;
      try {
        const snap = await firebase.firestore()
          .collection('patient_transfer_requests')
          .where('targetMidwifeIds', 'array-contains', uid)
          .limit(80)
          .get();
        let count = 0;
        snap.forEach(function (doc) {
          if ((doc.data().status || 'pending') === 'pending') count++;
        });
        if (count > 0) {
          badge.textContent = count > 99 ? '99+' : String(count);
          badge.classList.remove('d-none');
          card.classList.add('has-pending');
          if (desc) {
            desc.innerHTML = '<strong style="color:#b91c1c;">' + count + ' transfer' +
              (count === 1 ? '' : 's') + ' waiting for you.</strong> Accept patients into your care.';
          }
        } else {
          badge.classList.add('d-none');
          card.classList.remove('has-pending');
        }
      } catch (e) {
        console.warn('Incoming transfer badge failed', e);
      }
    }

    function goToTransfer(action) {
      if (typeof navigator !== 'undefined' && navigator.onLine === false) {
        alert('Patient transfers are available online only. Please reconnect to the internet and try again.');
        return;
      }
      window.location.href = action === 'send' ? 'transfer-patient.html' : 'transfer-requests.html';
    }
  </script>
</body>
</html>
