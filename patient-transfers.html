<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Patient Transfers</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="css/vendor/fontawesome-all.min.css" />
  <style>
    body {
      font-family: 'Pyidaungsu', 'Myanmar Text', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .wrap { max-width: 1480px; margin: 0 auto; padding: 1rem; padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); }
    .head {
      background: linear-gradient(135deg,#10b981,#059669);
      color: #fff;
      border-radius: 18px;
      padding: 1.2rem;
      box-shadow: 0 10px 24px rgba(0,0,0,.2);
    }
    .transfer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .transfer-card {
      position: relative;
      background: #fff;
      border: 0;
      border-radius: 18px;
      padding: 1.25rem;
      text-align: left;
      box-shadow: 0 8px 20px rgba(0,0,0,.12);
      transition: transform .2s ease, box-shadow .2s ease;
      width: 100%;
      min-height: 180px;
    }
    .transfer-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0,0,0,.16);
    }
    .transfer-icon {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #d1fae5;
      color: #047857;
      font-size: 1.45rem;
      margin-bottom: .85rem;
    }
    .title { font-weight: 800; color: #111827; font-size: 1.15rem; }
    .desc { color: #6b7280; margin-top: .35rem; font-size: .93rem; line-height: 1.45; }
    .action { margin-top: 1rem; font-weight: 700; color: #059669; }
    .transfer-notify-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      min-width: 22px;
      height: 22px;
      border-radius: 999px;
      padding: 0 6px;
      background: #ef4444;
      color: #fff;
      font-size: 0.72rem;
      line-height: 22px;
      text-align: center;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
    }
    .transfer-card.has-pending {
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.3), 0 12px 28px rgba(0,0,0,.16);
    }
    .transfer-card { touch-action: manipulation; -webkit-tap-highlight-color: transparent; min-height: 44px; }

    .language-switcher {
      display: inline-flex;
      gap: 0.25rem;
      padding: 0.18rem;
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 12px;
      background: rgba(255,255,255,0.12);
    }

    .language-btn {
      min-height: 44px;
      border: 0;
      border-radius: 10px;
      padding: 0.45rem 0.65rem;
      background: transparent;
      color: rgba(255,255,255,0.84);
      font-weight: 900;
      touch-action: manipulation;
    }

    .language-btn.active {
      background: rgba(255,255,255,0.94);
      color: #047857;
    }
  </style>
  <link rel="stylesheet" href="css/hrt-register.css" />
</head>
<body>
  <div class="wrap">
    <div class="head d-flex justify-content-between align-items-center gap-2 flex-wrap">
      <div>
        <div class="fw-bold" style="font-size:1.25rem;"><i class="fas fa-exchange-alt me-2"></i><span class="lang-text" data-en="Patient Transfers" data-mm="လူနာ လွှဲပြောင်းမှုများ">Patient Transfers</span></div>
        <div style="opacity:.9;font-size:.92rem;" class="lang-text" data-en="Send or receive patient transfer requests." data-mm="လူနာလွှဲပြောင်းတောင်းဆိုချက်များ ပို့ရန် သို့မဟုတ် လက်ခံရန်။">Send or receive patient transfer requests.</div>
      </div>
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <div class="language-switcher" role="group" aria-label="Language">
          <button type="button" class="language-btn" data-lang="en">ENG</button>
          <button type="button" class="language-btn" data-lang="mm">MM</button>
        </div>
        <a href="home.html" class="btn btn-outline-light btn-sm"><i class="fas fa-home me-1"></i><span class="lang-text" data-en="Home" data-mm="ပင်မ">Home</span></a>
      </div>
    </div>

    <div class="transfer-grid">
      <button class="transfer-card" type="button" onclick="goToTransfer('send')">
        <div class="transfer-icon"><i class="fas fa-paper-plane"></i></div>
        <div class="title lang-text" data-en="Transfer Patient" data-mm="လူနာ လွှဲပြောင်းရန်">Transfer Patient</div>
        <div class="desc lang-text" data-en="Select one of your patients and send a transfer request to another midwife, or record an external referral to a facility not on the app." data-mm="သင့်လူနာကို ရွေးပြီး အခြား midwife ထံ လွှဲပြောင်းတောင်းဆိုချက် ပို့ပါ၊ သို့မဟုတ် app တွင် မပါဝင်သော ဆေးရုံ/ကျန်းမာရေးဌာနသို့ ပြင်ပ လွှဲပြောင်းညွှန်းပို့မှု မှတ်တမ်းတင်ပါ။">Select one of your patients and send a transfer request to another midwife, or record an external referral to a facility not on the app.</div>
        <div class="action"><span class="lang-text" data-en="Start transfer" data-mm="လွှဲပြောင်းရန်">Start transfer</span> <i class="fas fa-arrow-right ms-1"></i></div>
      </button>

      <button class="transfer-card" type="button" id="receiveTransfersCard" onclick="goToTransfer('requests')">
        <span class="transfer-notify-badge d-none" id="receiveTransferBadge">0</span>
        <div class="transfer-icon"><i class="fas fa-inbox"></i></div>
        <div class="title lang-text" data-en="Receive Transfers" data-mm="လွှဲပြောင်းမှု လက်ခံရန်">Receive Transfers</div>
        <div class="desc lang-text" id="receiveTransferDesc" data-en="Review incoming transfer requests and accept patients into your care." data-mm="ဝင်လာသော လွှဲပြောင်းတောင်းဆိုချက်များကို စစ်ဆေးပြီး လူနာများကို လက်ခံပါ။">Review incoming transfer requests and accept patients into your care.</div>
        <div class="action"><span class="lang-text" data-en="View requests" data-mm="တောင်းဆိုချက်များ">View requests</span> <i class="fas fa-arrow-right ms-1"></i></div>
      </button>
    </div>

    <div class="hrt-register-panel">
      <div class="hrt-register-toolbar">
        <h2><i class="fas fa-chart-line me-2 text-success"></i><span class="lang-text" data-en="Transferred patients — follow-up view" data-mm="လွှဲပြောင်းပြီး လူနာများ — နောက်ဆက်တွဲ">Transferred patients — follow-up view</span></h2>
        <p class="hint lang-text" data-en="Read-only status of patients you transferred. You cannot edit their care from here. Patients stay on your lists until the receiving midwife accepts the transfer." data-mm="သင်လွှဲပြောင်းပြီး လူနာများ၏ အခြေအနေကို ကြည့်ရှုရန်သာ။ လက်ခံသူ midwife လက်မခံမချင်း လူနာသည် သင်၏ စာရင်းတွင် ရှိနေပါမည်။">Read-only status of patients you transferred. You cannot edit their care from here. Patients stay on your lists until the receiving midwife accepts the transfer.</p>
      </div>
      <div id="sentTransferTracking"></div>
    </div>
  </div>

  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/vendor/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/transfer-load-utils.js"></script>
  <script src="js/high-risk-utils.js"></script>
  <script src="js/sent-transfer-hrt-view.js"></script>
  <script src="js/lang-apply.js"></script>
  <script src="js/ui-dialogs.js"></script>
  <script>
    function transferNotice(message) {
      if (window.AppDialog && AppDialog.alert) {
        return AppDialog.alert(String(message || ''), { title: 'Notice' });
      }
      alert(message);
    }

    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      transferNotice(localStorage.getItem('appLanguage') === 'en'
        ? 'Patient transfers are available online only. Please reconnect to the internet and try again.'
        : 'လူနာလွှဲပြောင်းမှုကို အင်တာနက်ချိတ်ဆက်ထားမှသာ အသုံးပြုနိုင်ပါသည်။');
      window.location.href = 'home.html';
    }

    window.onAppLanguageChange = function () {
      if (window._transferHubUser && window.SentTransferHrtView) {
        SentTransferHrtView.loadAndRender(document.getElementById('sentTransferTracking'), window._transferHubUser);
      }
    };

    firebase.auth().onAuthStateChanged(async function (user) {
      user = window.resolvePilotAuthUser ? window.resolvePilotAuthUser(user) : user;
      if (!user || user.isPilotCachedUser) return;
      window._transferHubUser = user.uid;
      await Promise.all([
        loadIncomingTransferBadge(user.uid),
        window.SentTransferHrtView
          ? SentTransferHrtView.loadAndRender(document.getElementById('sentTransferTracking'), user.uid)
          : Promise.resolve()
      ]);
    });

    function smartQuery(queryPromise, options) {
      if (window.TransferLoadUtils && TransferLoadUtils.smartQuery) {
        return TransferLoadUtils.smartQuery(queryPromise, options);
      }
      return queryPromise.then(function (q) { return q.get(); });
    }

    async function loadIncomingTransferBadge(uid) {
      const badge = document.getElementById('receiveTransferBadge');
      const card = document.getElementById('receiveTransfersCard');
      const desc = document.getElementById('receiveTransferDesc');
      if (!badge || !card) return;
      try {
        const snap = await smartQuery(
          Promise.resolve(firebase.firestore()
            .collection('patient_transfer_requests')
            .where('targetMidwifeIds', 'array-contains', uid)
            .limit(80)),
          { timeout: 10000, retries: 2 }
        );
        let count = 0;
        snap.forEach(function (doc) {
          if ((doc.data().status || 'pending') === 'pending') count++;
        });
        if (count > 0) {
          badge.textContent = count > 99 ? '99+' : String(count);
          badge.classList.remove('d-none');
          card.classList.add('has-pending');
          if (desc) {
            var isEn = (localStorage.getItem('appLanguage') || 'mm') === 'en';
            desc.innerHTML = isEn
              ? '<strong style="color:#b91c1c;">' + count + ' transfer' + (count === 1 ? '' : 's') + ' waiting for you.</strong> Accept patients into your care.'
              : '<strong style="color:#b91c1c;">' + count + ' ခု စောင့်ဆိုင်းနေသည်။</strong> လူနာများကို လက်ခံပါ။';
          }
        } else {
          badge.classList.add('d-none');
          card.classList.remove('has-pending');
          if (desc && desc.dataset) {
            var lang = localStorage.getItem('appLanguage') || 'mm';
            desc.textContent = desc.dataset[lang] || desc.dataset.en || desc.textContent;
          }
        }
      } catch (e) {
        console.warn('Incoming transfer badge failed', e);
      }
    }

    function goToTransfer(action) {
      if (typeof navigator !== 'undefined' && navigator.onLine === false) {
        transferNotice(localStorage.getItem('appLanguage') === 'en'
          ? 'Patient transfers are available online only. Please reconnect to the internet and try again.'
          : 'လူနာလွှဲပြောင်းမှုကို အင်တာနက်ချိတ်ဆက်ထားမှ�ာ အသုံးပြုနိုင်ပါသည်။');
        return;
      }
      window.location.href = action === 'send' ? 'transfer-patient.html' : 'transfer-requests.html';
    }
  </script>
</body>
</html>
