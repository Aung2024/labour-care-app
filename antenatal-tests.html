<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Antenatal Tests - Maternal & Child Health Care System</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="css/vendor/fontawesome-all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/vendor/bootstrap.bundle.min.js"></script>
  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-firestore.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/patient-session.js"></script>
  <script src="js/session-manager.js"></script>
  <style>
    :root {
      --primary-color: #10b981;
      --secondary-color: #059669;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --card-hover-shadow: 0 16px 32px rgba(15, 23, 42, 0.12);
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Inter', 'Myanmar Text', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #0f172a;
    }

    .header-section {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 1.25rem 1.5rem;
      margin-bottom: 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .header-section .container,
    .anc-main-container {
      max-width: 760px;
    }

    .header-section h1 {
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.25;
      margin: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .anc-main-container {
      flex: 1;
      width: 100%;
      padding-top: 1.25rem;
      padding-bottom: 2rem;
    }

    #patientBanner > div {
      border-radius: 16px !important;
      margin-bottom: 1rem !important;
      padding: 0.9rem 1rem !important;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.12) !important;
    }

    .care-modules {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.85rem;
    }

    .module-card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 16px;
      padding: 1rem 1.1rem;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
      transition: all 0.3s ease;
      cursor: pointer;
      border: 1px solid rgba(16, 185, 129, 0.15);
      border-left: 5px solid var(--primary-color);
      display: flex;
      align-items: center;
      gap: 1rem;
      min-height: 92px;
    }

    .module-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--card-hover-shadow);
    }

    .module-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #d1fae5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 48px;
      font-size: 1.35rem;
      color: var(--primary-color);
    }

    .module-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 0.2rem;
      line-height: 1.35;
    }

    .module-description {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 0;
      line-height: 1.45;
    }

    .module-content { flex: 1; min-width: 0; }
    .module-arrow { color: #94a3b8; font-size: 0.95rem; flex: 0 0 auto; }

    .footer {
      background: rgba(255, 255, 255, 0.95);
      color: #374151;
      text-align: center;
      padding: 1.25rem;
      margin-top: auto;
      border-radius: 20px 20px 0 0;
      box-shadow: var(--card-shadow);
      width: 100%;
    }

    .language-switcher {
      display: flex;
      gap: 0.25rem;
      align-items: center;
    }

    .language-btn {
      padding: 0.375rem 0.75rem;
      font-size: 0.875rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
    }

    .language-btn.active {
      background: rgba(255, 255, 255, 0.4);
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .header-section { padding: 1rem; }
      .header-section h1 { font-size: 1.2rem; }
      .header-actions { justify-content: stretch; gap: 0.45rem; }
      .header-actions .btn-outline-light { flex: 1 1 0; }
      .anc-main-container { padding: 1rem 0.85rem 1.5rem; }
      .module-card { min-height: 84px; padding: 0.9rem; }
    }
  </style>
  <script>
    let currentUser = null;
    let currentLanguage = localStorage.getItem('appLanguage') || 'mm';

    function switchLanguage(lang) {
      currentLanguage = lang;
      localStorage.setItem('appLanguage', lang);
      document.querySelectorAll('.language-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      document.querySelectorAll('.lang-text').forEach(function (el) {
        el.textContent = el.dataset[lang] || el.dataset.en || el.textContent;
      });
    }

    function hubT(en, mm) {
      return currentLanguage === 'en' ? en : mm;
    }

    function startNewTest() {
      var patientId = sessionStorage.getItem('selectedPatientId');
      if (!patientId) {
        alert(hubT('No patient selected. Please select a patient first.', 'လူနာ မရွေးချယ်ရသေးပါ။'));
        window.location.href = 'list.html';
        return;
      }
      window.location.href = 'antenatal-tests-form.html?patient=' + patientId;
    }

    function viewTestHistory() {
      var patientId = sessionStorage.getItem('selectedPatientId');
      if (!patientId) {
        alert(hubT('No patient selected. Please select a patient first.', 'လူနာ မရွေးချယ်ရသေးပါ။'));
        window.location.href = 'list.html';
        return;
      }
      window.location.href = 'antenatal-tests-list.html?patient=' + patientId;
    }

    function usePromoVoucher() {
      var patientId = sessionStorage.getItem('selectedPatientId');
      if (!patientId) {
        alert(hubT('No patient selected. Please select a patient first.', 'လူနာ မရွေးချယ်ရသေးပါ။'));
        window.location.href = 'list.html';
        return;
      }
      if (navigator.onLine === false) {
        alert(hubT('Internet is required to issue a voucher.', 'Voucher ထုတ်ရန် အင်တာနက်လိုအပ်ပါသည်။'));
        return;
      }
      window.location.href = 'promo-voucher.html?patientId=' + encodeURIComponent(patientId);
    }

    firebase.auth().onAuthStateChanged(async function (user) {
      user = window.resolvePilotAuthUser ? window.resolvePilotAuthUser(user) : user;
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      var patientSession = initializePatientSession(true);
      if (patientSession) {
        await displayPatientBanner('patientBanner');
      }
    });

    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.language-btn').forEach(function (btn) {
        btn.addEventListener('click', function () { switchLanguage(btn.dataset.lang); });
      });
      switchLanguage(currentLanguage);
    });
  </script>
</head>
<body>
  <div class="header-section">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6">
          <h1 class="mb-2">
            <i class="fas fa-vial me-3"></i>
            <span class="lang-text" data-en="Tests & Results" data-mm="ဓါတ်ခွဲ စစ်ဆေးမှုများနှင့် ရလဒ်အဖြေများ">Tests & Results</span>
          </h1>
        </div>
        <div class="col-md-6">
          <div class="header-actions">
            <div class="language-switcher">
              <button type="button" class="btn btn-sm language-btn" data-lang="en"><span>🇬🇧</span> ENG</button>
              <button type="button" class="btn btn-sm language-btn active" data-lang="mm"><span>🇲🇲</span> MM</button>
            </div>
            <a href="antenatal-care.html" class="btn btn-outline-light btn-sm">
              <i class="fas fa-arrow-left me-2"></i><span class="lang-text" data-en="Back to ANC" data-mm="ကိုယ်ဝန်ဆောင် ပြုစုစောင့်ရှောက်မှုသို့">Back to ANC</span>
            </a>
            <button class="btn btn-outline-light btn-sm" onclick="firebase.auth().signOut(); localStorage.clear(); window.location='login.html';">
              <i class="fas fa-sign-out-alt me-2"></i><span class="lang-text" data-en="Logout" data-mm="ထွက်ရန်">Logout</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <main class="container anc-main-container">
    <div id="patientBanner"></div>
    <div class="care-modules">
      <div class="module-card" onclick="startNewTest()">
        <div class="module-icon"><i class="fas fa-plus-circle"></i></div>
        <div class="module-content">
          <div class="module-title lang-text" data-en="New Test" data-mm="စစ်ဆေးမှု အသစ်">New Test</div>
          <div class="module-description lang-text" data-en="Record new laboratory test results." data-mm="ဓာတ်ခွဲခန်း စစ်ဆေးမှု ရလဒ်အသစ် မှတ်တမ်းတင်ရန်">Record new laboratory test results.</div>
        </div>
        <i class="fas fa-chevron-right module-arrow"></i>
      </div>
      <div class="module-card" onclick="viewTestHistory()">
        <div class="module-icon"><i class="fas fa-history"></i></div>
        <div class="module-content">
          <div class="module-title lang-text" data-en="Test History" data-mm="စစ်ဆေးမှု မှတ်တမ်း">Test History</div>
          <div class="module-description lang-text" data-en="View all previous test records." data-mm="ယခင်စစ်ဆေးမှု မှတ်တမ်းများကို ကြည့်ရှုရန်">View all previous test records.</div>
        </div>
        <i class="fas fa-chevron-right module-arrow"></i>
      </div>
      <div class="module-card" onclick="usePromoVoucher()">
        <div class="module-icon"><i class="fas fa-ticket-alt"></i></div>
        <div class="module-content">
          <div class="module-title lang-text" data-en="Use Voucher" data-mm="Voucher အသုံးပြုရန်">Use Voucher</div>
          <div class="module-description lang-text" data-en="Create a promo voucher for basic investigation." data-mm="အခြေခံ ဓာတ်ခွဲစစ်ဆေးမှုအတွက် ပရိုမိုးရှင်း Voucher ထုတ်ရန်။">Create a promo voucher for basic investigation.</div>
        </div>
        <i class="fas fa-chevron-right module-arrow"></i>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="mb-0"><i class="fas fa-heart me-2"></i>MNCH App 2025 | Developed by Jhpiego Myanmar for MoH.</p>
    </div>
  </footer>
</body>
</html>
