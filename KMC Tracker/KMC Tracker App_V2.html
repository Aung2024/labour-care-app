<body>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect } = React;

        // --- SUPABASE SETUP ---
        const SUPABASE_URL = 'https://nxvfjzduumcrwbbcirhq.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_--ZCzLr7SAZnTklVkKUq5Q_-3cGp9Ha';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ==========================================
        // 🚨 ROLE-BASED ACCESS CONTROL (RBAC) CONFIG
        // ==========================================
        const ADMIN_EMAILS = [

        // --- LOGIN COMPONENT ---
        const LoginForm = ({ supabase }) => {

            return (

                            </div>
                            <h2 className="text-2xl font-black text-gray-800 uppercase tracking-wide">KMC Tracker</h2>

                        </div>
                        {errorMsg && (

                        <form onSubmit={handleLogin} className="space-y-5">

                                    <input type="email" required className="w-full bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block pl-10 p-3 outline-none transition-all" placeholder="Enter your email" value={email} onChange={(e) => setEmail(e.target.value)} />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-600 uppercase mb-2">Password</label>
                                <div className="relative">
                                    <i className="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                    <input type="password" required className="w-full bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block pl-10 p-3 outline-none transition-all" placeholder="Enter your password" value={password} onChange={(e) => setPassword(e.target.value)} />
                                </div>
                            </div>
                            <button type="submit" disabled={loading} className="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-bold rounded-lg text-sm px-5 py-3.5 text-center shadow-md hover:shadow-lg transition-all flex items-center justify-center">

                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- DATA DICTIONARY FOR KMC BARRIERS ---
        const kmcBarriers = {
          "1. Physical and Emotional Strain": [
            { reason: "Physical Pain and Fatigue", detail: "Exhaustion is a top barrier, particularly after C-section recovery or when managing other children." },
            { reason: "Discomfort during Sleep", detail: "Difficulty sleeping while in a semi-reclined or upright position with the baby restricts rest." },
            { reason: "Mental Health and Guilt", detail: "Postpartum depression and anxiety over having a premature baby can reduce a mother’s willingness or ability to perform continuous KMC." }
          ],
          "2. Logistical and Practical Challenges": [
            { reason: "Lack of Support", detail: "The absence of help with KMC practice (e.g., family members taking turns) or other obligations (household chores, caring for other children) is a major factor." },
            { reason: "Time Limitations and Household Duties", detail: "Many mothers stop KMC because they cannot manage it alongside home responsibilities or work." },
            { reason: "Infant Fussy/Discomfort", detail: "If the baby cries, feels uncomfortable, or seems too warm, parents tend to discontinue the session." },
            { reason: "Medical Issues and Complications", detail: "The mother's own health issues (e.g., pain, illness) or the baby's discomfort (e.g., being attached to medical devices) hampers continuity." }
          ],
          "3. Sociocultural and Behavioral Factors": [
            { reason: "Cultural Beliefs and Confinement", detail: "In some regions, traditional practices conflict with KMC." },
            { reason: "Resistance from Family Members", detail: "Grandparents or other family members may discourage KMC, believing the baby needs to be in a cot." },
            { reason: "Modesty and Privacy", detail: "Lack of privacy in overcrowded hospital wards makes mothers uncomfortable." }
          ],
          "4. Health System Barriers": [
            { reason: "Poor Counseling and Education", detail: "Lack of adequate training and understanding of the benefits of KMC makes parents less likely to adhere to it." },
            { reason: "Negative Experience with Staff", detail: "Poor interaction with healthcare providers or feeling pressured to do KMC can cause clients to abandon the practice." },
            { reason: "Resource Constraints", detail: "Lack of proper facilities (e.g., chairs, screens, blankets) in hospitals." }
          ],
          "5. Reasons for Planned Discontinuation": [
            { reason: "Baby Reaching Target Weight", detail: "Often, when the baby grows, gains weight, and becomes more active or uncomfortable in the KMC position, mothers stop." },
            { reason: "Baby's Improved Health", detail: "The perception that the baby is strong enough and no longer needs special care." }
          ]
        };

        // --- HELPERS ---
        const getTodayDate = () => new Date().toISOString().split('T')[0];

        const calculateAgeInDays = (dobString) => {
          if (!dobString) return '-';
          const diffTime = Math.abs(new Date() - new Date(dobString));
          return Math.floor(diffTime / (1000 * 60 * 60 * 24)); 
        };

        const getDaysBetween = (start, end) => {
            if (!start || !end) return null;
            const diff = new Date(end) - new Date(start);
            return Math.floor(diff / (1000 * 3600 * 24));
        };

        const addDays = (dateStr, days) => {
          if (!dateStr) return '';
          const d = new Date(dateStr);
          d.setDate(d.getDate() + days);
          return d.toISOString().split('T')[0];
        };

        const getDiffDays = (dateStr) => {
          if (!dateStr) return 0;
          const diffTime = new Date() - new Date(dateStr);
          return diffTime / (1000 * 3600 * 24);
        };

        const deriveOutcome = (client) => {
          if (client.manualOutcome) return client.manualOutcome;

          if (!client.visits) return 'Active';
          if (client.visits.some(v => v.visitStatus === 'Death')) return 'Death';
          if (client.visits.some(v => v.visitStatus === 'Refer to higher center')) return 'Referred';
          if (client.visits.some(v => v.visitStatus === 'Loss of contact')) return 'Defaulted';

          const completedVisits = client.visits.filter(v => v.done || v.visitStatus === 'Attended').length;
          if (completedVisits >= 3) return 'Completed';

          let isDropOff = false;
          let isOverdue = false;

          client.visits.forEach(v => {
            if (!v.done && v.visitStatus !== 'Attended' && v.scheduledDate) {
              const diffDays = getDiffDays(v.scheduledDate);
              if (diffDays > 30) isDropOff = true;
              else if (diffDays > 7) isOverdue = true;
            }
          });

          if (isDropOff) return 'Defaulted';
          if (isOverdue) return 'Overdue';

          return 'Active'; 
        };

        const parseCSVRow = (row) => {
          const result = [];
          let current = '';
          let inQuotes = false;
          for (let i = 0; i < row.length; i++) {
            const char = row[i];
            if (char === '"') inQuotes = !inQuotes;
            else if (char === ',' && !inQuotes) { result.push(current); current = ''; } 
            else current += char;
          }
          result.push(current);
          return result.map(s => s.replace(/^"|"$/g, '').replace(/""/g, '"'));
        };

        const checkGraduation = (client) => {
            if (!client) return { meets: false };
            let maxW = parseFloat(client.birthWeight || 0);
            let maxDays = 0;
            (client.visits || []).forEach(v => {
                if (v.weight && parseFloat(v.weight) > maxW) maxW = parseFloat(v.weight);
                if (v.date) {
                    let d = getDaysBetween(client.dob, v.date);
                    if (d > maxDays) maxDays = d;
                }
            });
            let cga = parseInt(client.gestationalAge || 0) + Math.floor(maxDays / 7);
            return { meets: cga >= 40 || maxW >= 2.5, cga, maxW };
        };

        const initialLocations = {
          'Yangon': ['Thanlyin', 'Insein', 'Dala', 'South Dagon', 'Hlaingthaya'],
          'Bago': ['Bago', 'Taungoo', 'Pyay'],
          'Mandalay': ['Mandalay', 'Meiktila', 'Pyin Oo Lwin'],
          'Ayeyarwady': ['Pathein', 'Hinthada', 'Myaungmya', 'Maubin']
        };

        const PIE_COLORS = ['#ef4444', '#f59e0b', '#3b82f6', '#10b981', '#8b5cf6', '#64748b'];

        // --- SPLASH SCREEN COMPONENT ---
        const SplashScreen = ({ isFading }) => (
            <div className={`fixed inset-0 bg-blue-600 flex flex-col items-center justify-center z-[100] ${isFading ? 'splash-exit' : ''}`}>
                <div className="animate-float flex flex-col items-center">
                    <div className="relative mb-6">
                        <i className="fa-solid fa-person-breastfeeding text-white text-8xl"></i>
                        <i className="fa-solid fa-heart text-pink-400 text-3xl absolute -right-2 -top-2 animate-ping"></i>
                    </div>
                    <h1 className="text-white text-4xl font-extrabold tracking-widest uppercase shadow-black drop-shadow-md">KMC Tracker</h1>
                    <p className="text-blue-200 mt-3 font-medium tracking-wide">Developed by Jhpiego Myanmar</p>
                    
                    <div className="mt-12 flex space-x-2">
                        <div className="w-3 h-3 bg-white rounded-full animate-bounce" style={{animationDelay: "0ms"}}></div>
                        <div className="w-3 h-3 bg-white rounded-full animate-bounce" style={{animationDelay: "150ms"}}></div>
                        <div className="w-3 h-3 bg-white rounded-full animate-bounce" style={{animationDelay: "300ms"}}></div>
                    </div>
                </div>
            </div>
        );

        // --- COMPONENT: EXPORTABLE CHART WRAPPER ---
        const VisualizationCard = ({ id, title, subtitle, headerExtras, children }) => {
          const handleDownload = () => {
            const element = document.getElementById(id);
            element.classList.add('exporting');
            html2canvas(element, { scale: 3, useCORS: true, backgroundColor: '#ffffff' }).then(canvas => {
              element.classList.remove('exporting');
              const link = document.createElement('a');
              link.download = `${title.replace(/\s+/g, '_')}_A5_Export.png`;
              link.href = canvas.toDataURL('image/png');
              link.click();
            });
          };

          return (
            <div className="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col relative group hover-card">
              <div className="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50 rounded-t-xl">
                <div>
                    <h3 className="font-bold text-gray-800 flex items-center text-sm">{title}</h3>
                    {subtitle && <p className="text-[10px] text-gray-500 mt-0.5">{subtitle}</p>}
                </div>
                <div className="flex items-center space-x-3">
                  {headerExtras}
                  <button onClick={handleDownload} className="text-gray-500 hover:text-blue-600 bg-white border border-gray-200 hover:border-blue-300 px-3 py-1.5 rounded text-xs font-bold transition-all shadow-sm flex items-center btn-active">
                    <i className="fa-solid fa-download mr-1.5"></i> Export
                  </button>
                </div>
              </div>
              
              <div className="p-4 flex-1 flex justify-center items-center bg-gray-100/50">
                 <div id={id} className="bg-white w-full relative flex flex-col shadow-sm border border-gray-200 overflow-hidden" style={{ aspectRatio: '1.414 / 1', padding: '20px' }}>
                    <div className="text-center mb-6 pb-2 border-b border-gray-100 shrink-0">
                        <h2 className="text-xl font-black text-gray-800 uppercase">{title}</h2>
                        <p className="text-[10px] text-gray-500 tracking-widest mt-1">KMC Tracking Dashboard • Developed by Jhpiego Myanmar</p>
                    </div>
                    <div className="flex-1 w-full min-h-0 relative">
                      {children}
                    </div>
                 </div>
              </div>
            </div>
          );
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
          const [session, setSession] = useState(null);
          const [authChecking, setAuthChecking] = useState(true);
          const [userRole, setUserRole] = useState(null);

          const [showSplash, setShowSplash] = useState(true);
          const [splashFading, setSplashFading] = useState(false);

          const [outcomeView, setOutcomeView] = useState('bar');
          const [attendanceView, setAttendanceView] = useState('bar');
          const [barrierView, setBarrierView] = useState('bar');
          const [dangerView, setDangerView] = useState('bar');

          // GLOBAL FILTER STATES
          const [trendFilterTownship, setTrendFilterTownship] = useState('All');
          const [trendFilterMonth, setTrendFilterMonth] = useState('All');
          const [trendFilterYear, setTrendFilterYear] = useState('All');

          const [activeTab, setActiveTab] = useState('registry'); 

          // Check Session
          const handleSessionUpdate = (currentSession) => {
              setSession(currentSession);
              if (currentSession?.user?.email) {
                  const role = ADMIN_EMAILS.includes(currentSession.user.email) ? 'admin' : 'data_entry';
                  setUserRole(role);
                  if (role === 'data_entry') {
                      setActiveTab('registry');
                  } else if (activeTab === 'registry' && role === 'admin') {
                      setActiveTab('dashboard'); 
                  }
              } else {
                  setUserRole(null);
              }
          };

          useEffect(() => {
            supabase.auth.getSession().then(({ data: { session }, error }) => {
              if (error) {
                  console.warn("Auth session error:", error.message);
                  supabase.auth.signOut(); 
                  handleSessionUpdate(null);
              } else {
                  handleSessionUpdate(session);
              }
              setAuthChecking(false);
            }).catch((err) => {
              console.warn("Unexpected auth error:", err);
              setAuthChecking(false);
            });

            const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
              if (event === 'SIGNED_OUT' || event === 'USER_DELETED') {
                  handleSessionUpdate(null);
              } else {
                  handleSessionUpdate(session);
              }
            });
            return () => subscription.unsubscribe();
          }, []);

          // Splash screen timings
          useEffect(() => {
              const fadeTimer = setTimeout(() => setSplashFading(true), 2000);
              const hideTimer = setTimeout(() => setShowSplash(false), 2800);
              return () => { clearTimeout(fadeTimer); clearTimeout(hideTimer); };
          }, []);

          const [clients, setClients] = useState([]);
          const [isLoadingData, setIsLoadingData] = useState(false);

          useEffect(() => {
             if (session) fetchClients();
          }, [session]);

          const fetchClients = async () => {
             setIsLoadingData(true);
             const { data, error } = await supabase.from('kmc_clients').select('*').order('id', { ascending: false });
             if (error) {
                 console.error("Error fetching data:", error);
                 alert("Failed to load data from Supabase. Check your table structure.");
             } else {
                 setClients(data || []);
             }
             setIsLoadingData(false);
          };

          const [searchTerm, setSearchTerm] = useState('');
          const [searchTownship, setSearchTownship] = useState('All');
          const [searchStatus, setSearchStatus] = useState('All'); 
          
          const fileInputRef = useRef(null);
          const [isNotiOpen, setIsNotiOpen] = useState(false);

          const [locations, setLocations] = useState(() => {
              const savedLocs = localStorage.getItem('kmc_locations_data');
              return savedLocs ? JSON.parse(savedLocs) : {
                  'Yangon': ['Thanlyin', 'Insein', 'Dala', 'South Dagon', 'Hlaingthaya'],
                  'Bago': ['Bago', 'Taungoo', 'Pyay'],
                  'Mandalay': ['Mandalay', 'Meiktila', 'Pyin Oo Lwin'],
                  'Ayeyarwady': ['Pathein', 'Hinthada', 'Myaungmya', 'Maubin']
              };
          });
          useEffect(() => { localStorage.setItem('kmc_locations_data', JSON.stringify(locations)); }, [locations]);

          const [newRegion, setNewRegion] = useState('');
          const [selectedRegionForTownship, setSelectedRegionForTownship] = useState('Yangon');
          const [newTownship, setNewTownship] = useState('');

          const [isClientModalOpen, setIsClientModalOpen] = useState(false);
          const [isVisitModalOpen, setIsVisitModalOpen] = useState(false);
          const [selectedClient, setSelectedClient] = useState(null);
          const [activeVisitTab, setActiveVisitTab] = useState(0); 
          const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null });

          // Graduation States
          const [showGradPrompt, setShowGradPrompt] = useState(false);
          const [gradOutcome, setGradOutcome] = useState('Completed');

          const [formData, setFormData] = useState({
            clientId: '',
            registrationDate: getTodayDate(),
            reportingMonth: 'February', reportingYear: new Date().getFullYear().toString(), region: '', township: '', clientName: '', 
            dob: '', gestationalAge: '', birthWeight: '', dischargeDate: '',
            parentName: '', address: '', primaryPhone: '', secondaryPhone: '', kmcBinder: 'Yes', completionDate: ''
          });

          const availableYears = useMemo(() => {
             return [...new Set(clients.map(c => c.reportingYear || new Date().getFullYear().toString()))].sort().reverse();
          }, [clients]);

          const availableMonths = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

          // --- GLOBAL FILTERING LOGIC ---
          const filteredDashboardClients = useMemo(() => {
            let filtered = clients;
            if (trendFilterYear !== 'All') filtered = filtered.filter(c => (c.reportingYear || new Date().getFullYear().toString()) === trendFilterYear);
            if (trendFilterMonth !== 'All') filtered = filtered.filter(c => c.reportingMonth === trendFilterMonth);
            if (trendFilterTownship !== 'All') filtered = filtered.filter(c => c.township === trendFilterTownship);
            return filtered;
          }, [clients, trendFilterYear, trendFilterMonth, trendFilterTownship]);


          // --- CHART 1: TREND DATA ---
          const trendChartData = useMemo(() => {
            let monthTownshipObj = {};
            let uniqueTownships = new Set();
            filteredDashboardClients.forEach(c => {
                const m = c.reportingMonth || 'Unknown';
                const t = c.township || 'Unknown';
                uniqueTownships.add(t);
                if (!monthTownshipObj[m]) monthTownshipObj[m] = {};
                monthTownshipObj[m][t] = (monthTownshipObj[m][t] || 0) + 1;
            });

            const monthsOrdered = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            const data = Object.keys(monthTownshipObj)
                .sort((a,b) => monthsOrdered.indexOf(a) - monthsOrdered.indexOf(b))
                .map(m => {
                    let obj = { month: m.substring(0,3) };
                    Object.keys(monthTownshipObj[m]).forEach(t => {
                        obj[t] = monthTownshipObj[m][t];
                    });
                    return obj;
                });
            
            return { data, townshipsList: Array.from(uniqueTownships) };
          }, [filteredDashboardClients]);

          // --- METRICS ---
          const metrics = useMemo(() => {
            let total = filteredDashboardClients.length;
            let completed = 0, onTrack = 0, dropOff = 0, death = 0;
            filteredDashboardClients.forEach(c => {
              const status = deriveOutcome(c);
              if (status === 'Completed') completed++;
              else if (status === 'Defaulted') dropOff++;
              else if (status === 'Death') death++;
              else onTrack++; 
            });
            return { total, completed, onTrack, dropOff, death };

                  });

                              )}

                          </div>
                        </div>
                      </div>

                      <div className="bg-red-50 rounded-xl border border-red-200 overflow-hidden mt-8 hover-card">
                        <div className="p-6 flex flex-col md:flex-row justify-between items-center gap-4">
                          <div className="flex items-center space-x-4">
                            <div className="bg-red-100 p-3 rounded-full text-red-600"><i className="fa-solid fa-triangle-exclamation text-2xl"></i></div>
                            <div>
                              <h4 className="font-bold text-red-800">Danger Zone: Delete All Client Data</h4>
                              <p className="text-sm text-red-600 mt-1">This action is permanent and will remove all registered clients from the system.</p>
                            </div>
                          </div>
                          <button onClick={handleClearAllData} className="btn-active shrink-0 bg-red-600 hover:bg-red-700 text-white px-5 py-3 rounded-lg font-medium transition-all shadow-sm hover:shadow-md">Clear All Data</button>
                        </div>
                      </div>
                    </div>
                  )}
                </main>
              </div>

              {/* MODALS */}
              {/* Register New Client Modal */}
              {isClientModalOpen && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[60] p-4">
                  <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto animate-pop-in">
                    <div className="sticky top-0 bg-white border-b border-gray-100 p-6 flex justify-between items-center z-10">
                      <h2 className="text-xl font-bold text-gray-800 flex items-center"><i className="fa-solid fa-user-plus mr-2 text-blue-600"></i> Register New Client</h2>
                      <button onClick={() => setIsClientModalOpen(false)} className="btn-active text-gray-400 hover:text-red-500 transition-colors bg-gray-100 hover:bg-red-50 w-8 h-8 rounded-full flex items-center justify-center"><i className="fa-solid fa-xmark"></i></button>
                    </div>
                    <form onSubmit={handleSaveClient} className="p-6 space-y-6">
                      <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div className="col-span-1 md:col-span-4 pb-2 border-b border-gray-100"><h3 className="font-semibold text-blue-800">1. Tracking & Location</h3></div>
                        
                        <div className="col-span-1 md:col-span-4">
                            <label className="block text-xs font-semibold text-gray-600 mb-1">Client ID (Registration Code)</label>
                            <input type="text" className="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-colors hover:border-blue-300" value={formData.clientId} onChange={e => setFormData({...formData, clientId: e.target.value})} placeholder="Leave blank to auto-generate (e.g. KMC-001-XXXX)"/>

                        <div className="md:col-span-2 grid grid-cols-2 gap-4">
                            <div><label className="block text-xs font-semibold text-gray-600 mb-1">Date of Registration</label>

                            <div><label className="block text-xs font-semibold text-gray-600 mb-1">Reporting Month</label>
                            <select className="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-colors hover:border-blue-300 cursor-pointer" value={formData.reportingMonth} onChange={e => setFormData({...formData, reportingMonth: e.target.value})}>
                                {['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'].map(m => <option key={m}>{m}</option>)}
                            </select></div>
                        </div>

                        <div><label className="block text-xs font-semibold text-gray-600 mb-1">Region</label><select required className="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-colors hover:border-blue-300 cursor-pointer" value={formData.region} onChange={e => { const r = e.target.value; setFormData({...formData, region: r, township: locations[r]?.[0] || ''}); }}><option value="" disabled>Select Region</option>{Object.keys(locations).map(r => <option key={r} value={r}>{r}</option>)}</select></div>
                        <div><label className="block text-xs font-semibold text-gray-600 mb-1">Township</label><select required className="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none disabled:bg-gray-100 transition-colors hover:border-blue-300 cursor-pointer" value={formData.township} onChange={e => setFormData({...formData, township: e.target.value})} disabled={!formData.region}><option value="" disabled>Select Township</option>{(locations[formData.region] || []).map(t => <option key={t} value={t}>{t}</option>)}</select></div>
                        
                        <div><label className="block text-xs font-semibold text-gray-600 mb-1">Reporting Year</label>
                        <select className="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-colors hover:border-blue-300 cursor-pointer" value={formData.reportingYear} onChange={e => setFormData({...formData, reportingYear: e.target.value})}>
                            {['2025', '2026', '2027', '2028', '2029', '2030'].map(y => <option key={y}>{y}</option>)}
                        </select></div>
                        <div><label className="block text-xs font-semibold text-gray-600 mb-1">Given Newborn KMC Kit?</label><select className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-colors hover:border-blue-300 cursor-pointer" value={formData.kmcBinder} onChange={e => setFormData({...formData, kmcBinder: e.target.value})}><option>Yes</option><option>No</option></select></div>

                        <div className="col-span-1 md:col-span-4 pb-2 border-b border-gray-100 mt-2 flex items-center justify-between">
                          <h3 className="font-semibold text-blue-800">2. Clinical & Baby Info</h3>
                          {(() => {
                            const isLbw = formData.birthWeight !== '' && !isNaN(formData.birthWeight) && Number(formData.birthWeight) < 2.5;
                            const isPrem = formData.gestationalAge !== '' && !isNaN(formData.gestationalAge) && Number(formData.gestationalAge) < 37;
                            if (isLbw || isPrem) {
                                return (
                                    <div className="flex space-x-2 animate-pop-in">
                                        {isLbw && <span className="bg-red-100 text-red-700 text-xs px-2 py-1 rounded font-bold">Auto-Flagged: LBW</span>}
                                        {isPrem && <span className="bg-orange-100 text-orange-700 text-xs px-2 py-1 rounded font-bold">Auto-Flagged: Premature</span>}
                                    </div>
                                );
                            }
                            return null;
                          })()}
                        </div>
                        <div className="md:col-span-2"><label className="block text-xs font-semibold text-gray-600 mb-1">Baby's Name / ID Name</label><input required type="text" className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-colors hover:border-blue-300" value={formData.clientName} onChange={e => setFormData({...formData, clientName: e.target.value})} placeholder="e.g. Baby Name"/></div>
                        <div><label className="block text-xs font-semibold text-gray-600 mb-1">Date of Birth (DOB)</label><input required type="date" max={getTodayDate()} className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-colors hover:border-blue-300 cursor-pointer" value={formData.dob} onChange={e => setFormData({...formData, dob: e.target.value})}/></div>
                        <div><label className="block text-xs font-semibold text-gray-600 mb-1">Gestational Age (Weeks)</label><input required type="number" className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-colors hover:border-blue-300" value={formData.gestationalAge} onChange={e => setFormData({...formData, gestationalAge: e.target.value})} placeholder="e.g. 35"/></div>
                        <div><label className="block text-xs font-semibold text-gray-600 mb-1">Birth Weight (kg)</label><input required type="number" step="0.01" className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-colors hover:border-blue-300" value={formData.birthWeight} onChange={e => setFormData({...formData, birthWeight: e.target.value})} placeholder="e.g. 2.0"/></div>
                        <div><label className="block text-xs font-semibold text-gray-600 mb-1">Discharge Date</label><input required type="date" max={getTodayDate()} className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-colors hover:border-blue-300 cursor-pointer" value={formData.dischargeDate} onChange={e => setFormData({...formData, dischargeDate: e.target.value})}/></div>
                        <div className="md:col-span-2">
                          <div className="bg-blue-50 p-2 rounded-lg border border-blue-100 flex items-start space-x-2 mt-1 transition-colors hover:bg-blue-100 cursor-default">
                            <i className="fa-regular fa-calendar-check text-blue-500 shrink-0 mt-0.5"></i>
                            <p className="text-xs text-blue-800"><strong>Auto-Scheduling:</strong> Visits will be scheduled automatically based on the Discharge Date (+3 Days, +10 Days, +24 Days).</p>
                          </div>
                        </div>

                        <div className="col-span-1 md:col-span-4 pb-2 border-b border-gray-100 mt-2"><h3 className="font-semibold text-blue-800">3. Family & Contact</h3></div>
                        <div className="md:col-span-2"><label className="block text-xs font-semibold text-gray-600 mb-1">Parent's Name</label><input required type="text" className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-colors hover:border-blue-300" value={formData.parentName} onChange={e => setFormData({...formData, parentName: e.target.value})} placeholder="Mother/Father Name"/></div>
                        <div className="md:col-span-1"><label className="block text-xs font-semibold text-gray-600 mb-1">Primary Phone</label><input type="text" className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-colors hover:border-blue-300" value={formData.primaryPhone} onChange={e => setFormData({...formData, primaryPhone: e.target.value})} placeholder="e.g. 09-123456789"/></div>
                        <div className="md:col-span-1"><label className="block text-xs font-semibold text-gray-600 mb-1">Secondary Phone</label><input type="text" className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-colors hover:border-blue-300" value={formData.secondaryPhone} onChange={e => setFormData({...formData, secondaryPhone: e.target.value})} placeholder="Alt Contact"/></div>
                        <div className="md:col-span-4"><label className="block text-xs font-semibold text-gray-600 mb-1">Address</label><input type="text" className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-colors hover:border-blue-300" value={formData.address} onChange={e => setFormData({...formData, address: e.target.value})} placeholder="House No, Street, Quarter"/></div>
                      </div>
                      <div className="pt-6 mt-4 border-t border-gray-100 flex justify-end space-x-3">
                        <button type="button" onClick={() => setIsClientModalOpen(false)} className="btn-active px-5 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors">Cancel</button>
                        <button type="submit" className="btn-active px-5 py-2 text-white bg-blue-600 hover:bg-blue-700 rounded-lg font-medium transition-colors shadow-sm hover:shadow-md">Register Client</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* Visit Tracker Modal (With Tabs & Auto Alert) */}
              {isVisitModalOpen && selectedClient && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[60] p-4">
                  <div className="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh] animate-pop-in">
                    
                    <div className="bg-blue-600 text-white p-6 flex justify-between items-start shrink-0">
                      <div>
                        <h2 className="text-2xl font-bold mb-1 flex items-center"><i className="fa-regular fa-calendar-check mr-2"></i> Follow-up Care Tracker</h2>
                        <div className="flex space-x-4 text-sm text-blue-100">
                          <span><strong>Client:</strong> {selectedClient.clientName} ({selectedClient.id})</span>
                          <span><strong>Age:</strong> {calculateAgeInDays(selectedClient.dob)} Days</span>
                          <span><strong>Birth Wt:</strong> {selectedClient.birthWeight}kg</span>
                        </div>
                      </div>
                      <button onClick={() => setIsVisitModalOpen(false)} className="btn-active text-blue-200 hover:text-white transition-colors bg-blue-700 hover:bg-blue-800 w-8 h-8 rounded-full flex items-center justify-center"><i className="fa-solid fa-xmark text-lg"></i></button>
                    </div>

                    {/* Circular Scroll Tabs */}
                    <div className="bg-blue-50 border-b border-blue-100 flex items-center justify-between px-4 py-2 shrink-0">
                        <button onClick={() => setActiveVisitTab(prev => prev === 0 ? selectedClient.visits.length - 1 : prev - 1)} className="btn-active p-2 text-blue-600 hover:bg-blue-200 rounded-full transition-colors"><i className="fa-solid fa-chevron-left"></i></button>
                        
                        <div className="flex space-x-2 overflow-x-auto px-2 scrollbar-hide flex-1 justify-center">
                            {selectedClient.visits.map((v, idx) => (
                                <button 
                                  key={idx} 
                                  onClick={() => setActiveVisitTab(idx)}
                                  className={`px-4 py-2 rounded-lg font-bold text-sm transition-all whitespace-nowrap ${activeVisitTab === idx ? 'bg-blue-600 text-white shadow-md' : 'text-blue-600 hover:bg-blue-100'}`}
                                >
                                  Visit {idx + 1}
                                  {(v.done || v.visitStatus === 'Attended') && <i className="fa-solid fa-circle-check ml-1.5 text-xs"></i>}
                                </button>
                            ))}
                            <button onClick={handleAddVisit} className="btn-active px-4 py-2 rounded-lg font-bold text-sm bg-blue-100 text-blue-700 hover:bg-blue-200 whitespace-nowrap border border-blue-200 shadow-sm transition-colors">
                                <i className="fa-solid fa-plus mr-1"></i> Add Visit
                            </button>
                        </div>

                        <button onClick={() => setActiveVisitTab(prev => prev === selectedClient.visits.length - 1 ? 0 : prev + 1)} className="btn-active p-2 text-blue-600 hover:bg-blue-200 rounded-full transition-colors"><i className="fa-solid fa-chevron-right"></i></button>
                    </div>

                    {/* GRADUATION BANNER */}
                    {checkGraduation(selectedClient).meets && !selectedClient.manualOutcome && deriveOutcome(selectedClient) !== 'Completed' && deriveOutcome(selectedClient) !== 'Death' && (
                      <div className="bg-green-50 border-b border-green-200 px-6 py-4 flex flex-col sm:flex-row items-center justify-between shrink-0">
                          <div>
                              <h4 className="text-green-800 font-bold flex items-center"><i className="fa-solid fa-flag-checkered mr-2"></i> Graduation Criteria Met</h4>
                              <p className="text-green-700 text-xs mt-1">Baby has reached <strong>{checkGraduation(selectedClient).cga} wks CGA</strong> or <strong>{checkGraduation(selectedClient).maxW} kg</strong>. Do you want to stop follow-up?</p>
                          </div>
                          {!showGradPrompt ? (
                              <button onClick={() => setShowGradPrompt(true)} className="mt-3 sm:mt-0 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition-colors shrink-0">

                              </button>
                          ) : (
                              <div className="mt-3 sm:mt-0 flex items-center space-x-2 bg-white p-2 rounded-lg border border-green-300 shadow-sm shrink-0">
                                  <select className="border border-gray-300 rounded p-1 text-xs outline-none focus:border-green-500 cursor-pointer" value={gradOutcome} onChange={e => setGradOutcome(e.target.value)}>
                                      <option value="Completed">Alive (Graduated)</option>
                                      <option value="Death">Death</option>
                                  </select>
                                  <button onClick={() => { setSelectedClient({...selectedClient, manualOutcome: gradOutcome}); setShowGradPrompt(false); }} className="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded text-xs font-bold transition-colors shadow-sm">Confirm</button>
                                  <button onClick={() => setShowGradPrompt(false)} className="bg-gray-100 hover:bg-gray-200 text-gray-500 hover:text-gray-700 px-2.5 py-1.5 rounded text-xs transition-colors"><i className="fa-solid fa-xmark"></i></button>
                              </div>
                          )}
                      </div>
                    )}

                    {/* MANUAL CLOSED BANNER */}
                    {selectedClient.manualOutcome && (
                      <div className="bg-gray-100 border-b border-gray-200 px-6 py-3 flex justify-between items-center shrink-0">
                          <span className="text-sm font-bold text-gray-700 flex items-center"><i className="fa-solid fa-lock mr-2"></i> Follow-up Manually Closed: <span className={`ml-2 px-2 py-0.5 rounded text-xs text-white ${selectedClient.manualOutcome === 'Completed' ? 'bg-green-500' : 'bg-stone-500'}`}>{selectedClient.manualOutcome === 'Completed' ? 'Alive (Graduated)' : selectedClient.manualOutcome}</span></span>
                          <button onClick={() => setSelectedClient({...selectedClient, manualOutcome: ''})} className="text-xs text-blue-600 hover:text-blue-800 hover:underline font-bold transition-colors">Undo</button>
                      </div>
                    )}

                    <div className="p-6 overflow-y-auto bg-gray-50 flex-1 relative">
                        {/* Render Active Visit Card */}
                        {(() => {
                          const i = activeVisitTab;
                          const visit = selectedClient.visits[i] || {};
                          const isDone = visit.done || visit.visitStatus === 'Attended';
                          const isManualDropOff = visit.visitStatus === 'Loss of contact';
                          const isManualRefer = visit.visitStatus === 'Refer to higher center';
                          const isDeath = visit.visitStatus === 'Death';
                          const diffDays = getDiffDays(visit.scheduledDate);
                          const isDropOff = isManualDropOff || (!isDone && !isManualRefer && !isDeath && diffDays > 30);
                          const isOverdue = !isDone && !isDropOff && !isManualRefer && !isDeath && diffDays > 7;
                          
                          const kmcCategories = Object.keys(kmcBarriers);
                          const selectedReasonObj = visit.kmcNoCategory && visit.kmcNoReason ? kmcBarriers[visit.kmcNoCategory]?.find(r => r.reason === visit.kmcNoReason) : null;

                          // Auto Growth Alert Logic & Percentage
                          let prevWeight = i === 0 ? selectedClient.birthWeight : selectedClient.visits[i-1]?.weight;
                          let currentWeight = visit.weight;
                          let weightDiff = (currentWeight && prevWeight) ? (parseFloat(currentWeight) - parseFloat(prevWeight)).toFixed(2) : null;
                          let weightDiffPct = (currentWeight && prevWeight && parseFloat(prevWeight) > 0) ? (((parseFloat(currentWeight) - parseFloat(prevWeight)) / parseFloat(prevWeight)) * 100).toFixed(1) : null;

                          // Danger Sign Dynamic Color
                          const hasDanger = visit.hasDangerSign === 'Yes';
                          const noDanger = visit.hasDangerSign === 'No';

                          return (
                            <div key={`visit-tab-${i}`} className={`animate-slide-in bg-white rounded-xl border-2 p-5 shadow-sm transition-all flex flex-col justify-between ${isDone ? 'border-green-500' : isDeath ? 'border-stone-400' : isDropOff ? 'border-red-300' : isOverdue ? 'border-orange-300' : isManualRefer ? 'border-purple-300' : 'border-blue-200'}`}>
                              <div>
                                <div className="flex justify-between items-center mb-4 pb-3 border-b border-gray-100">
                                  <h4 className={`font-bold flex items-center text-lg ${isDone ? 'text-green-600' : isDeath ? 'text-stone-600' : isDropOff ? 'text-red-500' : isOverdue ? 'text-orange-500' : isManualRefer ? 'text-purple-600' : 'text-blue-600'}`}>
                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm mr-2 text-white transition-colors shadow-sm ${isDone ? 'bg-green-500' : isDeath ? 'bg-stone-500' : isDropOff ? 'bg-red-500' : isOverdue ? 'bg-orange-500' : isManualRefer ? 'bg-purple-500' : 'bg-blue-500'}`}>
                                      {isDeath || isDropOff ? <i className="fa-solid fa-xmark"></i> : i+1}
                                    </div>
                                    Follow-up {i+1} Details
                                  </h4>
                                  {isDone && <span className="bg-green-100 text-green-700 text-xs font-bold px-3 py-1 rounded-full"><i className="fa-solid fa-check mr-1"></i> Completed</span>}
                                </div>
                                
                                <div className="space-y-4 mb-4">
                                  <div>
                                    <div className="flex justify-between items-baseline mb-1">
                                      <label className="block text-xs uppercase font-bold text-gray-500">Date of Visit</label>
                                      {visit.scheduledDate && !isDone && <span className="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">Expected: {visit.scheduledDate}</span>}
                                    </div>
                                    <input type="date" max={getTodayDate()} className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:border-blue-500 transition-colors hover:border-blue-300 cursor-pointer bg-gray-50 focus:bg-white" value={visit.date || ''} onChange={(e) => handleUpdateVisit(i, 'date', e.target.value)}/>
                                  </div>

                                  <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <div className="flex items-center mb-1">
                                            <label className="block text-xs uppercase font-bold text-gray-500">Weight (kg)</label>
                                            {weightDiff !== null && (
                                                weightDiff < 0 
                                                ? <span className="ml-2 text-[10px] bg-red-100 text-red-700 px-2 py-0.5 rounded font-bold animate-pulse"><i className="fa-solid fa-arrow-trend-down mr-1"></i>Loss {Math.abs(weightDiff)}kg ({Math.abs(weightDiffPct)}%)</span>
                                                : weightDiff == 0
                                                ? <span className="ml-2 text-[10px] bg-orange-100 text-orange-700 px-2 py-0.5 rounded font-bold">No Gain (0%)</span>
                                                : <span className="ml-2 text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded font-bold"><i className="fa-solid fa-arrow-trend-up mr-1"></i>+{weightDiff}kg (+{weightDiffPct}%)</span>
                                            )}
                                        </div>
                                        <input type="number" step="0.01" className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:border-blue-500 transition-colors hover:border-blue-300 bg-gray-50 focus:bg-white" value={visit.weight || ''} onChange={(e) => handleUpdateVisit(i, 'weight', e.target.value)}/>
                                    </div>
                                    <div>
                                        <label className="block text-xs uppercase font-bold text-gray-500 mb-1">Temp (°C)</label>
                                        <input type="number" step="0.1" className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:border-blue-500 transition-colors hover:border-blue-300 bg-gray-50 focus:bg-white" value={visit.temp || ''} onChange={(e) => handleUpdateVisit(i, 'temp', e.target.value)}/>
                                    </div>
                                  </div>

                                  <div className="grid grid-cols-2 gap-4">
                                    <div>
                                      <label className="block text-xs uppercase font-bold text-gray-500 mb-1">Visit Status</label>
                                      <select className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:border-blue-500 transition-colors hover:border-blue-300 cursor-pointer bg-gray-50 focus:bg-white" value={visit.visitStatus || ''} onChange={(e) => handleUpdateVisit(i, 'visitStatus', e.target.value)}>
                                        <option value="">- Pending -</option>
                                        <option value="Attended">Attended</option>
                                        <option value="Refer to higher center">Refer to higher center</option>
                                        <option value="Loss of contact">Loss of contact</option>
                                        <option value="Death">Death</option>
                                      </select>
                                    </div>
                                    <div>
                                      <label className="block text-xs uppercase font-bold text-gray-500 mb-1">Types of Feeding</label>
                                      <select className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:border-blue-500 transition-colors hover:border-blue-300 cursor-pointer bg-gray-50 focus:bg-white" value={visit.feedingType || ''} onChange={(e) => handleUpdateVisit(i, 'feedingType', e.target.value)}>
                                        <option value="">- Select -</option>
                                        <option value="Exclusive Breast Feeding">Exclusive Breast Feeding</option>
                                        <option value="Formula Feeding">Formula Feeding</option>
                                        <option value="Mixed Feeding">Mixed Feeding</option>
                                      </select>
                                    </div>
                                  </div>

                                  <div className={`p-3 rounded-lg border transition-colors duration-300 ${hasDanger ? 'bg-red-50 border-red-300' : noDanger ? 'bg-green-50 border-green-200' : 'bg-slate-50 border-slate-200'}`}>
                                    <div>
                                      <label className={`block text-xs uppercase font-bold mb-1 transition-colors ${hasDanger ? 'text-red-700' : noDanger ? 'text-green-700' : 'text-slate-500'}`}>Any Danger Signs?</label>
                                      <select className={`w-full border rounded-lg p-2 text-sm outline-none transition-colors cursor-pointer bg-white ${hasDanger ? 'border-red-400 focus:border-red-600' : noDanger ? 'border-green-300 focus:border-green-500' : 'border-slate-300 focus:border-blue-500'}`} value={visit.hasDangerSign || ''} onChange={(e) => handleUpdateVisit(i, 'hasDangerSign', e.target.value)}>
                                        <option value="">- Select -</option>
                                        <option value="Yes">Yes</option>
                                        <option value="No">No</option>
                                      </select>
                                    </div>
                                    
                                    {hasDanger && (
                                      <div className="animate-pop-in mt-3 space-y-2 border-t border-red-200 pt-3">
                                        <div>
                                          <label className="block text-[10px] uppercase font-bold text-red-600 mb-1">Select Danger Sign</label>
                                          <select className="w-full border border-red-300 rounded-lg p-2 text-sm outline-none focus:border-red-500 bg-white transition-colors hover:border-red-400 cursor-pointer" value={visit.dangerSign || ''} onChange={(e) => handleUpdateVisit(i, 'dangerSign', e.target.value)}>
                                            <option value="">- Select -</option>
                                            <option value="Can't sucking well">Can't sucking well</option>
                                            <option value="Hyperthermia/Hypothermia">Hyperthermia/Hypothermia</option>
                                            <option value="Fits">Fits</option>
                                            <option value="Floppy">Floppy</option>
                                            <option value="Fast breathing/ Chest indrawing">Fast breathing/ Chest indrawing</option>
                                            <option value="Others">Others</option>
                                          </select>
                                        </div>
                                        {visit.dangerSign === 'Others' && (
                                          <div className="animate-pop-in">
                                            <input type="text" className="w-full border border-red-300 rounded-lg p-2 text-sm outline-none focus:border-red-500 transition-colors hover:border-red-400" placeholder="Please specify danger sign..." value={visit.dangerSignOther || ''} onChange={(e) => handleUpdateVisit(i, 'dangerSignOther', e.target.value)} />
                                          </div>
                                        )}
                                      </div>
                                    )}
                                  </div>

                                  <div className="bg-blue-50 p-3 rounded-lg border border-blue-100">
                                    <div>
                                      <label className="block text-xs uppercase font-bold text-blue-800 mb-1">KMC Practiced?</label>
                                      <select className="w-full border border-blue-300 rounded-lg p-2 text-sm outline-none focus:border-blue-500 transition-colors hover:border-blue-400 cursor-pointer bg-white" value={visit.kmcPracticed || ''} onChange={(e) => { const val = e.target.value; const updatedVisits = [...selectedClient.visits]; updatedVisits[i] = { ...updatedVisits[i], kmcPracticed: val }; if (val !== 'Yes') { updatedVisits[i].kmcHours = ''; updatedVisits[i].kmcTotalHours = ''; } if (val !== 'No') { updatedVisits[i].kmcNoCategory = ''; updatedVisits[i].kmcNoReason = ''; updatedVisits[i].kmcDiscontinueDate = ''; } setSelectedClient({ ...selectedClient, visits: updatedVisits }); }}>
                                        <option value="">- Select -</option><option value="Yes">Yes</option><option value="No">No</option>
                                      </select>
                                    </div>
                                    {visit.kmcPracticed === 'Yes' && (
                                      <div className="animate-pop-in mt-3 grid grid-cols-2 gap-4 border-t border-blue-200 pt-3">
                                        <div className="relative"><label className="block text-[10px] uppercase font-bold text-blue-800 mb-1">Hr / Day</label><div className="relative"><input type="number" min="0" max="24" className="w-full border border-blue-300 rounded-lg p-2 pr-8 text-sm outline-none focus:border-blue-500 transition-colors hover:border-blue-400 bg-white" placeholder="e.g. 20" value={visit.kmcHours || ''} onChange={(e) => handleUpdateVisit(i, 'kmcHours', e.target.value)} /><span className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-gray-500 font-bold">hr</span></div></div>
                                        <div className="relative"><label className="block text-[10px] uppercase font-bold text-blue-800 mb-1">Total Hr (All Time)</label><div className="relative"><input type="number" min="0" className="w-full border border-blue-300 rounded-lg p-2 pr-8 text-sm outline-none focus:border-blue-500 transition-colors hover:border-blue-400 bg-white" placeholder="Total" value={visit.kmcTotalHours || ''} onChange={(e) => handleUpdateVisit(i, 'kmcTotalHours', e.target.value)} /><span className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-gray-500 font-bold">hr</span></div></div>
                                      </div>
                                    )}
                                    {visit.kmcPracticed === 'No' && (
                                      <div className="animate-pop-in mt-3 space-y-3 border-t border-blue-200 pt-3">
                                        <div>
                                          <label className="block text-[10px] uppercase font-bold text-blue-800 mb-1">When was KMC discontinued?</label>
                                          <input type="date" max={getTodayDate()} className="w-full border border-blue-300 rounded-lg p-2 text-sm outline-none focus:border-blue-500 bg-white transition-colors hover:border-blue-400 cursor-pointer" value={visit.kmcDiscontinueDate || ''} onChange={(e) => handleUpdateVisit(i, 'kmcDiscontinueDate', e.target.value)}/>
                                        </div>
                                        <div>
                                          <label className="block text-[10px] uppercase font-bold text-blue-800 mb-1">Barrier Category</label>
                                          <select className="w-full border border-blue-300 rounded-lg p-2 text-sm outline-none focus:border-blue-500 bg-white transition-colors hover:border-blue-400 cursor-pointer" value={visit.kmcNoCategory || ''} onChange={(e) => handleUpdateVisit(i, 'kmcNoCategory', e.target.value)}>
                                            <option value="">- Select Category -</option>{kmcCategories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                          </select>
                                        </div>
                                        {visit.kmcNoCategory && (
                                          <div className="animate-pop-in">
                                            <label className="flex items-center text-[10px] uppercase font-bold text-blue-800 mb-1">
                                              Specific Reason
                                              {selectedReasonObj && (
                                                <div className="relative group ml-1">
                                                  <span className="text-blue-600 bg-blue-200 rounded-full w-4 h-4 flex items-center justify-center font-black cursor-help text-[10px] border border-blue-300 transition-colors">*</span>
                                                  <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-64 p-3 bg-slate-800 text-white text-xs rounded-lg shadow-xl opacity-0 group-hover:opacity-100 pointer-events-none z-50 transition-opacity whitespace-normal text-left font-normal leading-relaxed">{selectedReasonObj.detail}</div>
                                                </div>
                                              )}
                                            </label>
                                            <select className="w-full border border-blue-300 rounded-lg p-2 text-sm outline-none focus:border-blue-500 bg-white transition-colors hover:border-blue-400 cursor-pointer" value={visit.kmcNoReason || ''} onChange={(e) => handleUpdateVisit(i, 'kmcNoReason', e.target.value)}>
                                              <option value="">- Select Reason -</option>{kmcBarriers[visit.kmcNoCategory].map(r => (<option key={r.reason} value={r.reason}>{r.reason}</option>))}
                                            </select>
                                          </div>
                                        )}
                                      </div>
                                    )}
                                  </div>

                                  <div><label className="block text-xs uppercase font-bold text-gray-500 mb-1">Client Experience on KMC (CFM)</label><textarea rows="2" className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:border-blue-500 resize-none transition-colors hover:border-blue-300 bg-gray-50 focus:bg-white" placeholder="Feedback or complaints..." value={visit.clientExperience || ''} onChange={(e) => handleUpdateVisit(i, 'clientExperience', e.target.value)}></textarea></div>
                                  <div><label className="block text-xs uppercase font-bold text-gray-500 mb-1">Clinical Notes & Suggestions</label><textarea rows="2" className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:border-blue-500 resize-none transition-colors hover:border-blue-300 bg-gray-50 focus:bg-white" placeholder="Provider advice..." value={visit.comments || ''} onChange={(e) => handleUpdateVisit(i, 'comments', e.target.value)}></textarea></div>
                                </div>
                              </div>
                              
                              {/* Bottom Alerts */}
                              {isDeath && <div className="animate-pop-in bg-stone-100 text-stone-800 text-sm px-3 py-2 rounded-lg flex items-center mt-4 font-bold border border-stone-200"><i className="fa-solid fa-triangle-exclamation mr-2 text-lg"></i> Patient Deceased</div>}
                              {!isDeath && isDropOff && <div className="animate-pop-in bg-red-100 text-red-800 text-sm px-3 py-2 rounded-lg flex items-center mt-4 font-bold border border-red-200"><i className="fa-solid fa-triangle-exclamation mr-2 text-lg"></i> {isManualDropOff ? 'Manual Drop Off (Lost)' : 'Drop Off (over 30 Days)'}</div>}
                              {!isDeath && isOverdue && <div className="animate-pop-in bg-orange-50 text-orange-700 text-sm px-3 py-2 rounded-lg flex items-center mt-4 border border-orange-200 font-bold"><i className="fa-solid fa-triangle-exclamation mr-2 text-lg"></i> Overdue (&gt; 7 Days)</div>}
                              {!isDeath && isManualRefer && <div className="animate-pop-in bg-purple-100 text-purple-800 text-sm px-3 py-2 rounded-lg flex items-center mt-4 font-bold border border-purple-200"><i className="fa-solid fa-wave-square mr-2 text-lg"></i> Referred to Higher Center</div>}
                            </div>
                          );
                        })()}
                    </div>

                    <div className="bg-white p-4 border-t border-gray-200 flex justify-between items-center shrink-0">
                      <div className={`hidden sm:inline-block px-4 py-2 rounded-lg border font-bold text-xs transition-colors ${
                        deriveOutcome(selectedClient) === 'Death' ? 'bg-stone-100 text-stone-800 border-stone-200' :
                        deriveOutcome(selectedClient) === 'Completed' ? 'bg-green-100 text-green-800 border-green-200' :
                        deriveOutcome(selectedClient) === 'Defaulted' ? 'bg-red-100 text-red-800 border-red-200' :
                        deriveOutcome(selectedClient) === 'Overdue' ? 'bg-orange-100 text-orange-800 border-orange-200' :
                        deriveOutcome(selectedClient) === 'Referred' ? 'bg-purple-100 text-purple-800 border-purple-200' :
                        'bg-blue-50 text-blue-800 border-blue-200'
                      }`}>Status: {deriveOutcome(selectedClient)}</div>
                      
                      <div className="flex space-x-3 w-full sm:w-auto justify-end">
                          <button onClick={() => setIsVisitModalOpen(false)} className="btn-active px-5 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors">Discard</button>
                          <button onClick={handleSaveVisits} className="btn-active px-5 py-2 text-white bg-green-600 hover:bg-green-700 rounded-lg font-medium flex items-center space-x-2 transition-all shadow-sm hover:shadow-md">
                            <i className="fa-solid fa-circle-check"></i><span>Save All</span>
                          </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* Confirm Modal */}
              {confirmModal.isOpen && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[70] p-4">
                  <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden transform transition-all animate-pop-in">
                    <div className="p-6">
                      <div className="flex items-center justify-center w-12 h-12 rounded-full bg-red-100 mb-4 mx-auto"><i className="fa-solid fa-triangle-exclamation text-red-600 text-xl"></i></div>
                      <h3 className="text-lg font-bold text-center text-gray-900 mb-2">{confirmModal.title}</h3>
                      <p className="text-sm text-center text-gray-500 mb-6">{confirmModal.message}</p>
                      <div className="flex space-x-3">
                        <button onClick={() => setConfirmModal({ isOpen: false })} className="btn-active flex-1 bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg font-medium hover:bg-gray-50 transition-colors">Cancel</button>
                        <button onClick={confirmModal.onConfirm} className="btn-active flex-1 bg-red-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-red-700 transition-all shadow-sm hover:shadow-md shadow-red-200">Confirm</button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
