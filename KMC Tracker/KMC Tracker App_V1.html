    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .exporting { border: none !important; border-radius: 0 !important; box-shadow: none !important; }

        /* Custom Animations */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop-in { animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes splashFadeOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.1); pointer-events: none; visibility: hidden; }
        }
        .splash-exit { animation: splashFadeOut 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        /* Hover & Transition Utilities */
        .hover-card { transition: all 0.3s ease; }
        .hover-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); z-index: 10; }
        .btn-active { transition: all 0.2s ease; }

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect } = React;
        const { LineChart, Line, BarChart, Bar, PieChart, Pie, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, Cell, LabelList, AreaChart, Area, ScatterChart, Scatter, ZAxis, Label, ComposedChart } = Recharts;

        // --- SUPABASE SETUP ---
        const SUPABASE_URL = 'https://nxvfjzduumcrwbbcirhq.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_--ZCzLr7SAZnTklVkKUq5Q_-3cGp9Ha';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ==========================================
        // 🚨 ROLE-BASED ACCESS CONTROL (RBAC) CONFIG
        // ==========================================
        const ADMIN_EMAILS = [
            'admin@jhpiego.org',
            'manager@example.com'
        ]; 

        // --- LOGIN COMPONENT ---
        const LoginForm = ({ supabase }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setErrorMsg('');

                setLoading(false);
            };

            return (
                <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative z-50">
                    <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md animate-pop-in">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-white text-3xl shadow-lg">
                                <i className="fa-solid fa-person-breastfeeding"></i>
                            </div>
                            <h2 className="text-2xl font-black text-gray-800 uppercase tracking-wide">KMC Tracker</h2>
                            <p className="text-sm text-gray-500 mt-1">Jhpiego Myanmar • Staff Login</p>
                        </div>
                        {errorMsg && (
                            <div className="bg-red-50 text-red-600 p-3 rounded-lg mb-6 text-sm text-center border border-red-200">

                        )}

                                    <input type="email" required className="w-full bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block pl-10 p-3 outline-none transition-all" placeholder="Enter your email" value={email} onChange={(e) => setEmail(e.target.value)} />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-gray-600 uppercase mb-2">Password</label>
                                <div className="relative">
                                    <i className="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                    <input type="password" required className="w-full bg-gray-50 border border-gray-200 text-gray-800 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block pl-10 p-3 outline-none transition-all" placeholder="Enter your password" value={password} onChange={(e) => setPassword(e.target.value)} />
                                </div>
                            </div>
                            <button type="submit" disabled={loading} className="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-bold rounded-lg text-sm px-5 py-3.5 text-center shadow-md hover:shadow-lg transition-all flex items-center justify-center">

                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- DATA DICTIONARY FOR KMC BARRIERS ---
        const kmcBarriers = {
          "1. Physical and Emotional Strain": [
            { reason: "Physical Pain and Fatigue", detail: "Exhaustion is a top barrier, particularly after C-section recovery or when managing other children. Mothers often find the baby too heavy, experience back or chest pain, or struggle with uncomfortable beds in hospital settings." },
            { reason: "Discomfort during Sleep", detail: "Difficulty sleeping while in a semi-reclined or upright position with the baby restricts rest." },
            { reason: "Mental Health and Guilt", detail: "Postpartum depression and anxiety over having a premature baby can reduce a mother’s willingness or ability to perform continuous KMC." }
          ],
          "2. Logistical and Practical Challenges": [
            { reason: "Lack of Support", detail: "The absence of help with KMC practice (e.g., family members taking turns) or other obligations (household chores, caring for other children) is a major factor." },
            { reason: "Time Limitations and Household Duties", detail: "Many mothers stop KMC because they cannot manage it alongside home responsibilities or work." },
            { reason: "Infant Fussy/Discomfort", detail: "If the baby cries, feels uncomfortable, or seems too warm, parents tend to discontinue the session." },
            { reason: "Medical Issues and Complications", detail: "The mother's own health issues (e.g., pain, illness) or the baby's discomfort (e.g., being attached to medical devices) hampers continuity." }
          ],
          "3. Sociocultural and Behavioral Factors": [
            { reason: "Cultural Beliefs and Confinement", detail: "In some regions, traditional practices conflict with KMC. For example, 'postpartum confinement' may encourage mothers to stay in bed without doing heavy tasks, or traditional bathing practices may interfere with skin-to-skin contact." },
            { reason: "Resistance from Family Members", detail: "Grandparents or other family members may discourage KMC, believing the baby needs to be in a cot or that KMC is uncomfortable for the newborn." },
            { reason: "Modesty and Privacy", detail: "Lack of privacy in overcrowded hospital wards makes mothers uncomfortable being 'naked' for skin-to-skin contact." }
          ],
          "4. Health System Barriers": [
            { reason: "Poor Counseling and Education", detail: "Lack of adequate training and understanding of the benefits of KMC makes parents less likely to adhere to it." },
            { reason: "Negative Experience with Staff", detail: "Poor interaction with healthcare providers or feeling pressured to do KMC can cause clients to abandon the practice." },
            { reason: "Resource Constraints", detail: "Lack of proper facilities (e.g., chairs, screens, blankets) in hospitals." }
          ],
          "5. Reasons for Planned Discontinuation": [
            { reason: "Baby Reaching Target Weight", detail: "Often, when the baby grows, gains weight (e.g., >2,500g), and becomes more active or uncomfortable in the KMC position, mothers stop, as the baby 'wants to move'." },
            { reason: "Baby's Improved Health", detail: "The perception that the baby is strong enough and no longer needs special care." }
          ]
        };

        // --- HELPERS ---
        const calculateAgeInDays = (dobString) => {
          if (!dobString) return '-';
          const diffTime = Math.abs(new Date() - new Date(dobString));
          return Math.floor(diffTime / (1000 * 60 * 60 * 24)); 
        };

        const getDaysBetween = (start, end) => {
            if (!start || !end) return null;
            const diff = new Date(end) - new Date(start);
            return Math.floor(diff / (1000 * 3600 * 24));
        };

        const addDays = (dateStr, days) => {
          if (!dateStr) return '';
          const d = new Date(dateStr);
          d.setDate(d.getDate() + days);
          return d.toISOString().split('T')[0];
        };

        const getDiffDays = (dateStr) => {
          if (!dateStr) return 0;
          const diffTime = new Date() - new Date(dateStr);
          return diffTime / (1000 * 3600 * 24);
        };

        const deriveOutcome = (client) => {
          if (!client.visits) return 'Active';
          if (client.visits.some(v => v.visitStatus === 'Death')) return 'Death';
          if (client.visits.some(v => v.visitStatus === 'Refer to higher center')) return 'Referred';
          if (client.visits.some(v => v.visitStatus === 'Loss of contact')) return 'Defaulted';

          const completedVisits = client.visits.filter(v => v.done || v.visitStatus === 'Attended').length;
          if (completedVisits === 3) return 'Completed';

          let isDropOff = false;
          let isOverdue = false;

          client.visits.forEach(v => {
            if (!v.done && v.visitStatus !== 'Attended' && v.scheduledDate) {
              const diffDays = getDiffDays(v.scheduledDate);
              if (diffDays > 30) isDropOff = true;
              else if (diffDays > 7) isOverdue = true;
            }
          });

          if (isDropOff) return 'Defaulted';
          if (isOverdue) return 'Overdue';

          return 'Active'; 
        };

        const parseCSVRow = (row) => {
          const result = [];
          let current = '';
          let inQuotes = false;
          for (let i = 0; i < row.length; i++) {
            const char = row[i];
            if (char === '"') inQuotes = !inQuotes;
            else if (char === ',' && !inQuotes) { result.push(current); current = ''; } 
            else current += char;
          }
          result.push(current);
          return result.map(s => s.replace(/^"|"$/g, '').replace(/""/g, '"'));
        };

        const initialLocations = {
          'Yangon': ['Thanlyin', 'Insein', 'Dala', 'South Dagon', 'Hlaingthaya'],
          'Bago': ['Bago', 'Taungoo', 'Pyay'],
          'Mandalay': ['Mandalay', 'Meiktila', 'Pyin Oo Lwin'],
          'Ayeyarwady': ['Pathein', 'Hinthada', 'Myaungmya', 'Maubin']
        };

        const PIE_COLORS = ['#ef4444', '#f59e0b', '#3b82f6', '#10b981', '#8b5cf6', '#64748b'];

        // --- SPLASH SCREEN COMPONENT ---
        const SplashScreen = ({ isFading }) => (
            <div className={`fixed inset-0 bg-blue-600 flex flex-col items-center justify-center z-[100] ${isFading ? 'splash-exit' : ''}`}>
                <div className="animate-float flex flex-col items-center">
                    <div className="relative mb-6">
                        <i className="fa-solid fa-person-breastfeeding text-white text-8xl"></i>
                        <i className="fa-solid fa-heart text-pink-400 text-3xl absolute -right-2 -top-2 animate-ping"></i>
                    </div>
                    <h1 className="text-white text-4xl font-extrabold tracking-widest uppercase shadow-black drop-shadow-md">KMC Tracker</h1>
                    <p className="text-blue-200 mt-3 font-medium tracking-wide">Developed by Jhpiego Myanmar</p>
                    
                    <div className="mt-12 flex space-x-2">
                        <div className="w-3 h-3 bg-white rounded-full animate-bounce" style={{animationDelay: "0ms"}}></div>
                        <div className="w-3 h-3 bg-white rounded-full animate-bounce" style={{animationDelay: "150ms"}}></div>
                        <div className="w-3 h-3 bg-white rounded-full animate-bounce" style={{animationDelay: "300ms"}}></div>
                    </div>
                </div>
            </div>
        );

        // --- COMPONENT: EXPORTABLE CHART WRAPPER ---
        const VisualizationCard = ({ id, title, subtitle, headerExtras, filterBar, children }) => {
          const handleDownload = () => {
            const element = document.getElementById(id);
            element.classList.add('exporting');
            html2canvas(element, { scale: 3, useCORS: true, backgroundColor: '#ffffff' }).then(canvas => {
              element.classList.remove('exporting');
              const link = document.createElement('a');
              link.download = `${title.replace(/\s+/g, '_')}_A5_Export.png`;
              link.href = canvas.toDataURL('image/png');
              link.click();
            });
          };

          return (
            <div className="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col relative group hover-card">
              <div className="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50 rounded-t-xl">
                <div>
                    <h3 className="font-bold text-gray-800 flex items-center text-sm">{title}</h3>
                    {subtitle && <p className="text-[10px] text-gray-500 mt-0.5">{subtitle}</p>}
                </div>
                <div className="flex items-center space-x-3">
                  {headerExtras}
                  <button onClick={handleDownload} className="text-gray-500 hover:text-blue-600 bg-white border border-gray-200 hover:border-blue-300 px-3 py-1.5 rounded text-xs font-bold transition-all shadow-sm flex items-center btn-active">
                    <i className="fa-solid fa-download mr-1.5"></i> Export
                  </button>
                </div>
              </div>
              
              {filterBar && <div className="px-4 py-2 bg-slate-50 border-b border-gray-100">{filterBar}</div>}
              
              <div className="p-4 flex-1 flex justify-center items-center bg-gray-100/50">
                 <div id={id} className="bg-white w-full relative flex flex-col shadow-sm border border-gray-200 overflow-hidden" style={{ aspectRatio: '1.414 / 1', padding: '20px' }}>
                    <div className="text-center mb-6 pb-2 border-b border-gray-100 shrink-0">
                        <h2 className="text-xl font-black text-gray-800 uppercase">{title}</h2>
                        <p className="text-[10px] text-gray-500 tracking-widest mt-1">KMC Tracking Dashboard • Developed by Jhpiego Myanmar</p>
                    </div>
                    <div className="flex-1 w-full min-h-0 relative">
                      {children}
                    </div>
                 </div>
              </div>
            </div>
          );
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
          const [session, setSession] = useState(null);
          const [authChecking, setAuthChecking] = useState(true);
          const [userRole, setUserRole] = useState(null);

          const [showSplash, setShowSplash] = useState(true);
          const [splashFading, setSplashFading] = useState(false);

          const [outcomeView, setOutcomeView] = useState('bar');
          const [attendanceView, setAttendanceView] = useState('bar');
          const [barrierView, setBarrierView] = useState('bar');
          const [dangerView, setDangerView] = useState('bar');

          const [trendFilterTownship, setTrendFilterTownship] = useState('All');
          const [trendFilterMonth, setTrendFilterMonth] = useState('All');
          const [trendFilterYear, setTrendFilterYear] = useState('All');

          const [activeTab, setActiveTab] = useState('registry'); 

          // Handle Session and Role Checking
          const handleSessionUpdate = (currentSession) => {
              setSession(currentSession);
              if (currentSession?.user?.email) {
                  const role = ADMIN_EMAILS.includes(currentSession.user.email) ? 'admin' : 'data_entry';
                  setUserRole(role);
                  if (role === 'data_entry') {
                      setActiveTab('registry');
                  } else if (activeTab === 'registry' && role === 'admin') {
                      setActiveTab('dashboard'); 
                  }
              } else {
                  setUserRole(null);
              }
          };

          useEffect(() => {
            supabase.auth.getSession().then(({ data: { session } }) => {
              handleSessionUpdate(session);
              setAuthChecking(false);
            });
            const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
              handleSessionUpdate(session);
            });
            return () => subscription.unsubscribe();
          }, []);

          // Splash screen timings
          useEffect(() => {
              const fadeTimer = setTimeout(() => setSplashFading(true), 2000);
              const hideTimer = setTimeout(() => setShowSplash(false), 2800);
              return () => { clearTimeout(fadeTimer); clearTimeout(hideTimer); };
          }, []);

          const [clients, setClients] = useState([]);
          const [isLoadingData, setIsLoadingData] = useState(false);

          useEffect(() => {
             if (session) fetchClients();
          }, [session]);

          const fetchClients = async () => {
             setIsLoadingData(true);
             const { data, error } = await supabase.from('kmc_clients').select('*').order('id', { ascending: false });
             if (error) {
                 console.error("Error fetching data:", error);
                 alert("Failed to load data from Supabase. Check your table structure.");
             } else {
                 setClients(data || []);
             }
             setIsLoadingData(false);
          };

          const [searchTerm, setSearchTerm] = useState('');
          const [searchTownship, setSearchTownship] = useState('All');
          const fileInputRef = useRef(null);
          const [isNotiOpen, setIsNotiOpen] = useState(false);

          const [locations, setLocations] = useState(() => {
              const savedLocs = localStorage.getItem('kmc_locations_data');
              return savedLocs ? JSON.parse(savedLocs) : initialLocations;
          });
          useEffect(() => { localStorage.setItem('kmc_locations_data', JSON.stringify(locations)); }, [locations]);

          const [newRegion, setNewRegion] = useState('');
          const [selectedRegionForTownship, setSelectedRegionForTownship] = useState('Yangon');
          const [newTownship, setNewTownship] = useState('');

          const [isClientModalOpen, setIsClientModalOpen] = useState(false);
          const [isVisitModalOpen, setIsVisitModalOpen] = useState(false);
          const [selectedClient, setSelectedClient] = useState(null);
          const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null });

          const [formData, setFormData] = useState({
            registrationDate: new Date().toISOString().split('T')[0],
            reportingMonth: 'February', reportingYear: new Date().getFullYear().toString(), region: '', township: '', clientName: '', 
            dob: '', gestationalAge: '', birthWeight: '', dischargeDate: '',
            parentName: '', address: '', primaryPhone: '', secondaryPhone: '', kmcBinder: 'Yes', completionDate: ''
          });

          const availableYears = useMemo(() => {
             return [...new Set(clients.map(c => c.reportingYear || new Date().getFullYear().toString()))].sort().reverse();
          }, [clients]);

          const availableMonths = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

          // --- CHART 1: TREND DATA (FILTERED) ---
          const trendChartData = useMemo(() => {
            let filtered = clients;
            if (trendFilterYear !== 'All') filtered = filtered.filter(c => (c.reportingYear || new Date().getFullYear().toString()) === trendFilterYear);
            if (trendFilterMonth !== 'All') filtered = filtered.filter(c => c.reportingMonth === trendFilterMonth);
            if (trendFilterTownship !== 'All') filtered = filtered.filter(c => c.township === trendFilterTownship);

            let monthTownshipObj = {};
            let uniqueTownships = new Set();
            filtered.forEach(c => {
                const m = c.reportingMonth || 'Unknown';
                const t = c.township || 'Unknown';
                uniqueTownships.add(t);
                if (!monthTownshipObj[m]) monthTownshipObj[m] = {};
                monthTownshipObj[m][t] = (monthTownshipObj[m][t] || 0) + 1;
            });

            const monthsOrdered = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            const data = Object.keys(monthTownshipObj)
                .sort((a,b) => monthsOrdered.indexOf(a) - monthsOrdered.indexOf(b))
                .map(m => {
                    let obj = { month: m.substring(0,3) };
                    Object.keys(monthTownshipObj[m]).forEach(t => {
                        obj[t] = monthTownshipObj[m][t];
                    });
                    return obj;
                });
            
            return { data, townshipsList: Array.from(uniqueTownships) };
          }, [clients, trendFilterYear, trendFilterMonth, trendFilterTownship]);

          // --- METRICS ---
          const metrics = useMemo(() => {
            let total = clients.length;
            let completed = 0, onTrack = 0, dropOff = 0, death = 0;
            clients.forEach(c => {
              const status = deriveOutcome(c);
              if (status === 'Completed') completed++;
              else if (status === 'Defaulted') dropOff++;
              else if (status === 'Death') death++;
              else onTrack++; 
            });
            return { total, completed, onTrack, dropOff, death };
          }, [clients]);

          // --- COMPREHENSIVE ACADEMIC ANALYTICS ---
          const analytics = useMemo(() => {
            let total = clients.length || 1; 
            
            let kitIssued = 0;
            let kmcPracticedV1 = 0;
            let v1TotalDone = 0;

            let wBirth = { sum: 0, count: 0 }, wV1 = { sum: 0, count: 0 }, wV2 = { sum: 0, count: 0 }, wV3 = { sum: 0, count: 0 };
            let tV1 = { sum: 0, count: 0 }, tV2 = { sum: 0, count: 0 }, tV3 = { sum: 0, count: 0 };
            let aV1 = { sum: 0, count: 0 }, aV2 = { sum: 0, count: 0 }, aV3 = { sum: 0, count: 0 };

            let outcomesObj = { 'Completed': 0, 'Active': 0, 'Overdue': 0, 'Defaulted': 0, 'Referred': 0, 'Death': 0 };
            let attV1 = 0, attV2 = 0, attV3 = 0;

            let barrierCatObj = {};
            let barrierReasonObj = {};
            let dangerObj = {}; 

            // Time Trends
            let regTrendObj = {};
            let discTrendObj = {};

            let scatterData = [];
            let groupData = {
                cat1: { sumGain: 0, count: 0, label: '< 3 hrs/day' },
                cat2: { sumGain: 0, count: 0, label: '3 to < 5 hrs/day' },
                cat3: { sumGain: 0, count: 0, label: '5 to < 8 hrs/day' },
                cat4: { sumGain: 0, count: 0, label: '>= 8 hrs/day' }
            };

            let feedGroupData = {
                'Exclusive Breast Feeding': { sumGain: 0, count: 0, label: 'Exclusive BF' },
                'Formula Feeding': { sumGain: 0, count: 0, label: 'Formula' },
                'Mixed Feeding': { sumGain: 0, count: 0, label: 'Mixed' }
            };

            clients.forEach(c => {
              if (c.kmcBinder === 'Yes') kitIssued++;
              
              outcomesObj[deriveOutcome(c)]++;
              if (c.birthWeight) { wBirth.sum += parseFloat(c.birthWeight); wBirth.count++; }

              // Registration Trend
              if (c.registrationDate) {
                  let rm = new Date(c.registrationDate).toLocaleString('default', {month:'short', year:'2-digit'});
                  regTrendObj[rm] = (regTrendObj[rm] || 0) + 1;
              }

              let bWeight = parseFloat(c.birthWeight || 0);
              let lastWeight = bWeight;

                        <div><label className="block text-xs font-semibold text-gray-600 mb-1">Date of Birth (DOB)</label><input required type="date" className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-colors hover:border-blue-300 cursor-pointer" value={formData.dob} onChange={e => setFormData({...formData, dob: e.target.value})}/></div>
                        <div><label className="block text-xs font-semibold text-gray-600 mb-1">Gestational Age (Weeks)</label><input required type="number" className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-colors hover:border-blue-300" value={formData.gestationalAge} onChange={e => setFormData({...formData, gestationalAge: e.target.value})} placeholder="e.g. 35"/></div>
                        <div><label className="block text-xs font-semibold text-gray-600 mb-1">Birth Weight (kg)</label><input required type="number" step="0.01" className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-colors hover:border-blue-300" value={formData.birthWeight} onChange={e => setFormData({...formData, birthWeight: e.target.value})} placeholder="e.g. 2.0"/></div>

                        <div className="md:col-span-1"><label className="block text-xs font-semibold text-gray-600 mb-1">Secondary Phone</label><input type="text" className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-colors hover:border-blue-300" value={formData.secondaryPhone} onChange={e => setFormData({...formData, secondaryPhone: e.target.value})} placeholder="Alt Contact"/></div>
                        <div className="md:col-span-4"><label className="block text-xs font-semibold text-gray-600 mb-1">Address</label><input type="text" className="w-full border border-gray-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-colors hover:border-blue-300" value={formData.address} onChange={e => setFormData({...formData, address: e.target.value})} placeholder="House No, Street, Quarter"/></div>
                      </div>
                      <div className="pt-6 mt-4 border-t border-gray-100 flex justify-end space-x-3">
                        <button type="button" onClick={() => setIsClientModalOpen(false)} className="btn-active px-5 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors">Cancel</button>
                        <button type="submit" className="btn-active px-5 py-2 text-white bg-blue-600 hover:bg-blue-700 rounded-lg font-medium transition-colors shadow-sm hover:shadow-md">Register Client</button>
                      </div>
                    </form>
                  </div>

                          <span><strong>Client:</strong> {selectedClient.clientName} ({selectedClient.id})</span>

                          <span><strong>Birth Wt:</strong> {selectedClient.birthWeight}kg</span>
                        </div>
                      </div>
                      <button onClick={() => setIsVisitModalOpen(false)} className="btn-active text-blue-200 hover:text-white transition-colors bg-blue-700 hover:bg-blue-800 w-8 h-8 rounded-full flex items-center justify-center"><i className="fa-solid fa-xmark text-lg"></i></button>
                    </div>

                    <div className="p-6 overflow-y-auto bg-gray-50 flex-1 space-y-6">
                      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {[1, 2, 3].map((num, i) => {
                          const visit = selectedClient.visits[i] || {};
                          const isDone = visit.done || visit.visitStatus === 'Attended';
                          const isManualDropOff = visit.visitStatus === 'Loss of contact';
                          const isManualRefer = visit.visitStatus === 'Refer to higher center';
                          const isDeath = visit.visitStatus === 'Death';
                          const diffDays = getDiffDays(visit.scheduledDate);
                          const isDropOff = isManualDropOff || (!isDone && !isManualRefer && !isDeath && diffDays > 30);
                          const isOverdue = !isDone && !isDropOff && !isManualRefer && !isDeath && diffDays > 7;
                          
                          const kmcCategories = Object.keys(kmcBarriers);
                          const selectedReasonObj = visit.kmcNoCategory && visit.kmcNoReason ? kmcBarriers[visit.kmcNoCategory]?.find(r => r.reason === visit.kmcNoReason) : null;

                          return (
                            <div key={num} className={`bg-white rounded-xl border-2 p-4 transition-all duration-300 flex flex-col justify-between hover-card ${isDone ? 'border-green-500' : isDeath ? 'border-stone-400' : isDropOff ? 'border-red-300' : isOverdue ? 'border-orange-300' : isManualRefer ? 'border-purple-300' : 'border-gray-200 border-dashed hover:border-blue-300'}`}>
                              <div>
                                <div className="flex justify-between items-center mb-4 pb-3 border-b border-gray-100">
                                  <h4 className={`font-bold flex items-center ${isDone ? 'text-green-600' : isDeath ? 'text-stone-600' : isDropOff ? 'text-red-500' : isOverdue ? 'text-orange-500' : isManualRefer ? 'text-purple-600' : 'text-gray-500'}`}>
                                    <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs mr-2 text-white transition-colors ${isDone ? 'bg-green-500' : isDeath ? 'bg-stone-500' : isDropOff ? 'bg-red-500' : isOverdue ? 'bg-orange-500' : isManualRefer ? 'bg-purple-500' : 'bg-gray-300'}`}>
                                      {isDeath || isDropOff ? <i className="fa-solid fa-xmark"></i> : num}
                                    </div>
                                    Visit {num}
                                  </h4>
                                  {isDone && <i className="fa-solid fa-circle-check text-green-500 text-lg animate-pop-in"></i>}
                                </div>
                                
                                <div className="space-y-3 mb-4">
                                  <div>
                                    <div className="flex justify-between items-baseline mb-1">
                                      <label className="block text-[10px] uppercase font-bold text-gray-500">Date of Visit</label>

                                    </div>
                                    <input type="date" className="w-full border border-gray-300 rounded p-1.5 text-sm outline-none focus:border-blue-500 transition-colors hover:border-blue-300 cursor-pointer" value={visit.date || ''} onChange={(e) => handleUpdateVisit(i, 'date', e.target.value)}/>
                                  </div>
                                  <div className="grid grid-cols-2 gap-2">
                                    <div><label className="block text-[10px] uppercase font-bold text-gray-500 mb-1">Weight (kg)</label><input type="number" step="0.01" className="w-full border border-gray-300 rounded p-1.5 text-sm outline-none focus:border-blue-500 transition-colors hover:border-blue-300" value={visit.weight || ''} onChange={(e) => handleUpdateVisit(i, 'weight', e.target.value)}/></div>
                                    <div><label className="block text-[10px] uppercase font-bold text-gray-500 mb-1">Temp (°C)</label><input type="number" step="0.1" className="w-full border border-gray-300 rounded p-1.5 text-sm outline-none focus:border-blue-500 transition-colors hover:border-blue-300" value={visit.temp || ''} onChange={(e) => handleUpdateVisit(i, 'temp', e.target.value)}/></div>
                                  </div>
                                  <div className="grid grid-cols-2 gap-2">
                                    <div>
                                      <label className="block text-[10px] uppercase font-bold text-gray-500 mb-1">Visit Status</label>
                                      <select className="w-full border border-gray-300 rounded p-1.5 text-sm outline-none focus:border-blue-500 transition-colors hover:border-blue-300 cursor-pointer" value={visit.visitStatus || ''} onChange={(e) => handleUpdateVisit(i, 'visitStatus', e.target.value)}>
                                        <option value="">- Pending -</option>
                                        <option value="Attended">Attended</option>
                                        <option value="Refer to higher center">Refer to higher center</option>
                                        <option value="Loss of contact">Loss of contact</option>
                                        <option value="Death">Death</option>
                                      </select>
                                    </div>
                                    <div>
                                      <label className="block text-[10px] uppercase font-bold text-gray-500 mb-1">Types of Feeding</label>
                                      <select className="w-full border border-gray-300 rounded p-1.5 text-sm outline-none focus:border-blue-500 transition-colors hover:border-blue-300 cursor-pointer" value={visit.feedingType || ''} onChange={(e) => handleUpdateVisit(i, 'feedingType', e.target.value)}>
                                        <option value="">- Select -</option>
                                        <option value="Exclusive Breast Feeding">Exclusive Breast Feeding</option>
                                        <option value="Formula Feeding">Formula Feeding</option>
                                        <option value="Mixed Feeding">Mixed Feeding</option>
                                      </select>
                                    </div>
                                  </div>

                                  <div className="grid grid-cols-1 gap-2 mt-2 pt-3 border-t border-gray-100">

                                        <option value="">- Select -</option>
                                        <option value="Yes">Yes</option>
                                        <option value="No">No</option>
                                      </select>
                                    </div>
                                    
                                    {visit.hasDangerSign === 'Yes' && (
                                      <div className="animate-pop-in bg-red-50/50 p-3 rounded-lg border border-red-100 flex flex-col gap-2 mt-1">

                                          <label className="block text-[9px] uppercase font-bold text-red-600 mb-1">Select Danger Sign</label>

                                            <option value="Can't sucking well">Can't sucking well</option>
                                            <option value="Hyperthermia/Hypothermia">Hyperthermia/Hypothermia</option>
                                            <option value="Fits">Fits</option>
                                            <option value="Floppy">Floppy</option>
                                            <option value="Fast breathing/ Chest indrawing">Fast breathing/ Chest indrawing</option>
                                            <option value="Others">Others</option>
                                          </select>
                                        </div>
                                        {visit.dangerSign === 'Others' && (
                                          <div className="animate-pop-in">
                                            <input type="text" className="w-full border border-red-300 rounded p-1.5 text-xs outline-none focus:border-red-500 transition-colors hover:border-red-400" placeholder="Please specify danger sign..." value={visit.dangerSignOther || ''} onChange={(e) => handleUpdateVisit(i, 'dangerSignOther', e.target.value)} />
                                          </div>
                                        )}
                                      </div>
                                    )}

                                        <option value="">- Select -</option><option value="Yes">Yes</option><option value="No">No</option>
                                      </select>
                                    </div>
                                    {visit.kmcPracticed === 'Yes' && (

                                        <div className="text-[10px] font-bold text-gray-400 mt-4">- OR -</div>
                                        <div className="flex-1 relative"><label className="block text-[9px] uppercase font-bold text-gray-500 mb-1">Total Hr (All Time)</label><div className="relative"><input type="number" min="0" className="w-full border border-gray-300 rounded p-1.5 pr-6 text-xs outline-none focus:border-blue-500 transition-colors hover:border-blue-300" placeholder="Total" value={visit.kmcTotalHours || ''} onChange={(e) => handleUpdateVisit(i, 'kmcTotalHours', e.target.value)} /><span className="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] text-gray-400">hr</span></div></div>
                                      </div>
                                    )}
                                    {visit.kmcPracticed === 'No' && (
                                      <div className="animate-pop-in bg-red-50/50 p-3 rounded-lg border border-red-100 flex flex-col gap-3 mt-1">

                                        </div>
                                        <div>
                                          <label className="block text-[9px] uppercase font-bold text-gray-500 mb-1">Barrier Category</label>
                                          <select className="w-full border border-gray-300 rounded p-1.5 text-xs outline-none focus:border-blue-500 bg-white transition-colors hover:border-blue-300 cursor-pointer" value={visit.kmcNoCategory || ''} onChange={(e) => handleUpdateVisit(i, 'kmcNoCategory', e.target.value)}>
                                            <option value="">- Select Category -</option>{kmcCategories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                          </select>
                                        </div>
                                        {visit.kmcNoCategory && (
                                          <div className="animate-pop-in">
                                            <label className="flex items-center text-[9px] uppercase font-bold text-gray-500 mb-1">
                                              Specific Reason
                                              {selectedReasonObj && (
                                                <div className="relative group ml-1">
                                                  <span className="text-blue-600 bg-blue-100 rounded-full w-3.5 h-3.5 flex items-center justify-center font-black cursor-help text-[10px] border border-blue-200 hover:bg-blue-200 transition-colors">*</span>
                                                  <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-48 p-2 bg-slate-800 text-white text-[10px] rounded shadow-lg opacity-0 group-hover:opacity-100 pointer-events-none z-50 transition-opacity whitespace-normal text-left font-normal leading-relaxed">{selectedReasonObj.detail}</div>
                                                </div>
                                              )}
                                            </label>
                                            <select className="w-full border border-gray-300 rounded p-1.5 text-xs outline-none focus:border-blue-500 bg-white transition-colors hover:border-blue-300 cursor-pointer" value={visit.kmcNoReason || ''} onChange={(e) => handleUpdateVisit(i, 'kmcNoReason', e.target.value)}>
                                              <option value="">- Select Reason -</option>{kmcBarriers[visit.kmcNoCategory].map(r => (<option key={r.reason} value={r.reason}>{r.reason}</option>))}
                                            </select>
                                            {selectedReasonObj && <p className="text-[10px] text-gray-600 mt-2 italic leading-tight bg-white/50 p-1.5 rounded animate-pop-in">{selectedReasonObj.detail}</p>}
                                          </div>
                                        )}
                                      </div>
                                    )}
                                  </div>

                                  <div><label className="block text-[10px] uppercase font-bold text-gray-500 mb-1">Client Experience on KMC (CFM)</label><textarea rows="2" className="w-full border border-gray-300 rounded p-1.5 text-sm outline-none focus:border-blue-500 resize-none transition-colors hover:border-blue-300" placeholder="Feedback or complaints..." value={visit.clientExperience || ''} onChange={(e) => handleUpdateVisit(i, 'clientExperience', e.target.value)}></textarea></div>
                                  <div><label className="block text-[10px] uppercase font-bold text-gray-500 mb-1">Clinical Notes & Suggestions</label><textarea rows="2" className="w-full border border-gray-300 rounded p-1.5 text-sm outline-none focus:border-blue-500 resize-none transition-colors hover:border-blue-300" placeholder="Provider advice..." value={visit.comments || ''} onChange={(e) => handleUpdateVisit(i, 'comments', e.target.value)}></textarea></div>
                                </div>
                              </div>
                              
                              {isDeath && <div className="animate-pop-in bg-stone-100 text-stone-800 text-xs px-2 py-1.5 rounded flex items-center mt-3 font-bold border border-stone-200"><i className="fa-solid fa-triangle-exclamation mr-1"></i> Patient Deceased</div>}
                              {!isDeath && isDropOff && <div className="animate-pop-in bg-red-100 text-red-800 text-xs px-2 py-1.5 rounded flex items-center mt-3 font-bold border border-red-200"><i className="fa-solid fa-triangle-exclamation mr-1"></i> {isManualDropOff ? 'Manual Drop Off (Lost)' : 'Drop Off (over 30 Days)'}</div>}
                              {!isDeath && isOverdue && <div className="animate-pop-in bg-orange-50 text-orange-700 text-xs px-2 py-1.5 rounded flex items-center mt-3 border border-orange-200"><i className="fa-solid fa-triangle-exclamation mr-1"></i> Overdue (&gt; 7 Days)</div>}
                              {!isDeath && isManualRefer && <div className="animate-pop-in bg-purple-100 text-purple-800 text-xs px-2 py-1.5 rounded flex items-center mt-3 font-bold border border-purple-200"><i className="fa-solid fa-wave-square mr-1"></i> Referred to Higher Center</div>}
                            </div>
                          );
                        })}
                      </div>

                      <div className="bg-white p-5 rounded-xl border border-gray-200 flex items-center hover-card cursor-default">
                        <div className="mr-6 shrink-0 bg-blue-100 p-4 rounded-full"><i className="fa-solid fa-right-left text-blue-600 text-2xl"></i></div>
                        <div className="flex-1">
                          <h3 className="font-bold text-gray-800 mb-2">Final Outcome Status</h3>
                          <div className={`inline-block px-4 py-2 rounded-lg border font-bold text-sm transition-colors ${
                            deriveOutcome(selectedClient) === 'Death' ? 'bg-stone-100 text-stone-800 border-stone-200' :
                            deriveOutcome(selectedClient) === 'Completed' ? 'bg-green-100 text-green-800 border-green-200' :
                            deriveOutcome(selectedClient) === 'Defaulted' ? 'bg-red-100 text-red-800 border-red-200' :
                            deriveOutcome(selectedClient) === 'Overdue' ? 'bg-orange-100 text-orange-800 border-orange-200' :
                            deriveOutcome(selectedClient) === 'Referred' ? 'bg-purple-100 text-purple-800 border-purple-200' :
                            'bg-blue-50 text-blue-800 border-blue-200'
                          }`}>Current Status: {deriveOutcome(selectedClient)}</div>
                          <p className="text-xs text-gray-500 mt-2">System Auto-Calculation: This outcome is automatically derived. Manual visit statuses take priority.</p>
                        </div>
                      </div>
                    </div>

                    <div className="bg-white p-4 border-t border-gray-200 flex justify-end space-x-3 shrink-0">
                      <button onClick={() => setIsVisitModalOpen(false)} className="btn-active px-5 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors">Discard Changes</button>
                      <button onClick={handleSaveVisits} className="btn-active px-5 py-2 text-white bg-green-600 hover:bg-green-700 rounded-lg font-medium flex items-center space-x-2 transition-all shadow-sm hover:shadow-md">
                        <i className="fa-solid fa-circle-check"></i><span>Save All Updates</span>
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Confirm Modal */}
              {confirmModal.isOpen && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[70] p-4">
                  <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden transform transition-all animate-pop-in">
                    <div className="p-6">
                      <div className="flex items-center justify-center w-12 h-12 rounded-full bg-red-100 mb-4 mx-auto"><i className="fa-solid fa-triangle-exclamation text-red-600 text-xl"></i></div>
                      <h3 className="text-lg font-bold text-center text-gray-900 mb-2">{confirmModal.title}</h3>
                      <p className="text-sm text-center text-gray-500 mb-6">{confirmModal.message}</p>
                      <div className="flex space-x-3">
                        <button onClick={() => setConfirmModal({ isOpen: false })} className="btn-active flex-1 bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg font-medium hover:bg-gray-50 transition-colors">Cancel</button>
                        <button onClick={confirmModal.onConfirm} className="btn-active flex-1 bg-red-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-red-700 transition-all shadow-sm hover:shadow-md shadow-red-200">Confirm</button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
