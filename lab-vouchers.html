<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Laboratory vouchers</title>
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/vendor/fontawesome-all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/vouchers.css">
  <link rel="stylesheet" href="css/voucher-invoice.css">
  <script src="js/vendor/bootstrap.bundle.min.js"></script>
  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-firestore.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
</head>
<body class="voucher-page lab-app">
  <div class="lab-shell">
    <aside class="lab-nav" aria-label="Laboratory">
      <div class="mb-3 px-2 fw-bold">Laboratory</div>
      <button type="button" class="is-active" data-page="scan"><i class="fas fa-qrcode me-2"></i>Scan</button>
      <button type="button" data-page="dashboard"><i class="fas fa-chart-bar me-2"></i>Dashboard</button>
      <button type="button" data-page="settings"><i class="fas fa-cog me-2"></i>Settings</button>
    </aside>

    <div>
      <header class="voucher-header lab-topbar">
        <div class="container d-flex align-items-center justify-content-between gap-2">
          <h1 class="mb-0" id="labPageTitle">Scan</h1>
          <div class="d-flex align-items-center gap-2">
            <button id="homeBtn" class="btn btn-outline-light voucher-header-action" type="button" aria-label="Home"><i class="fas fa-home me-1"></i>Home</button>
            <button id="logoutBtn" class="btn btn-outline-light voucher-header-action" type="button" aria-label="Log out"><i class="fas fa-sign-out-alt me-1"></i>Log out</button>
          </div>
        </div>
      </header>

      <main id="labApp" class="container voucher-main d-none">
        <div id="pageStatus" class="status-box info" role="status">Checking laboratory access…</div>

        <section id="scanPage" class="lab-page">
          <section class="voucher-card">
            <h2><i class="fas fa-camera me-2"></i>Scan or enter voucher</h2>
            <div id="cameraUnsupported" class="status-box warning d-none">
              Camera QR scanning is not supported in this browser. Enter the voucher code manually.
            </div>
            <div id="scanner" class="scanner-shell d-none mb-3">
              <video id="cameraVideo" playsinline muted aria-label="QR scanner camera"></video>
              <div class="scanner-guide" aria-hidden="true"></div>
            </div>
            <div class="d-flex flex-wrap gap-2 mb-3">
              <button id="startCamera" type="button" class="btn btn-outline-primary voucher-header-action">
                <i class="fas fa-qrcode me-2"></i>Scan QR
              </button>
              <button id="stopCamera" type="button" class="btn btn-outline-secondary d-none">Stop camera</button>
            </div>
            <form id="lookupForm" class="row g-2 align-items-end">
              <div class="col-md">
                <label for="voucherCodeInput" class="form-label">Voucher code</label>
                <input id="voucherCodeInput" class="form-control form-control-lg" type="text"
                       autocomplete="off" autocapitalize="characters" spellcheck="false"
                       placeholder="AB3K-9Q2M" required>
              </div>
              <div class="col-md-auto d-grid">
                <button id="lookupButton" class="btn btn-primary btn-lg" type="submit">Look up</button>
              </div>
            </form>
          </section>

          <section id="lookupResult" class="voucher-card d-none">
            <div id="invoiceMount" class="invoice-preview mb-3"></div>
            <div class="mb-3">
              <h3 class="h6">Add or remove tests</h3>
              <div id="lineEditor"></div>
              <button id="saveLinesBtn" type="button" class="btn btn-outline-primary mt-2">Update tests</button>
            </div>
            <div class="mb-3">
              <label for="cashierSelect" class="form-label">Cashier</label>
              <select id="cashierSelect" class="form-select"></select>
            </div>
            <div class="mb-3">
              <label class="form-label">Client signature</label>
              <canvas id="clientPad" class="sign-pad" width="640" height="180"></canvas>
              <button id="clearClientSign" type="button" class="btn btn-outline-secondary btn-sm mt-2">Clear signature</button>
            </div>
            <button id="confirmRedeem" type="button" class="btn btn-success btn-lg">Redeem invoice</button>
          </section>
        </section>

        <section id="dashboardPage" class="lab-page d-none">
          <section class="voucher-card">
            <label><span class="form-label">Period</span><input id="labPeriod" type="month" class="form-control"></label>
            <div class="info-grid mt-3" id="labStatTiles">
              <button type="button" class="lab-stat-tile" data-status="issued" aria-label="Show issued vouchers">
                <div class="info-label">Issued</div><div id="labIssued" class="info-value">—</div>
              </button>
              <button type="button" class="lab-stat-tile" data-status="redeemed" aria-label="Show redeemed vouchers">
                <div class="info-label">Redeemed</div><div id="labRedeemed" class="info-value">—</div>
              </button>
              <button type="button" class="lab-stat-tile" data-status="verified" aria-label="Show verified cash incoming">
                <div class="info-label">Verified / cash incoming</div><div id="labIncoming" class="info-value">—</div>
              </button>
              <button type="button" class="lab-stat-tile" data-status="paid" aria-label="Show paid money received">
                <div class="info-label">Paid / money received</div><div id="labPaid" class="info-value">—</div>
              </button>
            </div>
            <div id="labMidwives" class="mt-3"></div>
            <div id="labHistory" class="table-responsive mt-3"></div>
          </section>
        </section>

        <section id="settingsPage" class="lab-page d-none">
          <section class="voucher-card">
            <h2>Laboratory settings</h2>
            <label class="form-label">Lab seal</label>
            <input id="sealInput" class="form-control" type="file" accept="image/*">
            <img id="sealPreview" class="invoice-seal mt-2 d-none" alt="Lab seal preview">
            <div id="cashierFields" class="mt-3"></div>
            <button id="saveSettingsBtn" type="button" class="btn btn-primary mt-3">Save settings</button>
          </section>
        </section>
      </main>

      <nav class="lab-bottom-nav" aria-label="Laboratory pages">
        <button type="button" data-page="scan">Scan</button>
        <button type="button" data-page="dashboard">Dashboard</button>
        <button type="button" data-page="settings">Settings</button>
      </nav>
    </div>
  </div>

  <section id="accessDenied" class="voucher-card access-denied d-none">
    <h1 class="h4">Laboratory access required</h1>
    <p id="accessDeniedMessage" class="text-muted mb-3">This page is available to Lab accounts only.</p>
  </section>

  <script src="js/vendor/html2canvas.min.js"></script>
  <script src="js/vendor/qrcode.min.js"></script>
  <script src="js/role-landing.js"></script>
  <script src="js/voucher-pricing.js"></script>
  <script src="js/voucher-service.js"></script>
  <script src="js/voucher-invoice.js"></script>
  <script src="js/lab-vouchers.js"></script>
</body>
</html>
