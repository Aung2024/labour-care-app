<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#10b981" />
  <title>MNCH App — Offline</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(1.25rem, env(safe-area-inset-top))
        max(1.25rem, env(safe-area-inset-right))
        max(1.25rem, env(safe-area-inset-bottom))
        max(1.25rem, env(safe-area-inset-left));
      background: #f0fdf4;
      color: #14532d;
    }

    main {
      width: min(100%, 30rem);
      padding: 1.5rem;
      border: 1px solid #bbf7d0;
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 12px 30px rgba(20, 83, 45, 0.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.5rem;
    }

    p {
      margin: 0 0 1.25rem;
      line-height: 1.5;
      color: #3f6212;
    }

    nav {
      display: grid;
      gap: 0.75rem;
    }

    a,
    button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #16a34a;
      border-radius: 0.75rem;
      padding: 0.7rem 1rem;
      background: #16a34a;
      color: #fff;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
    }

    a.secondary {
      background: #fff;
      color: #166534;
    }
  </style>
  <script src="js/register-sw.js"></script>
</head>
<body>
  <main data-fallback-reason="unknown">
    <h1>Page unavailable</h1>
    <p id="offlineMessage">
      This page could not be loaded. Your internet connection may be temporarily
      unavailable, or this page has not been saved on this device.
    </p>
    <nav aria-label="Offline actions">
      <a href="index.html">Open MNCH App</a>
      <a class="secondary" href="home.html">Open Home</a>
      <a class="secondary" href="list.html">Open saved patient list</a>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </nav>
  </main>
  <script>
    (function () {
      var main = document.querySelector('main');
      var message = document.getElementById('offlineMessage');
      if (!main || !message) return;

      if (main.dataset.fallbackReason === 'timeout') {
        message.textContent = 'The app server took too long to respond. Check the connection and try again; this does not necessarily mean your device is fully offline.';
      }
    })();
  </script>
</body>
</html>
