<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Edit Visits - m-MNCH Care</title>
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="css/vendor/fontawesome-all.min.css" />
  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/vendor/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/joint-care-utils.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
      font-family: Inter, "Myanmar Text", system-ui, sans-serif;
      color: #111827;
    }
    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      color: white;
      padding: calc(0.9rem + env(safe-area-inset-top, 0px)) 1rem 0.9rem;
      box-shadow: 0 8px 24px rgba(67, 56, 202, 0.22);
    }
    .header-inner {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    h1 { font-size: 1.2rem; font-weight: 900; margin: 0; }
    .sub { opacity: 0.9; font-size: 0.84rem; margin-top: 0.15rem; }
    .btn-soft {
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.35);
      color: white;
      background: rgba(255,255,255,0.18);
      padding: 0.55rem 0.75rem;
      text-decoration: none;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 1rem calc(1rem + env(safe-area-inset-right, 0px)) calc(2rem + env(safe-area-inset-bottom, 0px)) calc(1rem + env(safe-area-inset-left, 0px));
    }
    .panel {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .visit-card {
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      background: #fff;
    }
    .visit-title { font-weight: 900; margin-bottom: 0.25rem; }
    .visit-meta { color: #64748b; font-size: 0.88rem; line-height: 1.5; }
    .visit-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
    .btn-action {
      min-height: 44px;
      border-radius: 12px;
      border: 0;
      padding: 0.55rem 0.8rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .btn-edit { background: #4f46e5; color: white; }
    .btn-request { background: #f59e0b; color: #111827; }
    .btn-disabled { background: #e5e7eb; color: #64748b; }
    .empty { color: #64748b; text-align: center; padding: 1.25rem; }
    .status { font-weight: 800; margin-top: 0.5rem; }
    .status.error { color: #b91c1c; }
    .status.ok { color: #047857; }
    @media (max-width: 560px) {
      .sub { display: none; }
      .btn-soft span { display: none; }
      .visit-actions .btn-action { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div>
        <h1 id="pageTitle">Edit Visits</h1>
        <div class="sub" id="pageSubtitle">Edit records you created within 7 days, or request TMO approval.</div>
      </div>
      <a href="patient-care-hub.html" class="btn-soft"><i class="fas fa-arrow-left"></i><span>Hub</span></a>
    </div>
  </header>
  <main>
    <section class="panel">
      <div id="patientInfo" class="visit-meta">Loading patient...</div>
      <div id="statusMessage" class="status"></div>
    </section>
    <section class="panel">
      <div id="visitsContainer"></div>
      <div id="emptyState" class="empty" style="display:none;">No visits found.</div>
    </section>
  </main>
  <script>
    let currentUser = null;
    let currentPatient = null;
    let visitType = null;
    let visitConfig = null;

    function qs(name) { return new URLSearchParams(window.location.search).get(name); }
    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function setStatus(msg, type) {
      const el = document.getElementById('statusMessage');
      el.textContent = msg || '';
      el.className = 'status' + (type ? ' ' + type : '');
    }
    function formatDate(value) {
      const d = JointCareUtils.timestampToDate(value) || (value ? new Date(value) : null);
      return d && !isNaN(d.getTime()) ? d.toLocaleDateString() : '-';
    }
    function visitLabel(data, index) {
      return visitConfig.label + ' Visit ' + (data.visitNumber || data.visit_number || index + 1);
    }
    function editUrl(visitId, approvalId) {
      const base = visitConfig.form + '?patient=' + encodeURIComponent(currentPatient.id) + '&editVisitId=' + encodeURIComponent(visitId) + '&editVisitType=' + encodeURIComponent(visitType);
      return approvalId ? base + '&editApprovalId=' + encodeURIComponent(approvalId) : base;
    }
    async function requestApproval(visitId, visit) {
      const reason = prompt('Reason for edit request (shown to TMO):') || '';
      try {
        const result = await JointCareUtils.requestVisitEdit(currentPatient, visitType, visitId, visit, currentUser, reason);
        setStatus(result.alreadyPending ? 'An edit request is already pending for this visit.' : 'Edit request sent to TMO.', 'ok');
        await loadVisits();
      } catch (e) {
        setStatus(e.message || 'Could not request approval.', 'error');
      }
    }
    async function loadVisits() {
      const container = document.getElementById('visitsContainer');
      const empty = document.getElementById('emptyState');
      container.innerHTML = '';
      empty.style.display = 'none';
      const snap = await firebase.firestore().collection('patients').doc(currentPatient.id)
        .collection(visitConfig.collection)
        .get();
      const rows = snap.docs.map(function (doc, index) {
        return { id: doc.id, index: index, data: doc.data() || {} };
      }).sort(function (a, b) {
        const av = a.data.visitNumber || a.data.visit_number || 999;
        const bv = b.data.visitNumber || b.data.visit_number || 999;
        if (av !== bv) return av - bv;
        return (JointCareUtils.timestampToDate(a.data.visitDate || a.data.createdAt || a.data.timestamp) || 0) -
          (JointCareUtils.timestampToDate(b.data.visitDate || b.data.createdAt || b.data.timestamp) || 0);
      });
      if (!rows.length) {
        empty.style.display = 'block';
        return;
      }
      for (const row of rows) {
        const visit = row.data;
        const creator = JointCareUtils.visitCreatorId(visit);
        const ownRecord = creator === currentUser.uid;
        const withinWindow = JointCareUtils.canUserEditVisitNow(visit, currentUser.uid);
        const approval = ownRecord && !withinWindow
          ? await JointCareUtils.findUnusedApproval(currentPatient.id, visitType, row.id, currentUser.uid)
          : null;
        const canEdit = ownRecord && (withinWindow || approval);
        const card = document.createElement('div');
        card.className = 'visit-card';
        card.innerHTML = `
          <div class="visit-title">${escapeHtml(visitLabel(visit, row.index))}</div>
          <div class="visit-meta">
            Visit date: ${escapeHtml(formatDate(visit.visitDate || visit.visit_date))}<br>
            Created: ${escapeHtml(formatDate(visit.createdAt || visit.timestamp || visit.offline_created_at))}<br>
            ${ownRecord ? 'Created by you' : 'Created by another user'}
          </div>
          <div class="visit-actions"></div>
        `;
        const actions = card.querySelector('.visit-actions');
        if (canEdit) {
          const link = document.createElement('a');
          link.href = editUrl(row.id, approval ? approval.id : '');
          link.className = 'btn-action btn-edit';
          link.innerHTML = '<i class="fas fa-edit"></i> Edit Visit';
          actions.appendChild(link);
        } else if (ownRecord) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn-action btn-request';
          btn.innerHTML = '<i class="fas fa-paper-plane"></i> Request TMO Approval';
          btn.onclick = function () { requestApproval(row.id, visit); };
          actions.appendChild(btn);
        } else {
          const locked = document.createElement('button');
          locked.type = 'button';
          locked.disabled = true;
          locked.className = 'btn-action btn-disabled';
          locked.innerHTML = '<i class="fas fa-lock"></i> Only creator can edit';
          actions.appendChild(locked);
        }
        container.appendChild(card);
      }
    }
    firebase.auth().onAuthStateChanged(async function (user) {
      user = window.resolvePilotAuthUser ? window.resolvePilotAuthUser(user) : user;
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;
      visitType = qs('type') || 'anc';
      visitConfig = JointCareUtils.getVisitTypeConfig(visitType);
      if (!visitConfig) {
        setStatus('Unknown visit type.', 'error');
        return;
      }
      document.getElementById('pageTitle').textContent = 'Edit ' + visitConfig.label + ' Visits';
      const patientId = qs('patient') || sessionStorage.getItem('selectedPatientId');
      if (!patientId) { window.location.href = 'list.html'; return; }
      const patientDoc = await firebase.firestore().collection('patients').doc(patientId).get();
      if (!patientDoc.exists) { setStatus('Patient not found.', 'error'); return; }
      currentPatient = { id: patientDoc.id, ...patientDoc.data() };
      document.getElementById('patientInfo').textContent = (currentPatient.name || 'Unknown Patient') + ' · ' + (currentPatient.patient_unique_id || currentPatient.patientUniqueId || patientDoc.id);
      await loadVisits();
    });
  </script>
</body>
</html>
