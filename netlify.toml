[build]
  publish = "."
  command = "node scripts/generate-pwa-manifest.js && node scripts/build-pwa-release.js"

[build.environment]
  # Firebase web client keys are designed to be public; Firestore rules
  # and Auth still protect data. Omit only those files from Netlify's
  # secrets scanner so deploys are not blocked.
  SECRETS_SCAN_OMIT_PATHS = "firebase.runtime-config.json,js/firebase.js"
  PWA_RELEASE_MODE = "testing"

[[redirects]]
  from = "/api/query-hrt-tracking"
  to = "https://queryhrttracking-houbbz2mta-uc.a.run.app"
  status = 200
  force = true

[[redirects]]
  from = "/api/query-kmc-tracking"
  to = "https://querykmctracking-houbbz2mta-uc.a.run.app"
  status = 200
  force = true

[[redirects]]
  from = "/api/send-hrt-sms"
  to = "https://sendhrtsms-houbbz2mta-uc.a.run.app"
  status = 200
  force = true

[[headers]]
  for = "/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/css/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/css/style.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/css/compact-app-bar.css"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/firebase.runtime-config.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/pwa-release-config.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

