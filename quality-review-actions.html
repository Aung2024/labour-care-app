<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Review Actions - Quality Improvement</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="css/vendor/fontawesome-all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/quality-improvement.css" />
  <script src="js/vendor/bootstrap.bundle.min.js"></script>
  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/vendor/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/user-cache.js"></script>
  <script src="js/nav-back.js"></script>
  <script src="js/quality-scoring.js?v=288"></script>
  <script src="js/quality-improvement.js?v=288"></script>
</head>
<body class="qi-app">
  <header class="app-header">
    <div class="container header-row">
      <h1><i class="fas fa-list-check me-2"></i><span class="lang-text" data-en="Review Actions" data-mm="လုပ်ဆောင်ချက်များ ပြန်ကြည့်ရန်">Review Actions</span></h1>
      <a href="quality-newborn.html" id="backToScoresBtn" class="btn btn-outline-light btn-sm touch-control">
        <i class="fas fa-arrow-left me-2"></i><span class="lang-text" data-en="Back" data-mm="ပြန်သွားရန်">Back</span>
      </a>
    </div>
  </header>

  <main class="page-main container">
    <div id="status" class="status" role="status" aria-live="polite">Loading review actions…</div>
    <section class="filter-card" id="supervisorFilter" style="display:none;">
      <label for="midwifeSelect" class="form-label fw-bold">Midwife</label>
      <select id="midwifeSelect" class="form-select touch-control"></select>
    </section>
    <div id="actionList" class="action-list"></div>
  </main>

  <script>
    let viewer = null
    let midwives = []
    let selectedProviderId = null
    const pageDomain = new URLSearchParams(location.search).get('domain') === 'antenatal'
      ? 'antenatal'
      : 'newborn'
    const scorePage = pageDomain === 'antenatal' ? 'quality-antenatal.html' : 'quality-newborn.html'
    const initialBack = document.getElementById('backToScoresBtn')
    if (initialBack) initialBack.href = scorePage

    const escapeHtml = (value) => String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')

    const indicatorDefs = () => {
      if (QualityScoring.indicatorDefsForDomain) {
        return QualityScoring.indicatorDefsForDomain(pageDomain)
      }
      return pageDomain === 'antenatal'
        ? (QualityScoring.ANC_INDICATOR_DEFS || [])
        : QualityScoring.INDICATOR_DEFS
    }

    const indicatorById = (indicatorId) => indicatorDefs().find(
      (indicator) => indicator.id === indicatorId
    )

    const reasonLabel = (reasonId) => {
      const reason = QualityScoring.REASON_CATEGORIES.find((item) => item.id === reasonId)
      return reason ? reason.en : reasonId
    }

    const monthLabel = (month) => {
      if (window.QualityImprovement && typeof QualityImprovement.formatMonthLabel === 'function') {
        return QualityImprovement.formatMonthLabel(month, 'en')
      }
      if (window.QualityScoring && typeof QualityScoring.monthLabel === 'function') {
        return QualityScoring.monthLabel(month, 'en')
      }
      return month === 'all' ? 'All time' : String(month || '—')
    }

    const isSavedAction = (action) => {
      if (window.QualityImprovement && typeof QualityImprovement.isSavedAction === 'function') {
        return QualityImprovement.isSavedAction(action)
      }
      return !!(action && (action.nextAction || action.reasonCategory || action.explanation ||
        action.nextTargetPercent != null || action.targetMonth))
    }

    const setStatus = (message, isError) => {
      const status = document.getElementById('status')
      status.style.display = message ? '' : 'none'
      status.textContent = message || ''
      status.classList.toggle('error', Boolean(isError))
    }

    const renderComment = (card, comment) => {
      const list = card.querySelector('.comment-list')
      const textarea = card.querySelector('textarea')
      const meta = card.querySelector('.comment-meta')
      const button = card.querySelector('[data-save-comment]')
      if (!comment || !comment.text) {
        if (list) list.innerHTML = '<p class="text-muted small mb-2">No supervisor comment yet.</p>'
        if (textarea) textarea.value = ''
        if (meta) meta.textContent = ''
        if (button) button.textContent = 'Save comment'
        return
      }
      if (list) {
        list.innerHTML = '<div class="comment"><strong>' +
          escapeHtml(comment.authorName || comment.authorRole || 'Supervisor') +
          '</strong><p>' + escapeHtml(comment.text) + '</p></div>'
      }
      if (textarea) textarea.value = comment.text
      if (meta) {
        meta.textContent = 'Last edited by ' + (comment.authorName || comment.authorRole || 'Supervisor')
      }
      if (button) button.textContent = 'Update comment'
    }

    const loadComments = async (providerId, scoreMonth, indicatorId, mountId) => {
      const mount = document.getElementById(mountId)
      if (!mount) return
      try {
        const loader = QualityImprovement.loadSupervisorComment || function () {
          return QualityImprovement.loadComments(providerId, scoreMonth, indicatorId)
            .then((rows) => rows[0] || null)
        }
        const comment = await loader(providerId, scoreMonth, indicatorId)
        renderComment(mount, comment)
      } catch (error) {
        const list = mount.querySelector('.comment-list')
        if (list) list.innerHTML = '<p class="text-muted small">Comment could not be loaded.</p>'
      }
    }

    const saveComment = async (button) => {
      const card = button.closest('[data-action-row]')
      const textarea = card.querySelector('textarea')
      const providerId = card.dataset.providerId
      const scoreMonth = card.dataset.scoreMonth
      const indicatorId = card.dataset.indicatorId
      button.disabled = true
      try {
        const saver = QualityImprovement.saveSupervisorComment || QualityImprovement.addSupervisorComment
        const saved = await saver(
          viewer,
          providerId,
          scoreMonth,
          indicatorId,
          textarea.value
        )
        renderComment(card, saved || { text: textarea.value, authorName: viewer.name, authorRole: viewer.role })
      } catch (error) {
        alert(error.message || 'Could not save comment.')
      } finally {
        button.disabled = false
      }
    }

    const renderActions = async (actions) => {
      const mount = document.getElementById('actionList')
      const rows = (actions || []).filter((action) => isSavedAction(action) && action.indicatorId)
      if (!rows.length) {
        mount.innerHTML = '<div class="empty-state"><i class="fas fa-clipboard-check fa-2x mb-3"></i>' +
          '<p class="mb-0">No saved improvement actions yet.</p></div>'
        return
      }

      mount.innerHTML = rows.map((action, index) => {
        const indicator = indicatorById(action.indicatorId) || { en: action.indicatorId }
        const rowId = 'action-row-' + index
        const scoreMonth = action.sourceScoreMonth || action.scoreMonth || ''
        const targetMonth = action.targetMonth || ''
        const ownerType = action.actionOwnerType
        const ownerPrefix = ownerType === 'self'
          ? 'Self · '
          : (ownerType === 'tmo' ? 'TMO · ' : (ownerType === 'other' ? 'Other · ' : ''))
        return '<article class="action-card" id="' + rowId + '" data-action-row ' +
          'data-provider-id="' + escapeHtml(action.providerId || selectedProviderId) + '" ' +
          'data-score-month="' + escapeHtml(scoreMonth) + '" ' +
          'data-indicator-id="' + escapeHtml(action.indicatorId) + '">' +
          '<div class="d-flex justify-content-between align-items-start gap-2">' +
          '<h2 class="action-title">' + escapeHtml(indicator.en) + '</h2>' +
          '<div class="qi-badges">' +
          '<span class="period-badge">Score · ' + escapeHtml(monthLabel(scoreMonth)) + '</span>' +
          (targetMonth
            ? '<span class="period-badge target">Target · ' + escapeHtml(monthLabel(targetMonth)) + '</span>'
            : '') +
          '</div></div>' +
          '<div class="detail-grid">' +
          '<div class="detail"><span class="detail-label">Reason category</span>' +
          '<span class="detail-value">' + escapeHtml(reasonLabel(action.reasonCategory)) + '</span></div>' +
          '<div class="detail"><span class="detail-label">Reason details</span>' +
          '<span class="detail-value">' + escapeHtml(action.explanation) + '</span></div>' +
          '<div class="detail"><span class="detail-label">Next Action</span>' +
          '<span class="detail-value">' + escapeHtml(action.nextAction) + '</span></div>' +
          '<div class="detail"><span class="detail-label">Who will do it</span>' +
          '<span class="detail-value">' + escapeHtml(ownerPrefix + (action.actionOwner || '—')) + '</span></div>' +
          '<div class="detail"><span class="detail-label">Next target</span>' +
          '<span class="detail-value">' + escapeHtml(action.nextTargetPercent != null ? action.nextTargetPercent + '%' : '—') +
          (targetMonth ? ' by ' + escapeHtml(monthLabel(targetMonth)) : '') +
          '</span></div>' +
          '</div>' +
          '<div class="comments"><div class="comment-list">Loading comment…</div>' +
          (QualityImprovement.isSupervisorRole(viewer.role)
            ? '<label class="form-label fw-bold mt-2">TMO / Supervisor comment</label>' +
              '<textarea class="form-control" rows="3" placeholder="Guidance for reaching the target"></textarea>' +
              '<p class="comment-meta qi-muted mt-2 mb-0"></p>' +
              '<button type="button" class="btn btn-success touch-control mt-2" data-save-comment>Save comment</button>'
            : '') +
          '</div></article>'
      }).join('')

      rows.forEach((action, index) => {
        loadComments(
          action.providerId || selectedProviderId,
          action.sourceScoreMonth || action.scoreMonth,
          action.indicatorId,
          'action-row-' + index
        )
      })
    }

    const loadActions = async () => {
      if (!selectedProviderId) {
        setStatus('Select a midwife.', true)
        return
      }
      setStatus('Loading review actions…')
      try {
        const loader = QualityImprovement.loadSavedActions || QualityImprovement.loadActionPlans
        const actions = await loader(selectedProviderId, pageDomain)
        setStatus('')
        await renderActions(actions)
      } catch (error) {
        setStatus(error.message || 'Could not load review actions.', true)
      }
    }

    const initializeProviderFilter = () => {
      const select = document.getElementById('midwifeSelect')
      if (!QualityImprovement.isSupervisorRole(viewer.role)) {
        selectedProviderId = viewer.uid
        return
      }
      document.getElementById('supervisorFilter').style.display = ''
      select.innerHTML = midwives.map((midwife) => (
        '<option value="' + midwife.id + '">' + escapeHtml(midwife.name) +
        (midwife.township ? ' · ' + escapeHtml(midwife.township) : '') + '</option>'
      )).join('')
      const requested = new URLSearchParams(location.search).get('provider')
      selectedProviderId = midwives.some((midwife) => midwife.id === requested)
        ? requested
        : (midwives[0] && midwives[0].id)
      select.value = selectedProviderId || ''
    }

    document.getElementById('midwifeSelect').addEventListener('change', (event) => {
      selectedProviderId = event.target.value
      loadActions()
    })
    document.getElementById('actionList').addEventListener('click', (event) => {
      const button = event.target.closest('[data-save-comment]')
      if (button) saveComment(button)
    })

    firebase.auth().onAuthStateChanged(async (user) => {
      if (!user) return
      try {
        viewer = await QualityImprovement.loadCurrentUserProfile()
        if (QualityImprovement.isSupervisorRole(viewer.role)) {
          midwives = await QualityImprovement.listScopedMidwives(viewer)
        }
        initializeProviderFilter()
        const back = document.getElementById('backToScoresBtn')
        if (back) {
          back.href = selectedProviderId
            ? (scorePage + '?provider=' + encodeURIComponent(selectedProviderId))
            : scorePage
        }
        await loadActions()
      } catch (error) {
        setStatus(error.message || 'Could not initialize Review Actions.', true)
      }
    })
  </script>
</body>
</html>
