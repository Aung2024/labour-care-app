<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clinical Data-based Assessment - Quality Improvement</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="css/vendor/fontawesome-all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/quality-improvement.css" />
  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/vendor/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/nav-back.js"></script>
  <style>
    :root { --primary-color: #0d9488; --secondary-color: #0f766e; --card-hover-shadow: 0 16px 32px rgba(15, 23, 42, 0.12); }
    body { font-family: 'Inter', 'Myanmar Text', 'Segoe UI', sans-serif; min-height: 100dvh; display: flex; flex-direction: column; }
    .header-section {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white; padding: 0.85rem 1rem; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .header-section .container, .hub-main-container { max-width: 760px; }
    .header-section h1 { font-size: 1.2rem; font-weight: 800; margin: 0; line-height: 1.25; }
    .header-actions { display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; flex-wrap: wrap; }
    .header-actions .btn, .language-btn { min-height: 44px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .hub-main-container { flex: 1; width: 100%; padding: 1rem 1rem 2rem; }
    .care-modules { display: grid; grid-template-columns: 1fr; gap: 0.85rem; }
    .module-card {
      background: rgba(255, 255, 255, 0.97); border-radius: 16px; padding: 1rem 1.1rem;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08); cursor: pointer;
      border: 1px solid rgba(13, 148, 136, 0.15); border-left: 5px solid var(--primary-color);
      display: flex; align-items: center; gap: 1rem; min-height: 92px; touch-action: manipulation;
    }
    .module-card:hover { transform: translateY(-2px); box-shadow: var(--card-hover-shadow); }
    .module-icon {
      width: 48px; height: 48px; border-radius: 14px; background: #ccfbf1;
      display: inline-flex; align-items: center; justify-content: center;
      flex: 0 0 48px; font-size: 1.35rem; color: var(--primary-color);
    }
    .module-title { font-size: 1.05rem; font-weight: 800; color: #111827; margin-bottom: 0.2rem; }
    .module-description { color: #6b7280; font-size: 0.9rem; margin: 0; line-height: 1.45; }
    .module-content { flex: 1; min-width: 0; }
    .module-arrow { color: #94a3b8; }
    .language-switcher { display: flex; gap: 0.25rem; }
    .language-btn {
      min-width: 44px; padding: 0.375rem 0.75rem; font-size: 0.875rem; border-radius: 8px;
      background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white;
    }
    .language-btn.active { background: rgba(255,255,255,0.4); font-weight: 600; }
    @media (max-width: 768px) {
      .header-section .row > [class*="col-"] { width: 100%; }
      .header-actions { justify-content: flex-start; margin-top: 0.5rem; }
    }
  </style>
</head>
<body class="qi-app">
  <div class="header-section">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6">
          <h1><i class="fas fa-database me-2"></i><span class="lang-text" data-en="Clinical Data-based Assessment" data-mm="ဆေးခန်း ဒေတာအခြေပြု စစ်ဆေးခြင်း">Clinical Data-based Assessment</span></h1>
        </div>
        <div class="col-md-6">
          <div class="header-actions">
            <div class="language-switcher" role="group" aria-label="Language">
              <button type="button" class="btn btn-sm language-btn" data-lang="en" aria-label="English">ENG</button>
              <button type="button" class="btn btn-sm language-btn active" data-lang="mm" aria-label="Myanmar">MM</button>
            </div>
            <a href="quality-improvement.html" class="btn btn-outline-light btn-sm" aria-label="Back">
              <i class="fas fa-arrow-left me-2"></i><span class="lang-text" data-en="Back" data-mm="ပြန်သွားရန်">Back</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <main class="container hub-main-container">
    <div class="care-modules">
      <div class="module-card" role="button" tabindex="0" aria-label="Existing Database" onclick="navigateTo('quality-competency.html')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();navigateTo('quality-competency.html');}">
        <div class="module-icon"><i class="fas fa-folder-open"></i></div>
        <div class="module-content">
          <div class="module-title lang-text" data-en="Existing Database" data-mm="ရှိပြီးသား ဒေတာဘေ့စ်">Existing Database</div>
          <p class="module-description lang-text" data-en="Use patient records already in the app to review competency scores." data-mm="အက်ပ်ထဲရှိ လူနာမှတ်တမ်းများဖြင့် ကျွမ်းကျင်မှု အမှတ်များ ကြည့်ရန်">Use patient records already in the app to review competency scores.</p>
        </div>
        <i class="fas fa-chevron-right module-arrow" aria-hidden="true"></i>
      </div>

      <div class="module-card" role="button" tabindex="0" aria-label="Create New database Hard copies" onclick="navigateTo('quality-hardcopy-upload.html')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();navigateTo('quality-hardcopy-upload.html');}">
        <div class="module-icon"><i class="fas fa-file-upload"></i></div>
        <div class="module-content">
          <div class="module-title lang-text" data-en="Create New database (Hard copies)" data-mm="ဒေတာဘေ့စ် အသစ် ဖန်တီးရန် (Hard copies)">Create New database (Hard copies)</div>
          <p class="module-description lang-text" data-en="Upload Excel, Word, or photo copies of paper clinical records." data-mm="Excel၊ Word သို့မဟုတ် စက္ကူမှတ်တမ်း ဓာတ်ပုံများ တင်ရန်">Upload Excel, Word, or photo copies of paper clinical records.</p>
        </div>
        <i class="fas fa-chevron-right module-arrow" aria-hidden="true"></i>
      </div>
    </div>
  </main>

  <script>
    let currentLanguage = localStorage.getItem('appLanguage') || localStorage.getItem('language') || 'mm';
    function applyLanguage(lang) {
      currentLanguage = lang;
      localStorage.setItem('appLanguage', lang);
      document.querySelectorAll('.language-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      document.querySelectorAll('.lang-text').forEach(function (el) {
        var text = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-mm');
        if (text) el.textContent = text;
      });
    }
    function navigateTo(href) { window.location.href = href; }
    document.querySelectorAll('.language-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { applyLanguage(btn.dataset.lang); });
    });
    applyLanguage(currentLanguage);
  </script>
</body>
</html>
