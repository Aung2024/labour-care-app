<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#7c3aed">
  <title>Postnatal Care - Maternal & Child Health Care System</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="css/vendor/fontawesome-all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/vendor/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/patient-session.js"></script>
  <script src="js/offline-store.js"></script>
  <script src="js/offline-sync.js"></script>
  <script src="js/session-manager.js"></script>
  <style>
    :root {
      --primary-color: #7c3aed;
      --secondary-color: #6d28d9;
      --accent-color: #a78bfa;
      --light-bg: #faf5ff;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --card-hover-shadow: 0 16px 32px rgba(15, 23, 42, 0.12);
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Inter', 'Myanmar Text', 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      color: #0f172a;
    }

    .header-section {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 1.25rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .header-section .container,
    .pnc-main-container {
      max-width: 760px;
    }

    .header-section h1 {
      font-size: 1.45rem;
      font-weight: 800;
      margin: 0;
      line-height: 1.25;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .pnc-main-container {
      flex: 1;
      width: 100%;
      padding: 1.25rem 1rem 2rem;
    }

    #patientBanner > div {
      border-radius: 16px !important;
      margin-bottom: 1rem !important;
      padding: 0.9rem 1rem !important;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.12) !important;
    }

    .care-modules {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.85rem;
    }

    .module-card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 16px;
      padding: 1rem 1.1rem;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
      transition: all 0.3s ease;
      cursor: pointer;
      border: 1px solid rgba(124, 58, 237, 0.15);
      border-left: 5px solid var(--primary-color);
      display: flex;
      align-items: center;
      gap: 1rem;
      min-height: 92px;
      touch-action: manipulation;
    }

    .module-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--card-hover-shadow);
    }

    .module-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #ede9fe;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 48px;
      font-size: 1.35rem;
      color: var(--primary-color);
    }

    .module-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 0.2rem;
    }

    .module-description {
      color: #6b7280;
      font-size: 0.9rem;
      margin: 0;
      line-height: 1.45;
    }

    .module-content { flex: 1; min-width: 0; }
    .module-arrow { color: #94a3b8; }

    .footer {
      background: rgba(255, 255, 255, 0.95);
      color: #374151;
      text-align: center;
      padding: 1.25rem;
      margin-top: auto;
      border-radius: 20px 20px 0 0;
    }

    .language-switcher { display: flex; gap: 0.25rem; }

    .language-btn {
      padding: 0.375rem 0.75rem;
      font-size: 0.875rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      min-height: 44px;
      touch-action: manipulation;
    }

    .language-btn.active {
      background: rgba(255, 255, 255, 0.4);
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .header-section h1 { font-size: 1.2rem; }
      .header-actions .btn-outline-light { flex: 1 1 0; min-height: 44px; }
    }
  </style>
</head>
<body>
  <div class="header-section">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6">
          <h1>
            <i class="fas fa-hands-holding-child me-2"></i>
            <span class="lang-text" data-en="Postnatal Care" data-mm="မွေးပြီးမိခင် ပြုစုစောင့်ရှောက်မှု">Postnatal Care</span>
          </h1>
        </div>
        <div class="col-md-6">
          <div class="header-actions">
            <div class="language-switcher">
              <button type="button" class="btn btn-sm language-btn" data-lang="en"><span>🇬🇧</span> ENG</button>
              <button type="button" class="btn btn-sm language-btn active" data-lang="mm"><span>🇲🇲</span> MM</button>
            </div>
            <a href="#" class="btn btn-outline-light btn-sm" onclick="goBackToHub(); return false;">
              <i class="fas fa-arrow-left me-2"></i><span class="lang-text" data-en="Back to Hub" data-mm="ပြန်သွားရန်">Back to Hub</span>
            </a>
            <button class="btn btn-outline-light btn-sm" onclick="firebase.auth().signOut(); localStorage.clear(); sessionStorage.clear(); window.location='login.html';">
              <i class="fas fa-sign-out-alt me-2"></i><span class="lang-text" data-en="Logout" data-mm="ထွက်ရန်">Logout</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <main class="container pnc-main-container">
    <div id="patientBanner"></div>

    <div class="care-modules">
      <div class="module-card" onclick="newPostnatalVisit()">
        <div class="module-icon"><i class="fas fa-plus-circle"></i></div>
        <div class="module-content">
          <div class="module-title lang-text" data-en="New PNC Visit" data-mm="PNC အသစ် မှတ်တမ်းတင်ရန်">New PNC Visit</div>
          <div class="module-description lang-text" data-en="Record a postnatal care visit for this mother." data-mm="ဤမိခင်အတွက် မွေးပြီးမိခင် ပြုစုမှု မှတ်တမ်းတင်ရန်">Record a postnatal care visit for this mother.</div>
        </div>
        <i class="fas fa-chevron-right module-arrow"></i>
      </div>

      <div class="module-card" onclick="viewPostnatalReport()">
        <div class="module-icon"><i class="fas fa-file-medical-alt"></i></div>
        <div class="module-content">
          <div class="module-title lang-text" data-en="PNC Report" data-mm="PNC အစီရင်ခံစာ">PNC Report</div>
          <div class="module-description lang-text" data-en="Review and print the postnatal care summary." data-mm="မွေးပြီးမိခင် ပြုစုမှု အကျဉ်းချုပ်ကို ကြည့်ရှု/ထုတ်ယူရန်">Review and print the postnatal care summary.</div>
        </div>
        <i class="fas fa-chevron-right module-arrow"></i>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p class="mb-0"><i class="fas fa-heart me-2"></i>MNCH App 2025 | Developed by Jhpiego Myanmar for MoH.</p>
  </footer>

  <script>
    let currentLanguage = localStorage.getItem('appLanguage') || 'mm';

    function switchLanguage(lang) {
      currentLanguage = lang;
      localStorage.setItem('appLanguage', lang);
      document.querySelectorAll('.language-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      document.querySelectorAll('.lang-text').forEach(function (el) {
        el.textContent = el.dataset[lang] || el.dataset.en || el.textContent;
      });
    }

    function hubT(en, mm) {
      return currentLanguage === 'en' ? en : mm;
    }

    function getPatientId() {
      return sessionStorage.getItem('selectedPatientId');
    }

    function goBackToHub() {
      var patientId = getPatientId();
      window.location.href = patientId
        ? 'patient-care-hub.html?patient=' + encodeURIComponent(patientId)
        : 'patient-care-hub.html';
    }

    function newPostnatalVisit() {
      var patientId = getPatientId();
      if (!patientId) {
        alert(hubT('No patient selected.', 'လူနာ မရွေးချယ်ရသေးပါ။'));
        window.location.href = 'list.html';
        return;
      }
      window.location.href = 'postpartum-form.html?patient=' + encodeURIComponent(patientId);
    }

    function viewPostnatalReport() {
      var patientId = getPatientId();
      if (!patientId) {
        alert(hubT('No patient selected.', 'လူနာ မရွေးချယ်ရသေးပါ။'));
        window.location.href = 'list.html';
        return;
      }
      if (typeof navigator !== 'undefined' && navigator.onLine === false) {
        alert(hubT('This report is available online only.', 'ဤအစီရင်ခံစာကို အင်တာနက်ရှိမှသာ ကြည့်ရှုနိုင်ပါသည်။'));
        return;
      }
      window.location.href = 'postpartum-report.html?patient=' + encodeURIComponent(patientId);
    }

    firebase.auth().onAuthStateChanged(async function (user) {
      user = window.resolvePilotAuthUser ? window.resolvePilotAuthUser(user) : user;
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      var patientSession = initializePatientSession(true);
      if (patientSession) {
        await displayPatientBanner('patientBanner', { careType: 'pnc' });
      }
    });

    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.language-btn').forEach(function (btn) {
        btn.addEventListener('click', function () { switchLanguage(btn.dataset.lang); });
      });
      switchLanguage(currentLanguage);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
