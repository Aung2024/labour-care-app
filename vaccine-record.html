<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#10b981">
  <title>Record Vaccine - Maternal & Child Health Care System</title>
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/vendor/fontawesome-all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-firestore.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/ui-dialogs.js"></script>
  <script src="js/baby-patient-utils.js"></script>
  <style>
    :root {
      --primary-color: #10b981;
      --secondary-color: #059669;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --card-hover-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding-bottom: 2rem;
    }
    .medical-header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .app-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
    .page-subtitle { font-size: 0.9rem; opacity: 0.9; }
    .main-container { max-width: 800px; margin: 0 auto; padding: 1.5rem; }
    .form-card {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: var(--card-shadow);
      border-left: 5px solid var(--primary-color);
      margin-bottom: 1.5rem;
    }
    .form-label { font-weight: 600; color: #374151; }
    .btn-save {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      border: none;
      padding: 0.875rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35); color: white; }
    .vaccine-entry {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 1rem;
      margin-bottom: 0.85rem;
      background: #f8fafc;
    }
    .vaccine-entry-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .vaccine-entry-title {
      font-weight: 700;
      color: #111827;
      margin: 0;
    }
    .btn-remove-vaccine {
      min-height: 44px;
      min-width: 44px;
      border-radius: 10px;
      font-weight: 700;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-add-vaccine {
      min-height: 44px;
      width: 100%;
      margin-bottom: 1rem;
      border-radius: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .vaccine-select-premium {
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 0.875rem 1rem;
      font-size: 1rem;
      background: white;
      transition: all 0.2s ease;
    }
    .vaccine-select-premium:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
      outline: none;
    }
    .btn-back {
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.5);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-back:hover { background: rgba(255,255,255,0.3); color: white; }
  </style>
</head>
<body>
  <header class="medical-header">
    <div class="header-content">
      <div>
        <h1 class="app-title"><i class="fas fa-syringe me-2"></i><span class="lang-text" data-en="Record New Vaccine" data-mm="ကာကွယ်ဆေး အသစ် မှတ်တမ်းတင်ရန်">Record New Vaccine</span></h1>
        <p class="page-subtitle lang-text" data-en="Record immunization for this baby" data-mm="ဤကလေးအတွက် ကာကွယ်ဆေးထိုး မှတ်တမ်းတင်ပါ">Record immunization for this baby</p>
      </div>
      <a href="#" class="btn-back" onclick="goBack(); return false;">
        <i class="fas fa-arrow-left me-2"></i><span class="lang-text" data-en="Back" data-mm="နောက်သို့">Back</span>
      </a>
    </div>
  </header>

  <div class="main-container">
    <div id="babyInfoBar" class="form-card mb-3" style="display:none;">
      <h6 class="text-muted mb-2"><i class="fas fa-baby me-2"></i><span class="lang-text" data-en="Baby" data-mm="ကလေး">Baby</span></h6>
      <p class="mb-0"><strong id="babyNameDisplay">-</strong> <span id="babyAgeDisplay" class="text-muted"></span></p>
    </div>

    <div class="form-card">
      <form id="vaccineForm">
        <div id="vaccineRows"></div>
        <button type="button" class="btn btn-outline-success btn-add-vaccine" id="addVaccineRowBtn">
          <i class="fas fa-plus"></i>
          <span class="lang-text" data-en="Add more vaccine" data-mm="ကာကွယ်ဆေး ထပ်ထည့်ရန်">Add more vaccine</span>
        </button>
        <button type="submit" class="btn btn-save w-100" id="submitBtn">
          <i class="fas fa-save me-2"></i><span class="lang-text" data-en="Save Vaccine Records" data-mm="ကာကွယ်ဆေး မှတ်တမ်း သိမ်းဆည်းပါ">Save Vaccine Records</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    // db is already defined globally by firebase.js - do not redeclare
    let patientId, babyName, babyBirthDate;
    const urlParams = new URLSearchParams(window.location.search);
    patientId = urlParams.get('patient');

    const VACCINES = [
      { id: 'bcg', name: 'BCG', nameMm: 'ဘီစီဂျီ', type: 'injection' },
      { id: 'hepb', name: 'Hepatitis B', nameMm: 'အသည်းရောင်အသားဝါ (ဘီ)', type: 'injection' },
      { id: 'opv0', name: 'OPV-0', nameMm: 'ပိုလီယို (မွေးကင်းစ)', type: 'oral' },
      { id: 'polio1', name: 'Polio (1st)', nameMm: 'ပိုလီယို (ပထမ)', type: 'oral' },
      { id: 'polio2', name: 'Polio (2nd)', nameMm: 'ပိုလီယို (ဒုတိယ)', type: 'oral' },
      { id: 'polio3', name: 'Polio (3rd)', nameMm: 'ပိုလီယို (တတိယ)', type: 'oral' },
      { id: 'rota1', name: 'Rota (1st)', nameMm: 'ရိုတာ (ပထမ)', type: 'oral' },
      { id: 'rota2', name: 'Rota (2nd)', nameMm: 'ရိုတာ (ဒုတိယ)', type: 'oral' },
      { id: 'pcv1', name: 'PCV (1st)', nameMm: 'ပီစီဗီ (ပထမ)', type: 'injection' },
      { id: 'pcv2', name: 'PCV (2nd)', nameMm: 'ပီစီဗီ (ဒုတိယ)', type: 'injection' },
      { id: 'pcv3', name: 'PCV (3rd)', nameMm: 'ပီစီဗီ (တတိယ)', type: 'injection' },
      { id: 'pentavalent1', name: 'Pentavalent (1st)', nameMm: 'ငါးမျိုးစပ် (ပထမ)', type: 'injection' },
      { id: 'pentavalent2', name: 'Pentavalent (2nd)', nameMm: 'ငါးမျိုးစပ် (ဒုတိယ)', type: 'injection' },
      { id: 'pentavalent3', name: 'Pentavalent (3rd)', nameMm: 'ငါးမျိုးစပ် (တတိယ)', type: 'injection' },
      { id: 'pentavalent4', name: 'Pentavalent (4th)', nameMm: 'ငါးမျိုးစပ် (စတုတ္ထ)', type: 'injection' },
      { id: 'polio_inj', name: 'Polio Injection', nameMm: 'ပိုလီယိုထိုးဆေး', type: 'injection' },
      { id: 'mr1', name: 'Measles-Rubella (1st)', nameMm: 'ဝက်သက်-ဂျိုက်သိုး (ပထမ)', type: 'injection' },
      { id: 'mr2', name: 'Measles-Rubella (2nd)', nameMm: 'ဝက်သက်-ဂျိုက်သိုး (ဒုတိယ)', type: 'injection' },
      { id: 'je', name: 'Japanese Encephalitis', nameMm: 'ဂျပန်ဦးနှောက်ရောင်', type: 'injection' },
      { id: 'hpv1', name: 'HPV (1st)', nameMm: 'အိတ်ချ်ပီဗီ (ပထမ)', type: 'injection' },
      { id: 'hpv2', name: 'HPV (2nd)', nameMm: 'အိတ်ချ်ပီဗီ (ဒုတိယ)', type: 'injection' },
      { id: 'vitamin_k', name: 'Vitamin K', nameMm: 'ဗီတာမင် ကေ', type: 'injection' },
      { id: 'other', name: 'Other', nameMm: 'အခြား', type: 'other' }
    ];

    const lang = localStorage.getItem('appLanguage') || 'en';

    function vaccNotice(message, title) {
      if (window.AppDialog && AppDialog.alert) {
        return AppDialog.alert(String(message || ''), { title: title || (lang === 'mm' ? 'အသိပေးချက်' : 'Notice') });
      }
      alert(message);
    }

    function parseBirthDate(raw) {
      if (!raw) return null;
      if (typeof raw === 'string') {
        const parsed = new Date(raw);
        return isNaN(parsed.getTime()) ? null : parsed;
      }
      if (raw.toDate && typeof raw.toDate === 'function') {
        return raw.toDate();
      }
      if (raw.seconds) {
        return new Date(raw.seconds * 1000);
      }
      return null;
    }
    document.querySelectorAll('.lang-text').forEach(el => {
      el.textContent = el.dataset[lang] || el.dataset.en || el.textContent;
    });

    firebase.auth().onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      if (!patientId) { vaccNotice(lang === 'mm' ? 'လူနာ ID မပါဝင်ပါ။' : 'No patient ID'); goBack(); return; }
      await loadBabyInfo();
    });

    document.getElementById('addVaccineRowBtn').addEventListener('click', function () {
      addVaccineRow();
    });

    let vaccineRowSeq = 0;

    function localDateValue(date) {
      const d = date instanceof Date && !isNaN(date.getTime()) ? date : new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function lastRowDate() {
      const dates = document.querySelectorAll('.vaccine-date');
      if (!dates.length) return localDateValue();
      return dates[dates.length - 1].value || localDateValue();
    }

    function vaccineOptionsHtml() {
      const placeholder = lang === 'mm' ? 'ကာကွယ်ဆေး ရွေးချယ်ပါ' : 'Select vaccine';
      return '<option value="">-- ' + placeholder + ' --</option>' +
        VACCINES.map(function (v) {
          return '<option value="' + v.id + '">' + (lang === 'mm' ? v.nameMm : v.name) + '</option>';
        }).join('');
    }

    function addVaccineRow() {
      vaccineRowSeq += 1;
      const rowId = String(vaccineRowSeq);
      const wrap = document.getElementById('vaccineRows');
      const row = document.createElement('div');
      row.className = 'vaccine-entry';
      row.dataset.rowId = rowId;
      const title = (lang === 'mm' ? 'ကာကွယ်ဆေး ' : 'Vaccine ') + rowId;
      row.innerHTML =
        '<div class="vaccine-entry-head">' +
          '<h6 class="vaccine-entry-title">' + title + '</h6>' +
          '<button type="button" class="btn btn-outline-danger btn-remove-vaccine" data-remove-row="' + rowId + '" aria-label="' + (lang === 'mm' ? 'ဖယ်ရှားရန်' : 'Remove') + '">' +
            '<i class="fas fa-times"></i>' +
          '</button>' +
        '</div>' +
        '<div class="mb-3">' +
          '<label class="form-label" for="vaccineSelect-' + rowId + '">' + (lang === 'mm' ? 'ကာကွယ်ဆေး ရွေးချယ်ပါ' : 'Select Vaccine') + '</label>' +
          '<select id="vaccineSelect-' + rowId + '" class="form-select form-select-lg vaccine-select-premium vaccine-select">' +
            vaccineOptionsHtml() +
          '</select>' +
        '</div>' +
        '<div class="mb-3">' +
          '<label class="form-label" for="dateGiven-' + rowId + '">' + (lang === 'mm' ? 'ထိုးသည့်ရက်' : 'Date Given') + '</label>' +
          '<input type="date" id="dateGiven-' + rowId + '" class="form-control form-control-lg vaccine-date" value="' + lastRowDate() + '">' +
        '</div>' +
        '<div class="mb-0">' +
          '<label class="form-label" for="notes-' + rowId + '">' + (lang === 'mm' ? 'မှတ်ချက် (ရွေးချယ်နိုင်သည်)' : 'Notes (optional)') + '</label>' +
          '<textarea id="notes-' + rowId + '" class="form-control vaccine-notes" rows="2" placeholder="' + (lang === 'mm' ? 'အသုတ်နံပါတ်၊ ထိုးသည့်နေရာ၊ တုံ့ပြန်မှု...' : 'Batch number, site, reactions...') + '"></textarea>' +
        '</div>';
      wrap.appendChild(row);
      row.querySelector('[data-remove-row]').addEventListener('click', function () {
        removeVaccineRow(rowId);
      });
      refreshRemoveButtons();
      if (document.querySelectorAll('.vaccine-entry').length > 1) {
        const nextSelect = row.querySelector('.vaccine-select');
        if (nextSelect) nextSelect.focus();
      }
    }

    function removeVaccineRow(rowId) {
      const rows = document.querySelectorAll('.vaccine-entry');
      if (rows.length <= 1) return;
      const row = document.querySelector('.vaccine-entry[data-row-id="' + rowId + '"]');
      if (row) row.remove();
      refreshRemoveButtons();
    }

    function refreshRemoveButtons() {
      const rows = document.querySelectorAll('.vaccine-entry');
      rows.forEach(function (row, index) {
        const title = row.querySelector('.vaccine-entry-title');
        if (title) title.textContent = (lang === 'mm' ? 'ကာကွယ်ဆေး ' : 'Vaccine ') + (index + 1);
        const btn = row.querySelector('.btn-remove-vaccine');
        if (btn) btn.style.visibility = rows.length > 1 ? 'visible' : 'hidden';
      });
    }

    function collectVaccineEntries() {
      const entries = [];
      document.querySelectorAll('.vaccine-entry').forEach(function (row) {
        const vaccineId = String(row.querySelector('.vaccine-select')?.value || '').trim();
        const dateGiven = String(row.querySelector('.vaccine-date')?.value || '').trim();
        const notes = String(row.querySelector('.vaccine-notes')?.value || '').trim();
        if (!vaccineId && !dateGiven && !notes) return;
        entries.push({ vaccineId: vaccineId, dateGiven: dateGiven, notes: notes });
      });
      return entries;
    }

    document.getElementById('vaccineForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawEntries = collectVaccineEntries();
      if (!rawEntries.length) {
        await vaccNotice(lang === 'mm' ? 'ကာကွယ်ဆေး အနည်းဆုံး တစ်ခု ရွေးပါ။' : 'Please add at least one vaccine.', lang === 'mm' ? 'လိုအပ်သည်' : 'Required');
        return;
      }
      const incomplete = rawEntries.some(function (row) { return !row.vaccineId || !row.dateGiven; });
      if (incomplete) {
        await vaccNotice(lang === 'mm' ? 'ကာကွယ်ဆေးနှင့် ထိုးသည့်ရက်ကို ဖြည့်ပါ။' : 'Please complete the vaccine and date for each row.', lang === 'mm' ? 'လိုအပ်သည်' : 'Required');
        return;
      }
      const seen = new Set();
      const duplicate = rawEntries.find(function (row) {
        if (row.vaccineId === 'other') return false;
        if (seen.has(row.vaccineId)) return true;
        seen.add(row.vaccineId);
        return false;
      });
      if (duplicate) {
        await vaccNotice(lang === 'mm' ? 'တူညီသော ကာကွယ်ဆေးကို ထပ်မရွေးပါနှင့်။' : 'The same vaccine is selected more than once.', lang === 'mm' ? 'သတိ' : 'Notice');
        return;
      }
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>' + (lang === 'mm' ? 'သိမ်းနေသည်...' : 'Saving...');
      try {
        const batch = db.batch();
        const col = db.collection('patients').doc(patientId).collection('vaccinations');
        const uid = firebase.auth().currentUser.uid;
        rawEntries.forEach(function (row) {
          const vaccine = VACCINES.find(function (v) { return v.id === row.vaccineId; });
          if (!vaccine) return;
          batch.set(col.doc(), {
            vaccineId: row.vaccineId,
            vaccineName: vaccine.name,
            vaccineNameMm: vaccine.nameMm,
            type: vaccine.type,
            dateGiven: row.dateGiven,
            notes: row.notes || null,
            recordedBy: uid,
            recordedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        });
        await batch.commit();
        const savedCount = rawEntries.length;
        const savedMsg = lang === 'mm'
          ? ('ကာကွယ်ဆေး မှတ်တမ်း ' + savedCount + ' ခု သိမ်းဆည်းပြီးပါပြီ။')
          : (savedCount === 1 ? 'Vaccine record saved successfully.' : savedCount + ' vaccine records saved successfully.');
        await vaccNotice(savedMsg, lang === 'mm' ? 'သိမ်းပြီး' : 'Saved');
        window.location.href = `vaccine-home.html?patient=${patientId}`;
      } catch (err) {
        vaccNotice('Error: ' + err.message, lang === 'mm' ? 'အမှား' : 'Error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save me-2"></i><span class="lang-text" data-en="Save Vaccine Records" data-mm="ကာကွယ်ဆေး မှတ်တမ်း သိမ်းဆည်းပါ">Save Vaccine Records</span>';
      }
    });

    function goBack() {
      window.location.href = `vaccine-home.html?patient=${patientId}`;
    }

    addVaccineRow();

    async function loadBabyInfo() {
      try {
        const patientDoc = await db.collection('patients').doc(patientId).get();
        const patient = patientDoc.exists ? (patientDoc.data() || {}) : {};
        if (window.BabyPatientUtils && BabyPatientUtils.isBabyPatient(patient)) {
          babyName = patient.name || 'Baby';
          babyBirthDate = parseBirthDate(patient.date_of_birth || patient.birth_time);
        }
        if (!babyName || !babyBirthDate) {
          const newbornSnap = await db.collection('patients').doc(patientId).collection('newborn_care').limit(1).get();
          if (!newbornSnap.empty) {
            const d = newbornSnap.docs[0].data();
            babyName = d.baby_name || 'Baby';
            babyBirthDate = parseBirthDate(d.birth_time);
            if (!babyName && Array.isArray(d.babies) && d.babies.length) {
              const first = d.babies[0];
              babyName = first.babyName || first.baby_name || babyName;
              if (!babyBirthDate) babyBirthDate = parseBirthDate(first.birthTime || first.birth_time);
            }
          }
        }
        if (!babyName) babyName = 'Baby';
        document.getElementById('babyNameDisplay').textContent = babyName;
        document.getElementById('babyAgeDisplay').textContent = formatAge(babyBirthDate);
        document.getElementById('babyInfoBar').style.display = 'block';
      } catch (e) { console.warn(e); }
    }

    function formatAge(birth) {
      if (!birth || isNaN(birth.getTime())) return '';
      const d = Math.floor((Date.now() - birth.getTime()) / 86400000);
      if (d < 0) return '';
      if (d < 30) return `(${d} ${lang === 'mm' ? 'ရက်' : 'days'})`;
      if (d < 365) return `(${Math.floor(d / 30)} ${lang === 'mm' ? 'လ' : 'months'})`;
      return `(${Math.floor(d / 365)} ${lang === 'mm' ? 'နှစ်' : 'years'})`;
    }
  </script>
</body>
</html>
