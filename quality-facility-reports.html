<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Facility Reports - Quality Improvement</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="css/vendor/fontawesome-all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/quality-improvement.css" />
  <script src="js/vendor/bootstrap.bundle.min.js"></script>
  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/vendor/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/nav-back.js"></script>
  <script src="js/ui-dialogs.js"></script>
  <style>
    :root { --primary-color: #0d9488; --secondary-color: #0f766e; }
    body { font-family: 'Inter', 'Myanmar Text', 'Segoe UI', sans-serif; min-height: 100dvh; display: flex; flex-direction: column; }
    .header-section {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white; padding: 0.85rem 1rem; position: sticky; top: 0; z-index: 100;
    }
    .header-section .container, .page-main { max-width: 760px; }
    .header-section h1 { font-size: 1.15rem; font-weight: 800; margin: 0; }
    .header-actions { display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; flex-wrap: wrap; }
    .header-actions .btn, .language-btn, .qi-btn { min-height: 44px; touch-action: manipulation; }
    .page-main { flex: 1; width: 100%; margin: 0 auto; padding: 1rem 1rem 2rem; }
    .report-card {
      background: #fff; border-radius: 14px; border: 1px solid #d7e0e8;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05); padding: 1rem; margin-bottom: 0.85rem;
    }
    .report-card h2 { font-size: 1.02rem; font-weight: 800; margin: 0 0 0.35rem; }
    .report-meta { color: #64748b; font-size: 0.88rem; margin-bottom: 0.75rem; }
    .report-label { font-size: 0.78rem; font-weight: 800; color: #0f766e; text-transform: uppercase; letter-spacing: 0.02em; margin: 0.65rem 0 0.25rem; }
    .report-body { color: #334155; font-size: 0.92rem; line-height: 1.5; margin: 0; }
    .language-switcher { display: flex; gap: 0.25rem; }
    .language-btn {
      min-width: 44px; padding: 0.375rem 0.75rem; border-radius: 8px;
      background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white;
    }
    .language-btn.active { background: rgba(255,255,255,0.4); font-weight: 600; }
    .demo-note {
      margin-top: 0.5rem; padding: 0.55rem 0.75rem; border-radius: 10px;
      background: #f0fdfa; border: 1px solid #99f6e4; color: #115e59; font-size: 0.82rem; font-weight: 600;
    }
  </style>
</head>
<body class="qi-app">
  <div class="header-section">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-7">
          <h1><i class="fas fa-file-medical me-2"></i><span class="lang-text" data-en="Facility Reports" data-mm="ဌာန အစီရင်ခံစာများ">Facility Reports</span></h1>
        </div>
        <div class="col-md-5">
          <div class="header-actions">
            <div class="language-switcher" role="group" aria-label="Language">
              <button type="button" class="btn btn-sm language-btn" data-lang="en" aria-label="English">ENG</button>
              <button type="button" class="btn btn-sm language-btn active" data-lang="mm" aria-label="Myanmar">MM</button>
            </div>
            <a href="quality-facility-visit.html" class="btn btn-outline-light btn-sm" aria-label="Back">
              <i class="fas fa-arrow-left me-2"></i><span class="lang-text" data-en="Back" data-mm="ပြန်သွားရန်">Back</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <main class="page-main container">
    <p class="demo-note lang-text" data-en="Sample reports from TMO / supervisor in-person visits. Read-only demo for midwives." data-mm="TMO / ကြီးကြပ်သူ ကိုယ်တိုင် လာရောက်စစ်ဆေးမှု နမူနာ အစီရင်ခံစာများ။ သားဖွားအတွက် ဖတ်ရှုရန်သာ။">Sample reports from TMO / supervisor in-person visits. Read-only demo for midwives.</p>
    <div id="reportList"></div>
  </main>

  <script>
    let currentLanguage = localStorage.getItem('appLanguage') || localStorage.getItem('language') || 'mm';
    const reports = [
      {
        dateEn: '20 Aug 2026',
        dateMm: '၂၀ သြဂုတ် ၂၀၂၆',
        author: 'Daw Thin Thin (TMO)',
        titleEn: 'Supportive supervision — labour room and ENC corner',
        titleMm: 'ထောက်ပံ့ကြီးကြပ်မှု — မွေးခန်းနှင့် ENC ထောင့်',
        findingsEn: 'Clean delivery area organized. TEO stock low (3 tubes). Skin-to-skin practice observed inconsistently after night births.',
        findingsMm: 'မွေးခန်း သန့်ရှင်းစွာ စီစဉ်ထားသည်။ TEO စတော့ နည်း (၃ လုံး)။ ညအချိန် မွေးဖွားမှုများတွင် အသားချင်းထိကပ်မှု မညီညွတ်။',
        recommendationsEn: 'Reorder TEO this week. Place “no unnecessary separation” reminder on delivery wall. Coach night-shift staff on drying and delayed cord clamping.',
        recommendationsMm: 'ဤအပတ် TEO ပြန်မှာယူပါ။ မွေးခန်းနံရံတွင် “မလိုအပ်ဘဲ မခွဲထားရန်” သတိပေးချက် ထားပါ။ ညဆိုင်း ဝန်ထမ်းများကို သုတ်ခြောက်ခြင်းနှင့် delayed cord clamping လေ့ကျင့်ပေးပါ။'
      },
      {
        dateEn: '5 Aug 2026',
        dateMm: '၅ သြဂုတ် ၂၀၂၆',
        author: 'U Kyaw Min (Regional Officer)',
        titleEn: 'Township QI visit — documentation and follow-up',
        titleMm: 'မြို့နယ် QI လည်ပတ်မှု — မှတ်တမ်းနှင့် ပြန်ပြရက်',
        findingsEn: 'ANC and newborn registers complete. Follow-up appointment cards missing for 2 of 5 recent discharges.',
        findingsMm: 'ANC နှင့် မွေးကင်းစ မှတ်ပုံတင် ပြည့်စုံသည်။ မကြာသေးမီ ဆင်းခဲ့သော ၅ ဦးအနက် ၂ ဦးတွင် ပြန်ပြရက်ကတ် မရှိ။',
        recommendationsEn: 'Keep pre-printed follow-up cards at discharge desk. Review exclusive breastfeeding counselling during next staff meeting.',
        recommendationsMm: 'ဆင်းခွင့်စားပွဲတွင် ကြိုတင်ပုံနှိပ် ပြန်ပြရက်ကတ်များ ထားပါ။ နောက်ဝန်ထမ်းအစည်းအဝေးတွင် မိခင်နို့ တစ်မျိုးတည်း အကြံပေးမှု ပြန်သုံးသပ်ပါ။'
      }
    ];

    function applyLanguage(lang) {
      currentLanguage = lang;
      localStorage.setItem('appLanguage', lang);
      document.querySelectorAll('.language-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      document.querySelectorAll('.lang-text').forEach(function (el) {
        var text = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-mm');
        if (text) el.textContent = text;
      });
      renderReports();
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderReports() {
      document.getElementById('reportList').innerHTML = reports.map(function (report) {
        return '<article class="report-card">' +
          '<h2>' + escapeHtml(currentLanguage === 'en' ? report.titleEn : report.titleMm) + '</h2>' +
          '<p class="report-meta">' + escapeHtml(currentLanguage === 'en' ? report.dateEn : report.dateMm) +
          ' · ' + escapeHtml(report.author) + '</p>' +
          '<p class="report-label">' + (currentLanguage === 'en' ? 'Findings' : 'တွေ့ရှိချက်များ') + '</p>' +
          '<p class="report-body">' + escapeHtml(currentLanguage === 'en' ? report.findingsEn : report.findingsMm) + '</p>' +
          '<p class="report-label">' + (currentLanguage === 'en' ? 'Recommendations' : 'အကြံပြုချက်များ') + '</p>' +
          '<p class="report-body">' + escapeHtml(currentLanguage === 'en' ? report.recommendationsEn : report.recommendationsMm) + '</p>' +
          '</article>';
      }).join('');
    }

    document.querySelectorAll('.language-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { applyLanguage(btn.dataset.lang); });
    });
    applyLanguage(currentLanguage);
  </script>
</body>
</html>
