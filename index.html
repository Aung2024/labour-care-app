<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#10b981">
  <title>MNCH App</title>
  <style>
    /* Minimal loading screen - no content visible */
    body {
      margin: 0;
      padding: 0;
      background: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .loader {
      color: white;
      font-size: 18px;
      opacity: 0;
      animation: fadeIn 0.3s ease-in 0.5s forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
  <script src="js/register-sw.js"></script>
  <script>
    /**
     * Lightweight entry router.
     * Firebase Auth restores on the destination page and never blocks first paint here.
     */
    (function () {
      var destination = 'login.html';
      try {
        var rememberMe = localStorage.getItem('rememberMe') === 'true';
        var uid = localStorage.getItem('uid');
        var rawExpiry = localStorage.getItem('sessionExpiry');
        var sessionExpiry = rawExpiry ? Date.parse(rawExpiry) : 0;
        var sessionValid = !rawExpiry ||
          (Number.isFinite(sessionExpiry) && sessionExpiry > Date.now());

        if (rememberMe && uid && sessionValid) {
          destination = 'home.html';
        }
      } catch (error) {
        destination = 'login.html';
      }

      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <div class="loader">Loading...</div>
</body>
</html>
