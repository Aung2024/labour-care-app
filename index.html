<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#10b981">
  <title>Loading...</title>
  <style>
    /* Minimal loading screen - no content visible */
    body {
      margin: 0;
      padding: 0;
      background: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .loader {
      color: white;
      font-size: 18px;
      opacity: 0;
      animation: fadeIn 0.3s ease-in 0.5s forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
  <!-- Load Firebase -->
  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/role-landing.js"></script>
  
  <script>
    /**
     * INDEX.HTML - App Router
     * This is the entry point for the app. It acts as a router:
     * - If user is authenticated → redirect to home.html (dashboard)
     * - If user is NOT authenticated → redirect to login.html
     * 
     * This is the industry standard pattern used by most apps.
     */
    
    (function() {
      let redirectExecuted = false;
      
      function redirectToLogin() {
        if (redirectExecuted) return;
        redirectExecuted = true;
        console.log('🔒 No authenticated user - routing to login');
        window.location.replace('login.html');
      }
      
      function redirectToHome() {
        if (redirectExecuted) return;
        redirectExecuted = true;
        var user = firebase.auth && firebase.auth().currentUser;
        var cached = (window.RoleLanding && RoleLanding.cachedLandingPage()) || 'home.html';
        if (window.RoleLanding && user && RoleLanding.resolveLandingPage) {
          RoleLanding.resolveLandingPage(user).then(function (target) {
            window.location.replace(target || cached);
          }).catch(function () {
            window.location.replace(cached);
          });
          return;
        }
        console.log('✅ User authenticated - routing to', cached);
        window.location.replace(cached);
      }
      
      // Wait for Firebase to load with timeout
      function checkAuthAndRoute() {
        if (typeof firebase === 'undefined' || !firebase.auth) {
          // Retry (max 2 seconds for Firebase to load)
          if (!checkAuthAndRoute.retryCount) checkAuthAndRoute.retryCount = 0;
          if (checkAuthAndRoute.retryCount < 20) {
            checkAuthAndRoute.retryCount++;
            setTimeout(checkAuthAndRoute, 100);
          } else {
            // Firebase failed to load after 2 seconds - default to login
            console.warn('⚠️ Firebase failed to load quickly - routing to login (network may be slow)');
            redirectToLogin();
          }
          return;
        }
        
        // Check current user (synchronous - fastest)
        const currentUser = firebase.auth().currentUser;
        if (currentUser) {
          redirectToHome();
          return;
        }
        
        var rememberedUid = '';
        try { rememberedUid = localStorage.getItem('uid') || ''; } catch (e) {}

        function finishAuthRouting(user) {
          if (redirectExecuted) return;
          if (user) {
            redirectToHome();
          } else {
            redirectToLogin();
          }
        }

        function waitForAuthRestoreThenRoute() {
          var maxWaitMs = rememberedUid ? 3500 : 3500;
          var started = Date.now();
          function poll() {
            if (redirectExecuted) return;
            var user = firebase.auth().currentUser;
            if (user) {
              finishAuthRouting(user);
              return;
            }
            if (Date.now() - started >= maxWaitMs) {
              finishAuthRouting(null);
              return;
            }
            setTimeout(poll, 150);
          }
          poll();
        }

        // Set up auth state listener with timeout
        let listenerTimeout;
        let listenerFired = false;
        
        const unsubscribe = firebase.auth().onAuthStateChanged(function(user) {
          if (listenerFired) return; // Prevent multiple calls
          listenerFired = true;
          
          clearTimeout(listenerTimeout);
          unsubscribe(); // Unsubscribe immediately after first check
          
          if (user) {
            redirectToHome();
          } else if (rememberedUid) {
            waitForAuthRestoreThenRoute();
          } else {
            redirectToLogin();
          }
        });
        
        // Timeout: If listener doesn't fire in time, poll for session restore when remembered
        listenerTimeout = setTimeout(function() {
          if (!listenerFired && !redirectExecuted) {
            console.warn('⚠️ Auth state check timeout - checking directly');
            unsubscribe(); // Clean up listener
            listenerFired = true;
            
            try {
              const user = firebase.auth().currentUser;
              if (user) {
                redirectToHome();
              } else if (rememberedUid) {
                waitForAuthRestoreThenRoute();
              } else {
                redirectToLogin();
              }
            } catch (error) {
              console.error('❌ Error checking auth:', error);
              redirectToLogin();
            }
          }
        }, 3500);
      }
      
      // Start routing immediately
      checkAuthAndRoute();
    })();
  </script>
</head>
<body>
  <div class="loader">Loading...</div>
</body>
</html>
