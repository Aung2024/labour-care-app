<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Transfer Requests</title>
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="css/vendor/fontawesome-all.min.css" />
  <link rel="stylesheet" href="css/hrt-register.css" />
  <style>
    body { font-family: 'Pyidaungsu', 'Myanmar Text', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg,#667eea 0%, #764ba2 100%); min-height: 100vh; min-height: 100dvh; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 1rem; padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); }
    .head { background: linear-gradient(135deg,#10b981,#059669); color: #fff; border-radius: 16px; padding: 1rem; box-shadow: 0 10px 24px rgba(0,0,0,.2); }
    .tabs { margin-top: 1rem; display: flex; gap: .5rem; flex-wrap: wrap; }
    .tabb { border: none; border-radius: 999px; padding: .55rem 1rem; font-weight: 700; min-height: 44px; touch-action: manipulation; background: rgba(255,255,255,0.92); color: #065f46; }
    .tabb.active { background: #10b981; color: #fff; box-shadow: 0 4px 12px rgba(16,185,129,0.35); }
    .language-switcher {
      display: inline-flex;
      gap: 0.25rem;
      padding: 0.18rem;
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 12px;
      background: rgba(255,255,255,0.12);
    }
    .language-btn {
      min-height: 44px;
      border: 0;
      border-radius: 10px;
      padding: 0.45rem 0.65rem;
      background: transparent;
      color: rgba(255,255,255,0.84);
      font-weight: 900;
      touch-action: manipulation;
    }
    .language-btn.active { background: rgba(255,255,255,0.94); color: #047857; }
    .hrt-register-panel { margin-top: 1rem; }
    .transfer-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border-radius: 999px;
      padding: 0.2rem 0.55rem;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: capitalize;
      white-space: nowrap;
    }
    .transfer-status-pill.pending { background: #fef3c7; color: #92400e; }
    .transfer-status-pill.accepted { background: #d1fae5; color: #065f46; }
    .transfer-status-pill.rejected { background: #fee2e2; color: #991b1b; }
    .transfer-actions { display: flex; gap: 0.35rem; flex-wrap: wrap; justify-content: flex-end; }
    .transfer-actions .btn { min-height: 40px; font-weight: 700; touch-action: manipulation; }
    .transfer-note { color: #64748b; font-size: 0.78rem; line-height: 1.35; max-width: 220px; overflow-wrap: anywhere; }
    .transfer-date { color: #64748b; font-size: 0.78rem; white-space: nowrap; }
    .hrt-register-table .col-patient { min-width: 140px; }
    .hrt-register-table .col-from, .hrt-register-table .col-to { min-width: 120px; }
    .hrt-register-table .col-status { min-width: 90px; }
    .hrt-register-table .col-date { min-width: 110px; }
    .hrt-register-table .col-note { min-width: 120px; }
    .hrt-register-table .col-action { min-width: 120px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head d-flex justify-content-between align-items-center gap-2 flex-wrap">
      <div>
        <div class="fw-bold" style="font-size:1.1rem;"><i class="fas fa-share-square me-2"></i><span class="lang-text" data-en="Transfer Requests" data-mm="လွှဲပြောင်းတောင်းဆိုချက်များ">Transfer Requests</span></div>
        <div style="opacity:.9;font-size:.9rem;" class="lang-text" data-en="Accept requests to receive patients into your care" data-mm="လူနာများကို လက်ခံရန် ဝင်လာသော တောင်းဆိုချက်များ">Accept requests to receive patients into your care</div>
      </div>
      <div class="d-flex gap-2 flex-wrap align-items-center">
        <div class="language-switcher" role="group" aria-label="Language">
          <button type="button" class="language-btn" data-lang="en">ENG</button>
          <button type="button" class="language-btn" data-lang="mm">MM</button>
        </div>
        <a href="transfer-patient.html" class="btn btn-light btn-sm" style="min-height:44px;"><i class="fas fa-plus me-1"></i><span class="lang-text" data-en="New Transfer" data-mm="လွှဲပြောင်းမှု အသစ်">New Transfer</span></a>
        <a href="patient-transfers.html" class="btn btn-outline-light btn-sm" style="min-height:44px;"><i class="fas fa-arrow-left me-1"></i><span class="lang-text" data-en="Back" data-mm="ပြန်သွားရန်">Back</span></a>
      </div>
    </div>

    <div class="tabs">
      <button id="tabIncoming" type="button" class="tabb active" onclick="switchTab('incoming')"><span class="lang-text" data-en="Incoming" data-mm="ဝင်လာ">Incoming</span></button>
      <button id="tabSent" type="button" class="tabb" onclick="switchTab('sent')"><span class="lang-text" data-en="Sent" data-mm="ပို့ထား">Sent</span></button>
    </div>

    <div class="hrt-register-panel">
      <div id="listWrap"></div>
    </div>
  </div>

  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/vendor/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/audit-logger.js"></script>
  <script src="js/ui-dialogs.js"></script>
  <script src="js/lang-apply.js"></script>
  <script>
    let currentUser = null;
    let activeTab = 'incoming';
    let currentRows = [];

    const MSG = {
      onlineOnly: {
        en: 'Patient transfers are available online only. Please reconnect to the internet and try again.',
        mm: 'လူနာလွှဲပြောင်းမှုကို အင်တာနက်ချိတ်ဆက်ထားမှသာ အသုံးပြုနိုင်ပါသည်။'
      },
      authWait: {
        en: 'Please wait for your online session to restore, then reopen Patient Transfers.',
        mm: 'Online session ပြန်မရသေးပါ။ ခဏစောင့်ပြီး Patient Transfers ကို ပြန်ဖွင့်ပါ။'
      },
      loading: { en: 'Loading...', mm: 'တင်နေသည်...' },
      empty: { en: 'No transfer requests.', mm: 'လွှဲပြောင်းတောင်းဆိုချက် မရှိပါ။' },
      loadFail: { en: 'Failed to load requests', mm: 'တောင်းဆိုချက်များ မတင်နိုင်ပါ' },
      unknownPatient: { en: 'Unknown patient', mm: 'လူနာ မသိ' },
      accept: { en: 'Accept', mm: 'လက်ခံ' },
      reject: { en: 'Reject', mm: 'ငြင်းပယ်' },
      patientCol: { en: 'Patient', mm: 'လူနာ' },
      fromCol: { en: 'From', mm: 'ပို့သူ' },
      toCol: { en: 'To', mm: 'လက်ခံသူ' },
      statusCol: { en: 'Status', mm: 'အခြေအနေ' },
      dateCol: { en: 'Date', mm: 'ရက်စွဲ' },
      noteCol: { en: 'Note', mm: 'မှတ်ချက်' },
      actionCol: { en: 'Action', mm: 'လုပ်ဆောင်ချက်' },
      transferComplete: {
        en: 'Patient transferred successfully. They will now appear in your patient list and dashboard. The sending midwife no longer has this patient in their list.',
        mm: 'လူနာ လွှဲပြောင်းမှု အောင်မြင်ပါသည်။ သင့်လူနာစာရင်းနှင့် dashboard တွင် ပေါ်လာမည်။'
      },
      transferCompleteTitle: { en: 'Transfer complete', mm: 'လွှဲပြောင်းမှု ပြီးပါပြီ' },
      errorTitle: { en: 'Error', mm: 'အမှား' },
      patientTransfers: { en: 'Patient Transfers', mm: 'လူနာ လွှဲပြောင်းမှုများ' }
    };

    function t(key) {
      const entry = MSG[key] || { en: key, mm: key };
      const lang = localStorage.getItem('appLanguage') || 'mm';
      return entry[lang] || entry.en || key;
    }

    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      alert(t('onlineOnly'));
      window.location.href = 'home.html';
    }

    window.onAppLanguageChange = function () {
      if (currentRows.length) renderRows(currentRows);
    };

    async function requireOnlineFirebaseUser(user) {
      if (user && !user.isPilotCachedUser) return user;
      const started = Date.now();
      while (Date.now() - started < 5000) {
        const restored = firebase.auth().currentUser;
        if (restored) return restored;
        await new Promise((resolve) => setTimeout(resolve, 150));
      }
      throw new Error(t('authWait'));
    }

    firebase.auth().onAuthStateChanged(async (user) => {
      user = window.resolvePilotAuthUser ? window.resolvePilotAuthUser(user) : user;
      if (!user) return;
      try {
        currentUser = await requireOnlineFirebaseUser(user);
        await loadRequests();
      } catch (error) {
        AppDialog.alert(error.message, { title: t('patientTransfers') });
      }
    });

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tabIncoming').classList.toggle('active', tab === 'incoming');
      document.getElementById('tabSent').classList.toggle('active', tab === 'sent');
      loadRequests();
    }

    function sortRequestsByDateDesc(rows) {
      return rows.sort((a, b) => {
        const ta = a.createdAt && typeof a.createdAt.toDate === 'function' ? a.createdAt.toDate().getTime() : 0;
        const tb = b.createdAt && typeof b.createdAt.toDate === 'function' ? b.createdAt.toDate().getTime() : 0;
        return tb - ta;
      });
    }

    async function loadRequests() {
      const wrap = document.getElementById('listWrap');
      wrap.innerHTML = '<div class="hrt-empty-state"><i class="fas fa-spinner fa-spin me-2"></i>' + escapeHtml(t('loading')) + '</div>';
      try {
        const db = firebase.firestore();
        let snap;
        if (activeTab === 'incoming') {
          snap = await db.collection('patient_transfer_requests')
            .where('targetMidwifeIds', 'array-contains', currentUser.uid)
            .limit(100)
            .get();
        } else {
          snap = await db.collection('patient_transfer_requests')
            .where('fromMidwifeId', '==', currentUser.uid)
            .limit(100)
            .get();
        }
        if (snap.empty) {
          wrap.innerHTML = '<div class="hrt-empty-state">' + escapeHtml(t('empty')) + '</div>';
          currentRows = [];
          return;
        }
        const rows = [];
        snap.forEach((d) => rows.push({ id: d.id, ...d.data() }));
        sortRequestsByDateDesc(rows);
        currentRows = rows.slice(0, 50);
        renderRows(currentRows);
      } catch (e) {
        console.error(e);
        const msg = String(e.message || e);
        const friendly = msg.includes('requires an index')
          ? (localStorage.getItem('appLanguage') === 'en'
            ? 'Transfer list could not load because Firestore indexes are still building. Please refresh in 1–2 minutes.'
            : 'Firestore index မပြည့်သေးပါ။ ၁–၂ မိနစ် 후 refresh လုပ်ပါ။')
          : msg;
        wrap.innerHTML = '<div class="hrt-empty-state text-danger">' + escapeHtml(t('loadFail')) + ': ' + escapeHtml(friendly) + '</div>';
      }
    }

    function formatCreatedAt(r) {
      if (!r.createdAt || typeof r.createdAt.toDate !== 'function') return '—';
      const d = r.createdAt.toDate();
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function statusPill(status) {
      const key = String(status || 'pending').toLowerCase();
      return '<span class="transfer-status-pill ' + escapeHtml(key) + '">' + escapeHtml(key) + '</span>';
    }

    function actionButtons(r) {
      const canAct = activeTab === 'incoming' && r.status === 'pending';
      if (!canAct) return '<span class="text-muted">—</span>';
      return '<div class="transfer-actions">' +
        '<button type="button" class="btn btn-success btn-sm" onclick="acceptReq(\'' + escapeHtml(r.id) + '\')">' + escapeHtml(t('accept')) + '</button>' +
        '<button type="button" class="btn btn-outline-danger btn-sm" onclick="rejectReq(\'' + escapeHtml(r.id) + '\')">' + escapeHtml(t('reject')) + '</button>' +
        '</div>';
    }

    function renderRows(rows) {
      const wrap = document.getElementById('listWrap');
      if (!rows.length) {
        wrap.innerHTML = '<div class="hrt-empty-state">' + escapeHtml(t('empty')) + '</div>';
        return;
      }

      wrap.innerHTML =
        '<div class="hrt-register-wrap">' +
          '<div class="hrt-register-desktop"><table class="hrt-register-table"><thead><tr>' +
            '<th class="col-patient">' + escapeHtml(t('patientCol')) + '</th>' +
            '<th class="col-from">' + escapeHtml(t('fromCol')) + '</th>' +
            '<th class="col-to">' + escapeHtml(t('toCol')) + '</th>' +
            '<th class="col-status">' + escapeHtml(t('statusCol')) + '</th>' +
            '<th class="col-date">' + escapeHtml(t('dateCol')) + '</th>' +
            '<th class="col-note">' + escapeHtml(t('noteCol')) + '</th>' +
            '<th class="col-action">' + escapeHtml(t('actionCol')) + '</th>' +
          '</tr></thead><tbody>' +
          rows.map(function (r) { return renderDesktopRow(r); }).join('') +
          '</tbody></table></div>' +
          '<div class="hrt-mobile-register">' +
          rows.map(function (r) { return renderMobileCard(r); }).join('') +
          '</div>' +
        '</div>';
    }

    function renderDesktopRow(r) {
      const toText = (r.recipients || []).map(function (x) { return x.name || x.uid; }).join(', ');
      const patientName = escapeHtml(r.patientName || t('unknownPatient'));
      const note = r.notes ? '<div class="transfer-note">' + escapeHtml(r.notes) + '</div>' : '<span class="text-muted">—</span>';
      return '<tr>' +
        '<td><div class="hrt-patient-main">' + patientName + '</div></td>' +
        '<td><div class="hrt-pregnancy-meta">' + escapeHtml(r.fromMidwifeName || r.fromMidwifeEmail || '—') + '</div></td>' +
        '<td><div class="hrt-pregnancy-meta">' + escapeHtml(toText || '—') + '</div></td>' +
        '<td>' + statusPill(r.status) + '</td>' +
        '<td><span class="transfer-date">' + escapeHtml(formatCreatedAt(r)) + '</span></td>' +
        '<td>' + note + '</td>' +
        '<td>' + actionButtons(r) + '</td>' +
        '</tr>';
    }

    function renderMobileCard(r) {
      const toText = (r.recipients || []).map(function (x) { return x.name || x.uid; }).join(', ');
      const patientName = escapeHtml(r.patientName || t('unknownPatient'));
      return '<div class="hrt-mobile-card">' +
        '<div class="hrt-mobile-top">' +
          '<div><div class="hrt-mobile-name">' + patientName + '</div>' +
          '<div class="hrt-mobile-id">' + escapeHtml(formatCreatedAt(r)) + '</div></div>' +
          statusPill(r.status) +
        '</div>' +
        '<div class="hrt-mobile-grid">' +
          '<div class="hrt-mobile-field"><span class="hrt-mobile-label">' + escapeHtml(t('fromCol')) + '</span><div class="hrt-mobile-value">' + escapeHtml(r.fromMidwifeName || r.fromMidwifeEmail || '—') + '</div></div>' +
          '<div class="hrt-mobile-field"><span class="hrt-mobile-label">' + escapeHtml(t('toCol')) + '</span><div class="hrt-mobile-value">' + escapeHtml(toText || '—') + '</div></div>' +
          (r.notes ? '<div class="hrt-mobile-field hrt-mobile-wide"><span class="hrt-mobile-label">' + escapeHtml(t('noteCol')) + '</span><div class="hrt-mobile-value">' + escapeHtml(r.notes) + '</div></div>' : '') +
          (activeTab === 'incoming' && r.status === 'pending'
            ? '<div class="hrt-mobile-field hrt-mobile-wide"><span class="hrt-mobile-label">' + escapeHtml(t('actionCol')) + '</span><div class="hrt-mobile-value">' + actionButtons(r) + '</div></div>'
            : '') +
        '</div></div>';
    }

    async function acceptReq(id) {
      try {
        await firebase.firestore().runTransaction(async (tx) => {
          const reqRef = firebase.firestore().collection('patient_transfer_requests').doc(id);
          const reqSnap = await tx.get(reqRef);
          if (!reqSnap.exists) throw new Error('Request not found');
          const req = reqSnap.data();
          if (req.status !== 'pending') throw new Error('Request already processed');
          const targets = req.targetMidwifeIds || [];
          if (!targets.includes(currentUser.uid)) {
            throw new Error('You are not authorized to accept this request');
          }

          const patientRef = firebase.firestore().collection('patients').doc(req.patientId);
          const patientSnap = await tx.get(patientRef);
          if (!patientSnap.exists) throw new Error('Patient not found');
          const patient = patientSnap.data();
          const previousOwnerId = patient.created_by || patient.createdBy || req.fromMidwifeId;

          tx.update(patientRef, {
            created_by: currentUser.uid,
            createdBy: currentUser.uid,
            care_team_midwife_ids: [currentUser.uid],
            transferred_from_midwife_id: previousOwnerId || null,
            transferred_at: firebase.firestore.FieldValue.serverTimestamp(),
            transferred_by_request_id: id
          });
          if (patient.patient_type !== 'baby' && Array.isArray(patient.baby_patient_ids)) {
            patient.baby_patient_ids.forEach(function (babyId) {
              if (!babyId) return;
              const babyRef = firebase.firestore().collection('patients').doc(babyId);
              tx.set(babyRef, {
                created_by: currentUser.uid,
                createdBy: currentUser.uid,
                care_team_midwife_ids: [currentUser.uid],
                transferred_with_mother_patient_id: req.patientId,
                transferred_from_midwife_id: previousOwnerId || null,
                transferred_at: firebase.firestore.FieldValue.serverTimestamp(),
                transferred_by_request_id: id
              }, { merge: true });
            });
          }
          tx.update(reqRef, {
            status: 'accepted',
            acceptedAt: firebase.firestore.FieldValue.serverTimestamp(),
            acceptedBy: firebase.firestore.FieldValue.arrayUnion(currentUser.uid),
            previousOwnerId: previousOwnerId || null
          });
        });
        if (window.AuditLogger && AuditLogger.logAuditEvent) {
          AuditLogger.logAuditEvent('transfer_request_accepted', 'transfer_request', id, {});
        }
        await AppDialog.alert(t('transferComplete'), { title: t('transferCompleteTitle') });
        loadRequests();
      } catch (e) {
        console.error(e);
        AppDialog.alert('Unable to accept: ' + e.message, { title: t('errorTitle') });
      }
    }

    async function rejectReq(id) {
      try {
        await firebase.firestore().collection('patient_transfer_requests').doc(id).update({
          status: 'rejected',
          rejectedAt: firebase.firestore.FieldValue.serverTimestamp(),
          rejectedBy: currentUser.uid
        });
        if (window.AuditLogger && AuditLogger.logAuditEvent) {
          AuditLogger.logAuditEvent('transfer_request_rejected', 'transfer_request', id, {});
        }
        loadRequests();
      } catch (e) {
        console.error(e);
        AppDialog.alert('Unable to reject: ' + e.message, { title: t('errorTitle') });
      }
    }

    function escapeHtml(v) {
      return String(v || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
