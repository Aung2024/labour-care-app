<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Periodic Readiness Assessment - Quality Improvement</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="css/vendor/fontawesome-all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/quality-improvement.css" />
  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/vendor/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/nav-back.js"></script>
  <style>
    :root { --primary-color: #0d9488; --secondary-color: #0f766e; --card-hover-shadow: 0 16px 32px rgba(15, 23, 42, 0.12); }
    body { font-family: 'Inter', 'Myanmar Text', 'Segoe UI', sans-serif; min-height: 100dvh; display: flex; flex-direction: column; }
    .header-section {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white; padding: 0.85rem 1rem; position: sticky; top: 0; z-index: 100;
    }
    .header-section .container, .hub-main-container { max-width: 760px; }
    .header-section h1 { font-size: 1.2rem; font-weight: 800; margin: 0; line-height: 1.25; }
    .header-actions { display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; flex-wrap: wrap; }
    .header-actions .btn, .language-btn { min-height: 44px; touch-action: manipulation; }
    .hub-main-container { flex: 1; width: 100%; padding: 1rem 1rem 2rem; }
    .care-modules { display: grid; grid-template-columns: 1fr; gap: 0.85rem; }
    .module-card {
      background: rgba(255, 255, 255, 0.97); border-radius: 16px; padding: 1rem 1.1rem;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08); cursor: pointer;
      border: 1px solid rgba(13, 148, 136, 0.15); border-left: 5px solid var(--primary-color);
      display: flex; align-items: center; gap: 1rem; min-height: 92px; touch-action: manipulation;
    }
    .module-card:hover { transform: translateY(-2px); box-shadow: var(--card-hover-shadow); }
    .module-icon {
      width: 48px; height: 48px; border-radius: 14px; background: #ccfbf1;
      display: inline-flex; align-items: center; justify-content: center;
      flex: 0 0 48px; font-size: 1.35rem; color: var(--primary-color);
    }
    .module-title { font-size: 1.05rem; font-weight: 800; color: #111827; margin-bottom: 0.2rem; }
    .module-description { color: #6b7280; font-size: 0.9rem; margin: 0; line-height: 1.45; }
    .module-content { flex: 1; min-width: 0; }
    .module-arrow { color: #94a3b8; }
    .language-switcher { display: flex; gap: 0.25rem; }
    .language-btn {
      min-width: 44px; padding: 0.375rem 0.75rem; border-radius: 8px;
      background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white;
    }
    .language-btn.active { background: rgba(255,255,255,0.4); font-weight: 600; }
  </style>
</head>
<body class="qi-app">
  <div class="header-section">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-7">
          <h1><i class="fas fa-clipboard-list me-2"></i><span class="lang-text" data-en="Periodic Readiness Assessment" data-mm="အချိန်အပိုင်းအခြားအလိုက် အဆင်သင့်ဖြစ်မှု စစ်ဆေးခြင်း">Periodic Readiness Assessment</span></h1>
        </div>
        <div class="col-md-5">
          <div class="header-actions">
            <div class="language-switcher" role="group" aria-label="Language">
              <button type="button" class="btn btn-sm language-btn" data-lang="en" aria-label="English">ENG</button>
              <button type="button" class="btn btn-sm language-btn active" data-lang="mm" aria-label="Myanmar">MM</button>
            </div>
            <a href="quality-improvement.html" class="btn btn-outline-light btn-sm" aria-label="Back">
              <i class="fas fa-arrow-left me-2"></i><span class="lang-text" data-en="Back" data-mm="ပြန်သွားရန်">Back</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <main class="container hub-main-container">
    <div class="care-modules">
      <div class="module-card" role="button" tabindex="0" aria-label="Antenatal" onclick="openChecklist('antenatal')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openChecklist('antenatal');}">
        <div class="module-icon"><i class="fas fa-person-pregnant"></i></div>
        <div class="module-content">
          <div class="module-title lang-text" data-en="Antenatal" data-mm="မီးယပ်မတိုင်မီ">Antenatal</div>
          <p class="module-description lang-text" data-en="ANC space, supplies, drugs, and documentation readiness." data-mm="ANC နေရာ၊ ပစ္စည်း၊ ဆေးနှင့် မှတ်တမ်း အဆင်သင့်ဖြစ်မှု။">ANC space, supplies, drugs, and documentation readiness.</p>
        </div>
        <i class="fas fa-chevron-right module-arrow" aria-hidden="true"></i>
      </div>
      <div class="module-card" role="button" tabindex="0" aria-label="Intrapartum" onclick="openChecklist('intrapartum')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openChecklist('intrapartum');}">
        <div class="module-icon"><i class="fas fa-heartbeat"></i></div>
        <div class="module-content">
          <div class="module-title lang-text" data-en="Intrapartum" data-mm="မီးဖွားချိန်">Intrapartum</div>
          <p class="module-description lang-text" data-en="Labour ward BEmONC readiness checklist." data-mm="မီးဖွားခန်း BEmONC အဆင်သင့်ဖြစ်မှု စစ်ဆေးစာရင်း။">Labour ward BEmONC readiness checklist.</p>
        </div>
        <i class="fas fa-chevron-right module-arrow" aria-hidden="true"></i>
      </div>
      <div class="module-card" role="button" tabindex="0" aria-label="Postnatal" onclick="openChecklist('postnatal')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openChecklist('postnatal');}">
        <div class="module-icon"><i class="fas fa-notes-medical"></i></div>
        <div class="module-content">
          <div class="module-title lang-text" data-en="Postnatal" data-mm="မီးတွင်း">Postnatal</div>
          <p class="module-description lang-text" data-en="Postnatal maternal care readiness checklist." data-mm="မီးတွင်း မိခင် စောင့်ရှောက်မှု အဆင်သင့်ဖြစ်မှု စစ်ဆေးစာရင်း။">Postnatal maternal care readiness checklist.</p>
        </div>
        <i class="fas fa-chevron-right module-arrow" aria-hidden="true"></i>
      </div>
      <div class="module-card" role="button" tabindex="0" aria-label="Newborn" onclick="openChecklist('newborn')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openChecklist('newborn');}">
        <div class="module-icon"><i class="fas fa-baby"></i></div>
        <div class="module-content">
          <div class="module-title lang-text" data-en="Newborn" data-mm="မွေးကင်းစ">Newborn</div>
          <p class="module-description lang-text" data-en="Essential newborn care readiness checklist." data-mm="မွေးကင်းစ အရေးကြီး စောင့်ရှောက်မှု အဆင်သင့်ဖြစ်မှု စစ်ဆေးစာရင်း။">Essential newborn care readiness checklist.</p>
        </div>
        <i class="fas fa-chevron-right module-arrow" aria-hidden="true"></i>
      </div>
    </div>
  </main>

  <script>
    let currentLanguage = localStorage.getItem('appLanguage') || localStorage.getItem('language') || 'mm';
    function applyLanguage(lang) {
      currentLanguage = lang;
      localStorage.setItem('appLanguage', lang);
      document.querySelectorAll('.language-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      document.querySelectorAll('.lang-text').forEach(function (el) {
        var text = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-mm');
        if (text) el.textContent = text;
      });
    }
    function openChecklist(domain) {
      window.location.href = 'quality-readiness-checklist.html?domain=' + encodeURIComponent(domain);
    }
    document.querySelectorAll('.language-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { applyLanguage(btn.dataset.lang); });
    });
    applyLanguage(currentLanguage);
  </script>
</body>
</html>
