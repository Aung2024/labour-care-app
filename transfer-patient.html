<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Transfer Patient</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { font-family: 'Pyidaungsu', 'Myanmar Text', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 1rem; }
    .head { background: linear-gradient(135deg,#10b981,#059669); color: #fff; border-radius: 16px; padding: 1rem; box-shadow: 0 10px 24px rgba(0,0,0,0.2); }
    .cardx { margin-top: 1rem; background: #fff; border-radius: 16px; padding: 1rem; box-shadow: 0 8px 20px rgba(0,0,0,0.12); }
    .label { font-weight: 600; margin-bottom: .35rem; color: #374151; }
    .midwives-box { max-height: 260px; overflow: auto; border: 1px solid #e5e7eb; border-radius: 12px; padding: .5rem; background: #f9fafb; }
    .mw-item { display: flex; align-items: center; gap: .6rem; padding: .45rem .4rem; border-bottom: 1px dashed #e5e7eb; }
    .mw-item:last-child { border-bottom: 0; }
    .footer-actions { position: sticky; bottom: 0; background: #fff; padding-top: .8rem; margin-top: .8rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head d-flex justify-content-between align-items-center gap-2 flex-wrap">
      <div>
        <div class="fw-bold" style="font-size:1.1rem;"><i class="fas fa-share-square me-2"></i>Transfer Patient</div>
        <div style="opacity:.9;font-size:.9rem;">Select patient, region, township, and receiving midwives</div>
      </div>
      <a href="home.html" class="btn btn-light btn-sm"><i class="fas fa-home me-1"></i>Home</a>
    </div>

    <div class="cardx">
      <div class="mb-3">
        <label class="label">Patient</label>
        <select id="patientSelect" class="form-select">
          <option value="">Select patient</option>
        </select>
      </div>

      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label class="label">Region</label>
          <select id="regionSelect" class="form-select">
            <option value="">All Regions</option>
          </select>
        </div>
        <div class="col-12 col-md-6">
          <label class="label">Township</label>
          <select id="townshipSelect" class="form-select">
            <option value="">All Townships</option>
          </select>
        </div>
      </div>

      <div class="mt-3">
        <div class="d-flex justify-content-between align-items-center">
          <label class="label mb-0">Midwives (multiple)</label>
          <button type="button" class="btn btn-outline-secondary btn-sm" onclick="toggleAllMidwives(true)">Select all shown</button>
        </div>
        <div id="midwivesBox" class="midwives-box"></div>
      </div>

      <div class="mt-3">
        <label class="label">Notes (optional)</label>
        <textarea id="notesInput" class="form-control" rows="3" placeholder="Reason for transfer"></textarea>
      </div>

      <div class="footer-actions d-flex gap-2">
        <a href="home.html" class="btn btn-outline-secondary flex-fill">Cancel</a>
        <button id="submitBtn" class="btn btn-success flex-fill" onclick="submitTransferRequest()">
          <i class="fas fa-paper-plane me-1"></i> Send Transfer Request
        </button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/audit-logger.js"></script>
  <script src="js/ui-dialogs.js"></script>
  <script>
    let currentUser = null;
    let currentUserData = null;
    let allPatients = [];
    let allMidwives = [];

    firebase.auth().onAuthStateChanged(async (user) => {
      if (!user) return;
      currentUser = user;
      await loadCurrentUser();
      await loadMyPatients();
      await loadMidwives();
    });

    async function loadCurrentUser() {
      const doc = await firebase.firestore().collection('users').doc(currentUser.uid).get();
      currentUserData = doc.exists ? doc.data() : {};
    }

    async function loadMyPatients() {
      const db = firebase.firestore();
      const map = new Map();
      const q1 = await db.collection('patients').where('created_by', '==', currentUser.uid).get().catch(() => null);
      const q2 = await db.collection('patients').where('createdBy', '==', currentUser.uid).get().catch(() => null);
      const q3 = await db.collection('patients').where('care_team_midwife_ids', 'array-contains', currentUser.uid).get().catch(() => null);
      [q1, q2, q3].forEach((snap) => {
        if (snap && !snap.empty) {
          snap.forEach((d) => map.set(d.id, { id: d.id, ...d.data() }));
        }
      });
      allPatients = Array.from(map.values()).sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
      const sel = document.getElementById('patientSelect');
      sel.innerHTML = '<option value="">Select patient</option>' + allPatients.map((p) =>
        `<option value="${p.id}">${escapeHtml(p.name || 'Unknown')} (${p.id})</option>`).join('');
    }

    async function loadMidwives() {
      const db = firebase.firestore();
      let users = [];
      try {
        const snap = await db.collection('users').where('role', 'in', ['Midwife', 'midwife']).get();
        snap.forEach((d) => users.push({ id: d.id, ...d.data() }));
      } catch (e) {
        const snap = await db.collection('users').get();
        snap.forEach((d) => {
          const u = d.data() || {};
          if (u.role === 'Midwife' || u.role === 'midwife') users.push({ id: d.id, ...u });
        });
      }
      allMidwives = users.filter((u) => u.id !== currentUser.uid);
      const regions = [...new Set(allMidwives.map((u) => String(u.region || '').trim()).filter(Boolean))].sort();
      const rSel = document.getElementById('regionSelect');
      rSel.innerHTML = '<option value="">All Regions</option>' + regions.map((r) => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('');
      rSel.onchange = () => {
        fillTownships();
        renderMidwives();
      };
      document.getElementById('townshipSelect').onchange = renderMidwives;
      fillTownships();
      renderMidwives();
    }

    function fillTownships() {
      const region = document.getElementById('regionSelect').value;
      const townships = [...new Set(allMidwives.filter((u) => !region || String(u.region || '') === region)
        .map((u) => String(u.township || '').trim()).filter(Boolean))].sort();
      const tSel = document.getElementById('townshipSelect');
      tSel.innerHTML = '<option value="">All Townships</option>' + townships.map((t) => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
    }

    function renderMidwives() {
      const region = document.getElementById('regionSelect').value;
      const township = document.getElementById('townshipSelect').value;
      const filtered = allMidwives.filter((u) =>
        (!region || String(u.region || '') === region) &&
        (!township || String(u.township || '') === township)
      );
      const box = document.getElementById('midwivesBox');
      if (filtered.length === 0) {
        box.innerHTML = '<div class="text-muted p-2">No midwives found for selected filters.</div>';
        return;
      }
      box.innerHTML = filtered.map((u) => `
        <label class="mw-item">
          <input class="form-check-input mw-check" type="checkbox" value="${u.id}">
          <div>
            <div class="fw-semibold">${escapeHtml(u.name || u.email || 'Midwife')}</div>
            <div class="text-muted" style="font-size:.8rem;">${escapeHtml(u.region || '-')}, ${escapeHtml(u.township || '-')}</div>
          </div>
        </label>
      `).join('');
    }

    function toggleAllMidwives(enabled) {
      document.querySelectorAll('.mw-check').forEach((el) => { el.checked = enabled; });
    }

    async function submitTransferRequest() {
      const patientId = document.getElementById('patientSelect').value;
      const notes = (document.getElementById('notesInput').value || '').trim();
      const region = document.getElementById('regionSelect').value || null;
      const township = document.getElementById('townshipSelect').value || null;
      const ids = Array.from(document.querySelectorAll('.mw-check:checked')).map((el) => el.value);
      if (!patientId) return AppDialog.alert('Please select a patient.', { title: 'Transfer Patient' });
      if (ids.length === 0) return AppDialog.alert('Please select at least one receiving midwife.', { title: 'Transfer Patient' });
      const patient = allPatients.find((p) => p.id === patientId) || {};
      const recipients = allMidwives.filter((u) => ids.includes(u.id)).map((u) => ({
        uid: u.id,
        name: u.name || u.email || 'Midwife',
        region: u.region || null,
        township: u.township || null
      }));
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Sending...';
      try {
        await firebase.firestore().collection('patient_transfer_requests').add({
          patientId,
          patientName: patient.name || null,
          fromMidwifeId: currentUser.uid,
          fromMidwifeName: currentUserData?.name || currentUser.email || 'Midwife',
          fromMidwifeEmail: currentUser.email || null,
          fromRegion: currentUserData?.region || null,
          fromTownship: currentUserData?.township || null,
          targetRegion: region,
          targetTownship: township,
          targetMidwifeIds: ids,
          recipients,
          notes: notes || null,
          status: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          acceptedBy: []
        });
        if (window.AuditLogger && AuditLogger.logAuditEvent) {
          AuditLogger.logAuditEvent('transfer_request_created', 'patient', patientId, { recipientCount: ids.length });
        }
        await AppDialog.alert('Transfer request sent. Receiving midwife can accept from Transfer Requests.', { title: 'Success' });
        window.location.href = 'transfer-requests.html';
      } catch (e) {
        console.error(e);
        AppDialog.alert('Unable to send transfer request: ' + e.message, { title: 'Error' });
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane me-1"></i> Send Transfer Request';
      }
    }

    function escapeHtml(v) {
      return String(v || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
