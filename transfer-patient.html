<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Transfer Patient</title>
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="css/vendor/fontawesome-all.min.css" />
  <style>
    body {
      font-family: 'Pyidaungsu', 'Myanmar Text', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      min-height: 100dvh;
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 1rem; padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); }
    .head {
      background: linear-gradient(135deg,#10b981,#059669);
      color: #fff;
      border-radius: 16px;
      padding: 1rem;
      box-shadow: 0 10px 24px rgba(0,0,0,.2);
    }
    .cardx {
      margin-top: 1rem;
      background: #fff;
      border-radius: 16px;
      padding: 1rem;
      box-shadow: 0 8px 20px rgba(0,0,0,.12);
    }
    .section-title { font-size: .95rem; font-weight: 700; color: #374151; margin-bottom: .45rem; }
    .section-heading {
      font-size: 1rem;
      font-weight: 700;
      color: #374151;
      margin: 0 0 .75rem;
      padding-bottom: .5rem;
      border-bottom: 2px solid #f59e0b;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .section-heading i { color: #f59e0b; }
    .hint { color: #6b7280; font-size: .82rem; }
    .required-mark::after { content: ' *'; color: #ef4444; font-weight: 700; }

    .picker-btn {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: #fff;
      min-height: 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: .65rem .85rem;
      text-align: left;
    }
    .picker-btn:disabled { opacity: .85; cursor: default; background: #f9fafb; }
    .picker-title { font-weight: 600; color: #111827; }
    .picker-sub { font-size: .8rem; color: #6b7280; }
    .picker-empty .picker-title { color: #6b7280; font-weight: 500; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 700;
      padding: .18rem .5rem;
      background: #f3f4f6;
      color: #374151;
      text-transform: capitalize;
    }

    .midwives-box {
      max-height: 300px;
      overflow: auto;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: .5rem;
      background: #f9fafb;
    }
    .mw-item {
      display: flex;
      align-items: center;
      gap: .65rem;
      padding: .55rem .5rem;
      border-bottom: 1px dashed #e5e7eb;
      border-radius: 10px;
      min-height: 44px;
    }
    .mw-item:last-child { border-bottom: 0; }
    .mw-item:hover { background: #eefcf7; }
    .form-select, .form-control { min-height: 44px; }
    .mw-item input[type="checkbox"] { width: 20px; height: 20px; }

    .referral-block {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: .85rem;
      margin-top: 1rem;
    }

    .sticky-actions {
      position: sticky;
      bottom: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.85) 0%, #fff 22%);
      padding-top: .75rem;
      margin-top: .8rem;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .modal-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: .55rem .65rem;
      margin-bottom: .5rem;
      background: #fff;
      cursor: pointer;
      min-height: 44px;
    }
    .modal-card:hover { border-color: #10b981; background: #f0fdf4; }
    .modal-meta { color: #6b7280; font-size: .8rem; }

    @media (max-width: 576px) {
      .wrap { padding: .75rem; }
      .cardx { padding: .85rem; border-radius: 14px; }
      .head { border-radius: 14px; }
      .sticky-actions .btn { min-height: 46px; }
      .picker-btn { min-height: 56px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head d-flex justify-content-between align-items-center gap-2 flex-wrap">
      <div>
        <div class="fw-bold" style="font-size:1.1rem;"><i class="fas fa-share-square me-2"></i><span id="pageTitle">Transfer Patient</span></div>
        <div id="pageSubtitle" style="opacity:.92;font-size:.9rem;">Referral details and transfer to another midwife</div>
      </div>
      <a href="patient-transfers.html" id="backLink" class="btn btn-light btn-sm"><i class="fas fa-arrow-left me-1"></i>Back</a>
    </div>

    <div class="cardx">
      <div class="mb-3">
        <div class="section-title">Patient</div>
        <button id="patientPickerBtn" type="button" class="picker-btn picker-empty" onclick="openPatientModal()">
          <div>
            <div id="patientPickerTitle" class="picker-title">Search and select patient</div>
            <div id="patientPickerSub" class="picker-sub">Tap to open patient finder</div>
          </div>
          <i class="fas fa-search text-muted"></i>
        </button>
      </div>

      <div class="referral-block">
        <div class="section-heading"><i class="fas fa-hospital"></i> Referral details</div>
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="section-title required-mark" for="referralTime">Referral time</label>
            <input type="datetime-local" id="referralTime" class="form-control" required />
          </div>
          <div class="col-12 col-md-6">
            <label class="section-title" for="referralMode">Referral mode</label>
            <select id="referralMode" class="form-select">
              <option value="">Select referral mode</option>
              <option value="Ambulance">Ambulance</option>
              <option value="Private Vehicle">Private Vehicle</option>
              <option value="Public Transport">Public Transport</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="col-12">
            <label class="section-title" for="referralFacility">Referral facility</label>
            <input type="text" id="referralFacility" class="form-control" placeholder="Enter facility name" />
          </div>
          <div class="col-12">
            <label class="section-title" for="mainSymptoms">Main symptoms and duration</label>
            <textarea id="mainSymptoms" class="form-control" rows="3" placeholder="Describe main symptoms, duration, and obstetric history if applicable"></textarea>
          </div>
          <div class="col-12 col-md-6">
            <label class="section-title" for="treatmentBeforeReferral">Treatment before referral</label>
            <textarea id="treatmentBeforeReferral" class="form-control" rows="2"></textarea>
          </div>
          <div class="col-12 col-md-6">
            <label class="section-title" for="medications">Medications</label>
            <textarea id="medications" class="form-control" rows="2"></textarea>
          </div>
          <div class="col-12 col-md-6">
            <label class="section-title" for="patientGeneralCondition">Patient's general condition</label>
            <select id="patientGeneralCondition" class="form-select">
              <option value="">Select condition</option>
              <option value="Good">Good</option>
              <option value="Fair">Fair</option>
              <option value="Poor">Poor</option>
              <option value="Serious">Serious</option>
            </select>
          </div>
          <div class="col-12 col-md-6">
            <label class="section-title" for="vitalSigns">Vital signs (BP, pulse, temperature)</label>
            <input type="text" id="vitalSigns" class="form-control" placeholder="e.g., BP: 120/80, Pulse: 72, Temp: 37.5°C" />
          </div>
          <div class="col-12 col-md-6">
            <label class="section-title" for="initial">Initial / signature</label>
            <input type="text" id="initial" class="form-control" placeholder="Signature / initials" />
          </div>
        </div>
      </div>

      <div class="section-heading mt-4 mb-2"><i class="fas fa-user-nurse"></i> Transfer to midwife</div>

      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label class="section-title" for="regionSelect">Region</label>
          <select id="regionSelect" class="form-select">
            <option value="">All Regions</option>
          </select>
        </div>
        <div class="col-12 col-md-6">
          <label class="section-title" for="townshipSelect">Township</label>
          <select id="townshipSelect" class="form-select">
            <option value="">All Townships</option>
          </select>
        </div>
      </div>

      <div class="mt-3">
        <div class="d-flex justify-content-between align-items-center mb-1 flex-wrap gap-2">
          <div class="section-title mb-0">Receiving midwives</div>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="toggleAllMidwives(true)">Select all shown</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="toggleAllMidwives(false)">Clear</button>
          </div>
        </div>
        <div class="hint mb-2">Filter by region/township first to reduce scrolling.</div>
        <div id="midwivesBox" class="midwives-box"></div>
      </div>

      <div class="mt-3">
        <label class="section-title" for="notesInput">Transfer notes (optional)</label>
        <textarea id="notesInput" class="form-control" rows="2" placeholder="Additional notes for receiving midwife"></textarea>
      </div>

      <div class="sticky-actions d-flex gap-2">
        <button type="button" class="btn btn-outline-secondary flex-fill" onclick="cancelTransfer()">Cancel</button>
        <button id="submitBtn" class="btn btn-success flex-fill" onclick="submitTransferRequest()" disabled>
          <i class="fas fa-paper-plane me-1"></i> Send transfer request
        </button>
      </div>
    </div>
  </div>

  <div class="modal fade" id="patientPickerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fas fa-user-injured me-2"></i>Select Patient</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fas fa-search"></i></span>
            <input id="patientSearchInput" type="text" class="form-control" placeholder="Search by name or patient ID" oninput="renderPatientList()" />
          </div>
          <div id="patientModalList"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/vendor/bootstrap.bundle.min.js"></script>
  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/vendor/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/status-manager.js"></script>
  <script src="js/audit-logger.js"></script>
  <script src="js/ui-dialogs.js"></script>
  <script>
    let currentUser = null;
    let currentUserData = null;
    let allPatients = [];
    let allMidwives = [];
    let selectedPatientId = null;
    let patientModal = null;
    let referFlow = false;
    let transferType = 'anc';

    const urlParams = new URLSearchParams(window.location.search);
    const urlPatientId = urlParams.get('patient');
    transferType = urlParams.get('type') || 'anc';
    referFlow = !!urlPatientId;

    if (typeof navigator !== 'undefined' && navigator.onLine === false) {
      alert('Patient transfers are available online only. Please reconnect to the internet and try again.');
      window.location.href = 'home.html';
    }

    function setDefaultReferralTime() {
      const now = new Date();
      const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
      const el = document.getElementById('referralTime');
      if (el && !el.value) el.value = localDateTime.toISOString().slice(0, 16);
    }

    function applyReferFlowUi() {
      if (!referFlow) return;
      document.getElementById('pageTitle').textContent = 'Refer & Transfer Patient';
      document.getElementById('pageSubtitle').textContent = 'Complete referral record and send to another midwife';
      const back = document.getElementById('backLink');
      if (back) {
        back.href = 'javascript:history.back()';
        back.innerHTML = '<i class="fas fa-arrow-left me-1"></i>Back';
      }
    }

    async function requireOnlineFirebaseUser(user) {
      if (user && !user.isPilotCachedUser) return user;
      const started = Date.now();
      while (Date.now() - started < 5000) {
        const restored = firebase.auth().currentUser;
        if (restored) return restored;
        await new Promise((resolve) => setTimeout(resolve, 150));
      }
      throw new Error('Please wait for your online session to restore, then reopen Patient Transfers.');
    }

    firebase.auth().onAuthStateChanged(async (user) => {
      user = window.resolvePilotAuthUser ? window.resolvePilotAuthUser(user) : user;
      if (!user) return;
      try {
        currentUser = await requireOnlineFirebaseUser(user);
        patientModal = new bootstrap.Modal(document.getElementById('patientPickerModal'));
        setDefaultReferralTime();
        applyReferFlowUi();
        await loadCurrentUser();
        await loadMyPatients();
        if (urlPatientId) {
          await preselectPatientFromUrl(urlPatientId);
        }
        await loadMidwives();
        refreshSubmitState();
      } catch (error) {
        AppDialog.alert(error.message, { title: 'Patient Transfers' });
      }
    });

    async function loadCurrentUser() {
      const doc = await firebase.firestore().collection('users').doc(currentUser.uid).get();
      currentUserData = doc.exists ? doc.data() : {};
    }

    async function preselectPatientFromUrl(patientId) {
      let p = allPatients.find((x) => x.id === patientId);
      if (!p) {
        const snap = await firebase.firestore().collection('patients').doc(patientId).get();
        if (snap.exists) {
          p = { id: snap.id, ...snap.data() };
          allPatients.unshift(p);
        }
      }
      if (p) {
        choosePatient(p.id, true);
        const btn = document.getElementById('patientPickerBtn');
        btn.disabled = true;
        btn.onclick = null;
      } else {
        AppDialog.alert('Patient not found.', { title: 'Transfer Patient' });
      }
    }

    async function loadMyPatients() {
      const db = firebase.firestore();
      const map = new Map();
      const q1 = await db.collection('patients').where('created_by', '==', currentUser.uid).get().catch(() => null);
      const q2 = await db.collection('patients').where('createdBy', '==', currentUser.uid).get().catch(() => null);
      const q3 = await db.collection('patients').where('care_team_midwife_ids', 'array-contains', currentUser.uid).get().catch(() => null);
      [q1, q2, q3].forEach((snap) => {
        if (snap && !snap.empty) snap.forEach((d) => map.set(d.id, { id: d.id, ...d.data() }));
      });
      allPatients = Array.from(map.values()).sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
      renderPatientList();
    }

    function openPatientModal() {
      if (referFlow) return;
      renderPatientList();
      patientModal.show();
      setTimeout(() => {
        const input = document.getElementById('patientSearchInput');
        if (input) input.focus();
      }, 120);
    }

    function getPatientStatusLabel(patient) {
      let status = String(patient.status || 'registered').toLowerCase();
      if (status === 'antenatal_care') status = 'antenatal';
      if (status === 'labour_care') status = 'labour';
      if (status === 'postnatal_care' || status === 'postpartum') status = 'postnatal';
      return status;
    }

    function renderPatientList() {
      const list = document.getElementById('patientModalList');
      if (!list) return;
      const q = String(document.getElementById('patientSearchInput')?.value || '').toLowerCase().trim();
      const recentIds = JSON.parse(localStorage.getItem('recentPatients') || '[]');
      const recentSet = new Set(recentIds);
      const filtered = allPatients.filter((p) => {
        if (!q) return true;
        return String(p.name || '').toLowerCase().includes(q) || String(p.id || '').toLowerCase().includes(q);
      }).sort((a, b) => {
        const aRecent = recentSet.has(a.id) ? 0 : 1;
        const bRecent = recentSet.has(b.id) ? 0 : 1;
        if (aRecent !== bRecent) return aRecent - bRecent;
        return String(a.name || '').localeCompare(String(b.name || ''));
      });

      if (!filtered.length) {
        list.innerHTML = '<div class="text-muted p-2">No patients found.</div>';
        return;
      }

      list.innerHTML = filtered.map((p) => {
        const isRecent = recentSet.has(p.id);
        const status = getPatientStatusLabel(p);
        return `
          <div class="modal-card" onclick="choosePatient('${escapeHtml(p.id)}')">
            <div class="d-flex justify-content-between align-items-start gap-2">
              <div>
                <div class="fw-semibold">${escapeHtml(p.name || 'Unknown')}</div>
                <div class="modal-meta">${escapeHtml(p.id || '-')}</div>
              </div>
              <div class="d-flex flex-column align-items-end gap-1">
                <span class="status-pill">${escapeHtml(status)}</span>
                ${isRecent ? '<span class="modal-meta">Recent</span>' : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function choosePatient(id, skipModalHide) {
      selectedPatientId = id;
      const p = allPatients.find((x) => x.id === id) || {};
      const btn = document.getElementById('patientPickerBtn');
      btn.classList.remove('picker-empty');
      document.getElementById('patientPickerTitle').textContent = p.name || 'Selected patient';
      document.getElementById('patientPickerSub').textContent = p.id || '';
      if (!skipModalHide && patientModal) patientModal.hide();
      refreshSubmitState();
    }

    async function loadMidwives() {
      const db = firebase.firestore();
      let users = [];
      try {
        const snap = await db.collection('users').where('role', 'in', ['Midwife', 'midwife']).get();
        snap.forEach((d) => users.push({ id: d.id, ...d.data() }));
      } catch (e) {
        const snap = await db.collection('users').get();
        snap.forEach((d) => {
          const u = d.data() || {};
          if (u.role === 'Midwife' || u.role === 'midwife') users.push({ id: d.id, ...u });
        });
      }
      allMidwives = users.filter((u) => u.id !== currentUser.uid);
      const regions = [...new Set(allMidwives.map((u) => String(u.region || '').trim()).filter(Boolean))].sort();
      const rSel = document.getElementById('regionSelect');
      rSel.innerHTML = '<option value="">All Regions</option>' + regions.map((r) => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('');
      rSel.onchange = () => { fillTownships(); renderMidwives(); };
      document.getElementById('townshipSelect').onchange = renderMidwives;
      fillTownships();
      renderMidwives();
    }

    function fillTownships() {
      const region = document.getElementById('regionSelect').value;
      const townships = [...new Set(allMidwives
        .filter((u) => !region || String(u.region || '') === region)
        .map((u) => String(u.township || '').trim()).filter(Boolean))].sort();
      const tSel = document.getElementById('townshipSelect');
      tSel.innerHTML = '<option value="">All Townships</option>' + townships.map((t) => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
    }

    function renderMidwives() {
      const region = document.getElementById('regionSelect').value;
      const township = document.getElementById('townshipSelect').value;
      const filtered = allMidwives.filter((u) =>
        (!region || String(u.region || '') === region) &&
        (!township || String(u.township || '') === township)
      );
      const box = document.getElementById('midwivesBox');
      if (!filtered.length) {
        box.innerHTML = '<div class="text-muted p-2">No midwives found for selected filters.</div>';
        refreshSubmitState();
        return;
      }
      box.innerHTML = filtered.map((u) => `
        <label class="mw-item">
          <input class="form-check-input mw-check" type="checkbox" value="${u.id}" onchange="refreshSubmitState()">
          <div>
            <div class="fw-semibold">${escapeHtml(u.name || u.email || 'Midwife')}</div>
            <div class="text-muted" style="font-size:.8rem;">${escapeHtml(u.region || '-')}, ${escapeHtml(u.township || '-')}</div>
          </div>
        </label>
      `).join('');
      refreshSubmitState();
    }

    function toggleAllMidwives(enabled) {
      document.querySelectorAll('.mw-check').forEach((el) => { el.checked = enabled; });
      refreshSubmitState();
    }

    function refreshSubmitState() {
      const ids = Array.from(document.querySelectorAll('.mw-check:checked')).map((el) => el.value);
      const referralTime = (document.getElementById('referralTime').value || '').trim();
      const btn = document.getElementById('submitBtn');
      btn.disabled = !(selectedPatientId && ids.length > 0 && referralTime);
    }

    document.getElementById('referralTime').addEventListener('input', refreshSubmitState);

    function getReferralFormData() {
      const getValue = (id) => {
        const el = document.getElementById(id);
        return el ? el.value : '';
      };
      return {
        referralTime: getValue('referralTime'),
        referralMode: getValue('referralMode'),
        referralFacility: getValue('referralFacility'),
        mainSymptoms: getValue('mainSymptoms'),
        treatmentBeforeReferral: getValue('treatmentBeforeReferral'),
        medications: getValue('medications'),
        patientGeneralCondition: getValue('patientGeneralCondition'),
        vitalSigns: getValue('vitalSigns'),
        initial: getValue('initial'),
        careContext: transferType,
        recordedBy: currentUser.uid,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      };
    }

    function getTransferStatusMapping(type) {
      switch (type) {
        case 'labour':
          return { status: 'labour_transfer', reason: 'Transferred during labour care' };
        case 'pnc':
          return { status: 'pnc_transfer', reason: 'Transferred during postnatal care' };
        case 'newborn':
          return { status: 'pnc_transfer', reason: 'Transferred during newborn care' };
        case 'anc':
        default:
          return { status: 'anc_transfer', reason: 'Transferred during antenatal care' };
      }
    }

    async function saveReferralRecords(patientId, referralData) {
      const db = firebase.firestore();
      const patientRef = db.collection('patients').doc(patientId);
      await patientRef.collection('records').doc('transferRecord').set({
        ...referralData,
        patientId
      });
      await patientRef.collection('records').doc('endTreatment').set({
        outcome: 'transfer',
        recordedBy: currentUser.uid,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      const mapping = getTransferStatusMapping(transferType);
      if (window.StatusManager && StatusManager.checkAndUpdateToTransfer) {
        await StatusManager.checkAndUpdateToTransfer(patientId, mapping.status, mapping.reason);
      } else {
        await patientRef.update({
          status: mapping.status,
          last_updated: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    }

    function cancelTransfer() {
      if (referFlow && window.history.length > 1) {
        window.history.back();
        return;
      }
      window.location.href = 'patient-transfers.html';
    }

    async function submitTransferRequest() {
      const patientId = selectedPatientId;
      const notes = (document.getElementById('notesInput').value || '').trim();
      const region = document.getElementById('regionSelect').value || null;
      const township = document.getElementById('townshipSelect').value || null;
      const ids = Array.from(document.querySelectorAll('.mw-check:checked')).map((el) => el.value);
      const referralData = getReferralFormData();

      if (!patientId) return AppDialog.alert('Please select a patient.', { title: 'Transfer Patient' });
      if (!referralData.referralTime) return AppDialog.alert('Please enter referral time.', { title: 'Transfer Patient' });
      if (ids.length === 0) return AppDialog.alert('Please select at least one receiving midwife.', { title: 'Transfer Patient' });

      const patient = allPatients.find((p) => p.id === patientId) || {};
      const recipients = allMidwives.filter((u) => ids.includes(u.id)).map((u) => ({
        uid: u.id,
        name: u.name || u.email || 'Midwife',
        region: u.region || null,
        township: u.township || null
      }));

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Sending...';
      try {
        await saveReferralRecords(patientId, referralData);

        await firebase.firestore().collection('patient_transfer_requests').add({
          patientId,
          patientName: patient.name || null,
          fromMidwifeId: currentUser.uid,
          fromMidwifeName: currentUserData?.name || currentUser.email || 'Midwife',
          fromMidwifeEmail: currentUser.email || null,
          fromRegion: currentUserData?.region || null,
          fromTownship: currentUserData?.township || null,
          targetRegion: region,
          targetTownship: township,
          targetMidwifeIds: ids,
          recipients,
          notes: notes || null,
          referralRecord: referralData,
          careContext: transferType,
          status: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          acceptedBy: []
        });

        if (window.AuditLogger && AuditLogger.logAuditEvent) {
          AuditLogger.logAuditEvent('transfer_request_created', 'patient', patientId, { recipientCount: ids.length, careContext: transferType });
        }

        await AppDialog.alert(
          'Referral record saved and transfer request sent. The receiving midwife can accept from Transfer Requests.',
          { title: 'Success' }
        );

        if (referFlow) {
          window.location.href = 'patient-care-hub.html?patient=' + encodeURIComponent(patientId);
        } else {
          window.location.href = 'patient-transfers.html';
        }
      } catch (e) {
        console.error(e);
        AppDialog.alert('Unable to complete transfer: ' + e.message, { title: 'Error' });
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane me-1"></i> Send transfer request';
        refreshSubmitState();
      }
    }

    function escapeHtml(v) {
      return String(v || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
