<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quality Improvement - Maternal & Child Health Care System</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="css/vendor/fontawesome-all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/vendor/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/nav-back.js"></script>
  <style>
    :root {
      --primary-color: #0d9488;
      --secondary-color: #0f766e;
      --card-hover-shadow: 0 16px 32px rgba(15, 23, 42, 0.12);
    }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Inter', 'Myanmar Text', 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .header-section {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 0.85rem 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .header-section .container, .hub-main-container { max-width: 760px; }
    .header-section h1 { font-size: 1.2rem; font-weight: 800; margin: 0; line-height: 1.25; }
    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .header-actions .btn {
      min-height: 44px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .hub-main-container {
      flex: 1;
      width: 100%;
      padding: 1rem 1rem 2rem;
    }
    .care-modules {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.85rem;
    }
    .module-card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 16px;
      padding: 1rem 1.1rem;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
      transition: all 0.2s ease;
      cursor: pointer;
      border: 1px solid rgba(13, 148, 136, 0.15);
      border-left: 5px solid var(--primary-color);
      display: flex;
      align-items: center;
      gap: 1rem;
      min-height: 92px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .module-card:hover { transform: translateY(-2px); box-shadow: var(--card-hover-shadow); }
    .module-card.coming-soon {
      opacity: 0.85;
      border-left-color: #94a3b8;
      cursor: default;
    }
    .module-icon {
      width: 48px; height: 48px; border-radius: 14px; background: #ccfbf1;
      display: inline-flex; align-items: center; justify-content: center;
      flex: 0 0 48px; font-size: 1.35rem; color: var(--primary-color);
    }
    .module-title { font-size: 1.05rem; font-weight: 800; color: #111827; margin-bottom: 0.2rem; }
    .module-description { color: #6b7280; font-size: 0.9rem; margin: 0; line-height: 1.45; }
    .module-content { flex: 1; min-width: 0; }
    .module-arrow { color: #94a3b8; }
    .coming-soon-badge {
      display: inline-block;
      margin-top: 0.35rem;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      background: #e2e8f0;
      color: #475569;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .language-switcher { display: flex; gap: 0.25rem; }
    .language-btn {
      min-height: 44px;
      min-width: 44px;
      padding: 0.375rem 0.75rem;
      font-size: 0.875rem;
      border-radius: 8px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      touch-action: manipulation;
    }
    .language-btn.active { background: rgba(255,255,255,0.4); font-weight: 600; }
    @media (max-width: 768px) {
      .header-section .row > [class*="col-"] { width: 100%; }
      .header-actions { justify-content: flex-start; margin-top: 0.5rem; }
      .header-actions .btn-outline-light { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <div class="header-section">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6">
          <h1><i class="fas fa-chart-line me-2"></i><span class="lang-text" data-en="Quality Improvement" data-mm="အရည်အသွေး မြှင့်တင်ရေး">Quality Improvement</span></h1>
        </div>
        <div class="col-md-6">
          <div class="header-actions">
            <div class="language-switcher" role="group" aria-label="Language">
              <button type="button" class="btn btn-sm language-btn" data-lang="en" aria-label="English">ENG</button>
              <button type="button" class="btn btn-sm language-btn active" data-lang="mm" aria-label="Myanmar">MM</button>
            </div>
            <a href="#" class="btn btn-outline-light btn-sm" onclick="AppNavBack.toHome(); return false;" aria-label="Back to Home">
              <i class="fas fa-arrow-left me-2"></i><span class="lang-text" data-en="Home" data-mm="ပင်မ">Home</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <main class="container hub-main-container">
    <div class="care-modules">
      <div class="module-card coming-soon" role="button" tabindex="0" aria-label="Facility Readiness Assessment Coming soon" onclick="showComingSoon()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();showComingSoon();}">
        <div class="module-icon"><i class="fas fa-hospital"></i></div>
        <div class="module-content">
          <div class="module-title lang-text" data-en="Facility Readiness Assessment" data-mm="ဌာန အဆင်သင့်ဖြစ်မှု စစ်ဆေးခြင်း">Facility Readiness Assessment</div>
          <p class="module-description lang-text" data-en="Assess facility readiness for maternal and newborn care." data-mm="မိခင်နှင့် မွေးကင်းစ စောင့်ရှောက်မှုအတွက် ဌာန အဆင်သင့်ဖြစ်မှုကို စစ်ဆေးရန်">Assess facility readiness for maternal and newborn care.</p>
          <span class="coming-soon-badge lang-text" data-en="Coming soon" data-mm="မကြာမီ">Coming soon</span>
        </div>
        <i class="fas fa-lock module-arrow" aria-hidden="true"></i>
      </div>

      <div class="module-card" role="button" tabindex="0" aria-label="Competency Assessment" onclick="navigateToCompetency()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();navigateToCompetency();}">
        <div class="module-icon"><i class="fas fa-user-check"></i></div>
        <div class="module-content">
          <div class="module-title lang-text" data-en="Competency Assessment" data-mm="ကျွမ်းကျင်မှု စစ်ဆေးခြင်း">Competency Assessment</div>
          <p class="module-description lang-text" data-en="Review care competency scores and set improvement targets." data-mm="စောင့်ရှောက်မှု ကျွမ်းကျင်မှု အမှတ်များနှင့် တိုးတက်မှု ပန်းတိုင်များ">Review care competency scores and set improvement targets.</p>
        </div>
        <i class="fas fa-chevron-right module-arrow" aria-hidden="true"></i>
      </div>
    </div>
  </main>

  <script>
    let currentLanguage = localStorage.getItem('appLanguage') || localStorage.getItem('language') || 'mm';

    function applyLanguage(lang) {
      currentLanguage = lang;
      localStorage.setItem('appLanguage', lang);
      document.querySelectorAll('.language-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      document.querySelectorAll('.lang-text').forEach(function (el) {
        var text = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-mm');
        if (text) el.textContent = text;
      });
    }

    function navigateToCompetency() {
      window.location.href = 'quality-competency.html';
    }

    function showComingSoon() {
      var msg = currentLanguage === 'mm'
        ? 'Facility Readiness Assessment ကို မကြာမီ ထည့်သွင်းပါမည်။'
        : 'Facility Readiness Assessment is coming soon.';
      if (window.AppDialog && AppDialog.alert) AppDialog.alert(msg, { title: 'Quality Improvement' });
      else alert(msg);
    }

    document.querySelectorAll('.language-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { applyLanguage(btn.dataset.lang); });
    });
    applyLanguage(currentLanguage);
  </script>
</body>
</html>
