<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QR voucher status</title>
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/vendor/fontawesome-all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/vouchers.css">
  <script src="js/vendor/bootstrap.bundle.min.js"></script>
  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-firestore.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
</head>
<body class="voucher-page">
  <header class="voucher-header py-3">
    <div class="container d-flex align-items-center justify-content-between gap-3">
      <div>
        <h1 class="mb-1"><i class="fas fa-clipboard-list me-2"></i>QR voucher status</h1>
        <div class="small opacity-75">Issued QR vouchers for this maternity home</div>
      </div>
      <a id="backLink" class="btn btn-outline-light btn-sm voucher-header-action" href="antenatal-tests.html">
        <i class="fas fa-arrow-left me-1"></i>Back
      </a>
    </div>
  </header>

  <main class="container voucher-main">
    <div id="pageStatus" class="status-box info" role="status">Loading QR vouchers…</div>
    <section class="voucher-card">
      <div class="mw-status-filters">
        <label>
          <span>Issued date</span>
          <input id="filterDate" type="date" class="form-control" aria-label="Filter by issued date">
        </label>
        <label>
          <span>Month</span>
          <select id="filterMonth" class="form-select" aria-label="Filter by issued month">
            <option value="all" selected>All months</option>
          </select>
        </label>
        <label>
          <span>Status</span>
          <select id="filterStatus" class="form-select" aria-label="Filter by status">
            <option value="all" selected>All statuses</option>
            <option value="issued">Issued</option>
            <option value="redeemed">Redeemed</option>
            <option value="verified">Verified</option>
            <option value="paid">Paid</option>
            <option value="rejected">Rejected</option>
          </select>
        </label>
      </div>
      <div id="voucherList" class="mw-status-list mt-3" aria-live="polite"></div>
    </section>
  </main>

  <script src="js/vendor/qrcode.min.js"></script>
  <script src="js/voucher-pricing.js"></script>
  <script src="js/voucher-service.js"></script>
  <script src="js/midwife-vouchers.js"></script>
</body>
</html>
