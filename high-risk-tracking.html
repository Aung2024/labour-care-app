<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#dc2626">
  <title>High Risk Pregnancy Tracker - MNCH</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="css/vendor/fontawesome-all.min.css" />
  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/vendor/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/township-region.js"></script>
  <script src="js/facility-config.js"></script>
  <script src="js/tracking-reader.js"></script>
  <script src="js/analytics-refresh-queue.js"></script>
  <script src="js/edd-display.js"></script>
  <script src="js/high-risk-utils.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/user-cache.js"></script>
  <script src="js/offline-manager.js"></script>
  <script src="js/offline-status-bar.js"></script>
  <script src="js/lang-apply.js"></script>
  <script src="js/register-sw.js"></script>
  <style>
    :root {
      --hrt-surface: #ffffff;
      --hrt-border: #e2e8f0;
      --hrt-header-bg: #f1f5f9;
      --hrt-header-text: #334155;
      --hrt-row-hover: #f8fafc;
      --hrt-row-stripe: #fafbfc;
      --hrt-text: #0f172a;
      --hrt-muted: #64748b;
      --hrt-accent: #b91c1c;
      --hrt-accent-soft: #fef2f2;
      --hrt-phone: #2563eb;
      --hrt-radius: 12px;
      --hrt-shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 4px 20px rgba(15, 23, 42, 0.06);
    }

    body {
      font-family: 'Pyidaungsu', 'Myanmar Text', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(145deg, #5b67c9 0%, #6b4d8c 45%, #4c1d95 100%);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      color: var(--hrt-text);
      -webkit-font-smoothing: antialiased;
    }

    .page-header {
      background: linear-gradient(135deg, #b91c1c 0%, #991b1b 50%, #7f1d1d 100%);
      color: #fff;
      padding: calc(0.65rem + env(safe-area-inset-top, 0px))
        calc(0.85rem + env(safe-area-inset-right, 0px))
        0.65rem
        calc(0.85rem + env(safe-area-inset-left, 0px));
      box-shadow: 0 4px 24px rgba(127, 29, 29, 0.35);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .main-wrap {
      max-width: 1480px;
      margin: 0 auto;
      padding: 1.25rem 1rem calc(2rem + env(safe-area-inset-bottom, 0px));
    }

    .card-panel {
      background: var(--hrt-surface);
      border-radius: var(--hrt-radius);
      box-shadow: var(--hrt-shadow);
      border: 1px solid rgba(255,255,255,0.65);
      padding: 1.25rem 1.35rem;
      margin-bottom: 1rem;
    }

    #tableState.card-panel { padding: 0; overflow: hidden; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--hrt-border);
      background: linear-gradient(180deg, #fafbfc 0%, #fff 100%);
    }
    .toolbar .hrt-info {
      flex: 1 1 200px;
      color: var(--hrt-muted);
      font-size: 0.8rem;
      line-height: 1.5;
      margin: 0;
    }

    /* Table desktop */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .table-wrap::-webkit-scrollbar { height: 8px; }
    .table-wrap::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    .hrt-table {
      font-size: 0.8125rem;
      line-height: 1.45;
      color: var(--hrt-text);
      margin: 0;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 900px;
    }
    .hrt-table thead th {
      position: sticky; top: 0; z-index: 2;
      background: var(--hrt-header-bg);
      color: var(--hrt-header-text);
      font-weight: 600; font-size: 0.6875rem;
      letter-spacing: 0.04em; text-transform: uppercase;
      padding: 0.85rem 0.75rem;
      border-bottom: 2px solid var(--hrt-border);
      white-space: nowrap; vertical-align: middle;
    }
    .hrt-table tbody td {
      padding: 0.75rem;
      border-bottom: 1px solid var(--hrt-border);
      vertical-align: top;
    }
    .hrt-table tbody tr:nth-child(even) td { background: var(--hrt-row-stripe); }
    .hrt-table tbody tr:hover td { background: var(--hrt-row-hover); }
    .hrt-table tbody tr:last-child td { border-bottom: none; }
    .hrt-table tbody tr.hrt-resolved td { opacity: 0.55; }
    .hrt-table tbody tr.hrt-resolved .hrt-patient-name { text-decoration: line-through; }

    .hrt-col-name { min-width: 9rem; max-width: 12rem; }
    .hrt-patient-name { font-weight: 600; letter-spacing: -0.01em; color: #1e293b; }
    .hrt-col-phone { min-width: 6rem; white-space: nowrap; }
    .hrt-col-phone a { color: var(--hrt-phone); text-decoration: none; font-weight: 500; }
    .hrt-col-phone a:hover { text-decoration: underline; }
    .hrt-col-edd { min-width: 8rem; max-width: 10rem; }
    .hrt-col-days { min-width: 6rem; text-align: center; }
    .hrt-col-risks { min-width: 12rem; max-width: 22rem; }
    .hrt-col-cues { min-width: 6rem; max-width: 10rem; }
    .hrt-col-actions { min-width: 10rem; max-width: 14rem; }

    /* Urgency dot */
    .urgency-badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.03em; padding: 0.2rem 0.5rem 0.2rem 0.35rem;
      border-radius: 999px; margin-bottom: 0.25rem;
    }
    .urgency-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .urgency-critical .urgency-dot { background: #dc2626; animation: pulse-dot 1.2s ease-in-out infinite; }
    .urgency-critical { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .urgency-high .urgency-dot { background: #dc2626; }
    .urgency-high { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .urgency-moderate .urgency-dot { background: #f59e0b; }
    .urgency-moderate { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
    .urgency-on-track .urgency-dot { background: #10b981; }
    .urgency-on-track { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.4); }
    }

    /* EDD stack */
    .hrt-edd-stack { display: flex; flex-direction: column; gap: 0.2rem; align-items: flex-start; }
    .hrt-edd-date { font-weight: 600; color: #1e293b; }
    .hrt-edd-ga { font-size: 0.75rem; color: var(--hrt-muted); }
    .hrt-edd-flag {
      display: inline-block; font-size: 0.65rem; font-weight: 600;
      letter-spacing: 0.02em; text-transform: uppercase;
      padding: 0.15rem 0.45rem; border-radius: 4px;
      background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa;
    }

    .hrt-empty { color: #cbd5e1; font-weight: 300; font-size: 1.1rem; }

    /* Pills */
    .hrt-pill-wrap { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .hrt-pill {
      display: inline-block; font-size: 0.68rem; font-weight: 500;
      line-height: 1.35; padding: 0.22rem 0.45rem; border-radius: 6px;
      max-width: 100%; word-break: break-word; border: 1px solid transparent;
    }
    .hrt-pill--anc { background: #f1f5f9; color: #334155; border-color: #e2e8f0; }
    .hrt-pill--lcg { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
    .hrt-pill--pnc { background: #f5f3ff; color: #5b21b6; border-color: #ddd6fe; }
    .hrt-pill--other { background: #fffbeb; color: #92400e; border-color: #fde68a; }

    .hrt-day-pill {
      display: inline-block; font-size: 0.75rem; font-weight: 600;
      padding: 0.3rem 0.5rem; border-radius: 999px; min-width: 3rem; text-align: center;
    }
    .hrt-day-pill--ok { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
    .hrt-day-pill--warn { background: #fff7ed; color: #c2410c; border: 1px solid #fdba74; }
    .hrt-day-pill--overdue { background: var(--hrt-accent-soft); color: #991b1b; border: 1px solid #fecaca; }

    .hrt-cue-pill {
      display: inline-block; font-size: 0.68rem; font-weight: 600;
      padding: 0.22rem 0.4rem; border-radius: 6px; margin: 0 0.2rem 0.2rem 0;
    }
    .hrt-cue-pill.danger { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .hrt-cue-pill.warning { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .hrt-cue-pill.info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }

    /* Action buttons */
    .hrt-action-bar {
      display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.35rem;
    }
    .hrt-act-btn {
      width: 30px; height: 30px;
      border-radius: 8px; border: 1px solid var(--hrt-border);
      background: #fff; color: var(--hrt-muted);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.75rem; cursor: pointer; transition: all 0.15s;
      padding: 0;
    }
    .hrt-act-btn:hover { background: #f1f5f9; color: var(--hrt-text); transform: translateY(-1px); }
    .hrt-act-btn.act-called:hover { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .hrt-act-btn.act-home_visit:hover { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .hrt-act-btn.act-referred:hover { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .hrt-act-btn.act-medication:hover { background: #f5f3ff; color: #7c3aed; border-color: #ddd6fe; }
    .hrt-act-btn.act-counseled:hover { background: #fffbeb; color: #b45309; border-color: #fde68a; }
    .hrt-act-btn.act-resolved:hover { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }

    .hrt-last-action {
      font-size: 0.7rem; color: var(--hrt-muted); line-height: 1.3;
      display: flex; align-items: center; gap: 0.3rem;
    }
    .hrt-last-action i { font-size: 0.65rem; }

    .hrt-hub-link {
      font-size: 0.7rem; color: var(--hrt-accent); font-weight: 600;
      text-decoration: none; display: inline-flex; align-items: center; gap: 0.25rem;
      margin-top: 0.25rem;
    }
    .hrt-hub-link:hover { text-decoration: underline; color: #991b1b; }

    .hrt-resolved-badge {
      display: inline-block; font-size: 0.6rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      padding: 0.15rem 0.45rem; border-radius: 4px;
      background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0;
    }

    /* Follow-up overdue */
    .hrt-followup-overdue {
      font-size: 0.65rem; color: #b91c1c; font-weight: 600;
      display: flex; align-items: center; gap: 0.2rem; margin-top: 0.15rem;
    }

    /* Mobile cards */
    .hrt-cards { display: none; }
    .hrt-card {
      background: var(--hrt-surface);
      border-radius: var(--hrt-radius);
      box-shadow: var(--hrt-shadow);
      border: 1px solid rgba(255,255,255,0.65);
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .hrt-card.hrt-resolved { opacity: 0.55; }
    .hrt-card.hrt-resolved .hrt-patient-name { text-decoration: line-through; }
    .hrt-card-header {
      display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;
    }
    .hrt-card-header .hrt-patient-name { font-size: 0.95rem; flex: 1; }
    .hrt-card-phone-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; font-size: 0.9rem;
    }
    .hrt-card-meta {
      display: flex; flex-wrap: wrap; align-items: center;
      gap: 0.5rem; margin-bottom: 0.6rem; font-size: 0.8rem;
    }
    .hrt-card-meta .edd-text { color: var(--hrt-muted); }
    .hrt-card-section { margin-bottom: 0.5rem; }
    .hrt-card-section-label {
      font-size: 0.65rem; font-weight: 600; text-transform: uppercase;
      color: var(--hrt-muted); letter-spacing: 0.04em; margin-bottom: 0.2rem;
    }
    .hrt-card-actions {
      display: flex; flex-wrap: wrap; gap: 0.35rem;
      padding-top: 0.5rem; border-top: 1px solid var(--hrt-border);
      margin-top: 0.5rem; align-items: center;
    }
    .hrt-card-actions .hrt-act-btn { width: 34px; height: 34px; font-size: 0.85rem; }
    .hrt-card-actions .hrt-hub-link { margin-left: auto; }

    /* Action modal */
    .action-modal-type {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 1rem; font-weight: 600; padding: 0.5rem 0.8rem;
      border-radius: 10px; background: #f1f5f9; color: #334155;
      margin-bottom: 0.75rem;
    }

    @media (max-width: 768px) {
      .main-wrap { padding: 0.75rem 0.5rem 1.5rem; }
      .hrt-desktop-table { display: none !important; }
      .hrt-cards { display: block !important; }
    }
    @media (min-width: 769px) {
      .hrt-cards { display: none !important; }
    }

    /* Dashboard summary — aligned with dashboard stat cards */
    .hrt-dashboard {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    @media (min-width: 900px) {
      .hrt-dashboard { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.85rem; }
    }
    @media (min-width: 1200px) {
      .hrt-dashboard { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1rem; }
    }
    .hrt-stat-card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
      border: 1px solid #e2e8f0;
      border-left: 5px solid transparent;
      padding: 1rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-height: 6.5rem;
      justify-content: center;
    }
    .hrt-stat-card-clickable {
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .hrt-stat-card-clickable:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
    }
    .hrt-stat-card-clickable.selected {
      box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.1), 0 12px 28px rgba(0, 0, 0, 0.12);
    }
    .hrt-stat-card .stat-icon {
      width: 2rem;
      height: 2rem;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      margin-bottom: 0.15rem;
    }
    .hrt-stat-card .stat-value {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      color: #0f172a;
    }
    .hrt-stat-card .stat-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #6b7280;
      line-height: 1.35;
    }
    .hrt-stat-card.danger { border-left-color: #ef4444; }
    .hrt-stat-card.success { border-left-color: #10b981; }
    .hrt-stat-card.warning { border-left-color: #f59e0b; }
    .hrt-stat-card.danger .stat-icon { background: #fef2f2; color: #ef4444; }
    .hrt-stat-card.success .stat-icon { background: #ecfdf5; color: #10b981; }
    .hrt-stat-card.warning .stat-icon { background: #fffbeb; color: #f59e0b; }
    .hrt-stat-breakdown {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 0.55rem;
      margin-top: 0.15rem;
      font-size: 0.66rem;
      color: #64748b;
      line-height: 1.35;
    }
    .hrt-stat-breakdown strong { color: #0f172a; font-weight: 700; }

    .hrt-search-bar {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .hrt-search-bar input {
      flex: 1 1 220px;
      border: 1px solid var(--hrt-border);
      border-radius: 10px;
      padding: 0.55rem 0.85rem;
      font-size: 0.875rem;
      background: #fff;
    }
    .hrt-recommendation-text {
      font-size: 0.74rem;
      color: #334155;
      line-height: 1.35;
      max-width: 14rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hrt-rows {
      display: flex;
      flex-direction: column;
    }
    .hrt-row {
      border-bottom: 1px solid var(--hrt-border);
      background: #fff;
    }
    .hrt-row:last-child { border-bottom: none; }
    .hrt-row-btn {
      width: 100%;
      border: none;
      background: transparent;
      padding: 0.8rem 0.95rem;
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.15fr);
      gap: 0.7rem;
      align-items: start;
      text-align: left;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .hrt-row-btn:hover { background: var(--hrt-row-hover); }
    .hrt-cell-title {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--hrt-muted);
      margin-bottom: 0.2rem;
    }
    .hrt-patient-main {
      font-size: 0.9rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.25;
    }
    .hrt-patient-meta,
    .hrt-pregnancy-meta {
      font-size: 0.74rem;
      color: #64748b;
      line-height: 1.3;
      margin-top: 0.15rem;
      display: block;
    }
    .hrt-anc-date {
      font-size: 0.72rem;
      color: #64748b;
      margin-top: 0.2rem;
      display: block;
    }
    .hrt-status-track {
      display: inline-flex;
      align-items: center;
      gap: 0.18rem;
      margin-bottom: 0.35rem;
      flex-wrap: wrap;
    }
    .hrt-next-due {
      margin-top: 0.25rem;
      color: #64748b;
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .kmc-status-track-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.15rem;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      min-height: 44px;
    }
    .hrt-track-dot {
      width: 17px;
      height: 17px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.58rem;
      font-weight: 700;
      border: 1px solid #cbd5e1;
      color: #94a3b8;
      background: #fff;
    }
    .hrt-track-dot.visited {
      background: #22c55e;
      border-color: #16a34a;
      color: #fff;
    }
    .hrt-track-dot.next {
      background: #fff;
      border-color: #cbd5e1;
      color: #64748b;
    }
    .hrt-track-dot.visited.alive {
      background: #22c55e;
      border-color: #16a34a;
      color: #fff;
    }
    .hrt-track-dot.visited.death {
      background: #111827;
      border-color: #111827;
      color: #fff;
    }
    .hrt-track-dot.visited.transfer {
      background: #7c3aed;
      border-color: #6d28d9;
      color: #fff;
    }
    .hrt-track-dot.overdue_followup {
      background: #eab308;
      border-color: #ca8a04;
      color: #fff;
    }
    .hrt-track-dot.lost_to_followup {
      background: #dc2626;
      border-color: #b91c1c;
      color: #fff;
    }
    .hrt-outcome-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.67rem;
      font-weight: 700;
      border-radius: 999px;
      padding: 0.22rem 0.5rem;
      border: 1px solid transparent;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .hrt-outcome-on_track { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .hrt-outcome-overdue_followup { background: #fff7ed; color: #c2410c; border-color: #fdba74; }
    .hrt-outcome-lost_to_followup { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .hrt-outcome-complete { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .hrt-outcome-alive { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
    .hrt-outcome-transfer { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
    .hrt-outcome-death { background: #111827; color: #fff; border-color: #111827; }

    .hrt-header-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
    }
    .hrt-header-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }
    .hrt-title {
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.25;
    }
    .hrt-back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      padding: 0 0.65rem;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .hrt-back-btn:hover { background: rgba(255, 255, 255, 0.22); }
    .language-switcher {
      display: inline-flex;
      gap: 0.35rem;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 0.25rem;
    }
    .language-btn {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.92);
      border-radius: 8px;
      padding: 0.4rem 0.65rem;
      min-height: 44px;
      min-width: 44px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .language-btn.active {
      background: rgba(255, 255, 255, 0.95);
      color: #991b1b;
    }
    .hrt-new-anc-btn {
      border-color: #bbf7d0;
      color: #047857;
      background: #ecfdf5;
    }
    .hrt-new-anc-btn:hover {
      background: #d1fae5;
      color: #065f46;
    }

    .hrt-row-details {
      display: none;
      padding: 0 0.95rem 0.85rem;
      background: #f8fafc;
      border-top: 1px dashed #cbd5e1;
    }
    .hrt-row.expanded .hrt-row-details { display: block; }
    .hrt-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.6rem;
      margin-bottom: 0.7rem;
    }
    .hrt-detail-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.55rem 0.65rem;
    }
    .hrt-detail-label {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 0.2rem;
    }
    .hrt-detail-value { font-size: 0.8rem; color: #0f172a; }
    .hrt-row-actions { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
    .hrt-row-actions .hrt-hub-link { margin-top: 0; margin-left: auto; }

    @media (max-width: 900px) {
      .hrt-row-btn {
        grid-template-columns: 1fr;
        gap: 0.5rem;
        padding: 0.7rem 0.7rem;
      }
      .hrt-cell-title { font-size: 0.62rem; }
      .hrt-detail-grid { grid-template-columns: 1fr; }
      .toolbar { padding: 0.75rem; }
    }

    /* Government pilot register layout */
    .hrt-register-desktop {
      display: block;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .hrt-register-table {
      width: 100%;
      min-width: 1180px;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.78rem;
    }
    .hrt-register-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f8fafc;
      color: #475569;
      font-size: 0.64rem;
      line-height: 1.25;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.55rem 0.6rem;
      border-bottom: 1px solid var(--hrt-border);
      white-space: nowrap;
    }
    .hrt-register-table td {
      padding: 0.55rem 0.6rem;
      border-bottom: 1px solid #edf2f7;
      vertical-align: top;
      background: #fff;
    }
    .hrt-register-table tr:hover td { background: #f8fafc; }
    .hrt-register-table tr { cursor: pointer; }
    .hrt-register-table .col-name { width: 14%; }
    .hrt-register-table .col-pregnancy { width: 12%; }
    .hrt-register-table .col-danger { width: 14%; }
    .hrt-register-table .col-anc-visits { width: 12%; }
    .hrt-register-table .col-outcome { width: 9%; }
    .hrt-register-table .col-recommendation { width: 16%; }
    .hrt-register-table .col-sms { width: 13%; }
    .hrt-register-table .col-action { width: 10%; }

    .hrt-mobile-register {
      display: none;
      padding: 0.55rem;
      gap: 0.55rem;
      flex-direction: column;
    }
    .hrt-mobile-card {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 1px 8px rgba(15, 23, 42, 0.06);
    }
    .hrt-mobile-card-main {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 0.65rem;
      display: grid;
      gap: 0.45rem;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .hrt-mobile-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.55rem;
      align-items: start;
    }
    .hrt-mobile-name {
      font-size: 0.95rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.2;
    }
    .hrt-mobile-id {
      font-size: 0.72rem;
      color: #64748b;
      margin-top: 0.1rem;
    }
    .hrt-mobile-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.45rem;
    }
    .hrt-mobile-field {
      background: #f8fafc;
      border: 1px solid #eef2f7;
      border-radius: 10px;
      padding: 0.45rem 0.5rem;
      min-width: 0;
    }
    .hrt-mobile-label {
      display: block;
      font-size: 0.58rem;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 0.04em;
      margin-bottom: 0.18rem;
    }
    .hrt-mobile-value {
      font-size: 0.76rem;
      color: #0f172a;
      line-height: 1.25;
    }
    .hrt-mobile-wide { grid-column: 1 / -1; }
    .hrt-register-actions {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      flex-wrap: wrap;
    }
    .hrt-mini-btn {
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #475569;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .hrt-mini-btn:hover { background: #f1f5f9; color: #0f172a; }
    .hrt-mini-btn.disabled,
    .hrt-mini-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      background: #f8fafc;
    }
    .hrt-status-btn {
      border: 1px solid #fecaca;
      background: #fff;
      color: #991b1b;
      min-height: 34px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      padding: 0 0.55rem;
      font-size: 0.7rem;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .hrt-status-btn:hover {
      background: #fef2f2;
      color: #7f1d1d;
    }
    .hrt-sms-contact {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      min-width: 6.25rem;
    }
    .hrt-contact-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .hrt-contact-label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .hrt-contact-patient .hrt-contact-label { color: #1d4ed8; }
    .hrt-contact-patient .hrt-phone-call-btn { color: #1d4ed8; border-color: #bfdbfe; background: #eff6ff; }
    .hrt-contact-emergency .hrt-contact-label { color: #b91c1c; }
    .hrt-contact-emergency .hrt-phone-call-btn { color: #b91c1c; border-color: #fecaca; background: #fef2f2; }
    .hrt-contact-chw .hrt-contact-label { color: #047857; }
    .hrt-contact-chw .hrt-phone-call-btn { color: #047857; border-color: #a7f3d0; background: #ecfdf5; }
    .hrt-phone-call-btn {
      width: 34px;
      height: 34px;
      min-width: 34px;
      min-height: 34px;
      border-radius: 50%;
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 0.82rem;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .hrt-phone-call-btn:hover {
      background: #dbeafe;
      color: #1d4ed8;
    }
    .hrt-phone-call-btn.disabled {
      background: #f8fafc;
      color: #cbd5e1;
      border-color: #e2e8f0;
      pointer-events: none;
    }
    .hrt-contact-patient .hrt-phone-call-btn:not(.disabled):hover { background: #dbeafe; color: #1d4ed8; }
    .hrt-contact-emergency .hrt-phone-call-btn:not(.disabled):hover { background: #fee2e2; color: #991b1b; }
    .hrt-contact-chw .hrt-phone-call-btn:not(.disabled):hover { background: #d1fae5; color: #047857; }
    .hrt-modal-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.6rem;
      margin-bottom: 0.75rem;
    }
    .hrt-modal-box {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.55rem 0.65rem;
      background: #f8fafc;
    }
    .hrt-modal-label {
      font-size: 0.63rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 800;
      color: #64748b;
      margin-bottom: 0.25rem;
    }
    .hrt-modal-value {
      font-size: 0.84rem;
      color: #0f172a;
      line-height: 1.35;
    }

    .hrt-visit-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
    }

    .hrt-visit-modal-backdrop.show {
      display: flex;
    }

    .hrt-visit-modal {
      width: min(92vw, 390px);
      background: #ffffff;
      border-radius: 22px;
      padding: 1.25rem;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.28);
      text-align: center;
    }

    .hrt-visit-modal-icon {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      margin: 0 auto 0.85rem;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
    }

    .hrt-visit-modal-title {
      margin: 0 0 0.35rem;
      color: #0f172a;
      font-size: 1.05rem;
      font-weight: 900;
    }

    .hrt-visit-modal-patient {
      margin: 0 0 0.85rem;
      color: #64748b;
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .hrt-visit-modal-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.55rem;
      margin-bottom: 0.85rem;
      text-align: left;
    }

    .hrt-visit-modal-due {
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 16px;
      padding: 0.85rem 0.9rem;
      margin-bottom: 0.65rem;
    }

    .hrt-visit-modal-due-label {
      display: block;
      color: #166534;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.35rem;
    }

    .hrt-visit-modal-due-value {
      display: block;
      color: #14532d;
      font-size: 1.08rem;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 0.01em;
    }

    .hrt-visit-modal-due.is-overdue {
      background: #fff7ed;
      border-color: #fdba74;
    }

    .hrt-visit-modal-due.is-overdue .hrt-visit-modal-due-label {
      color: #9a3412;
    }

    .hrt-visit-modal-due.is-overdue .hrt-visit-modal-due-value {
      color: #9a3412;
    }

    .hrt-visit-modal-due.is-lost {
      background: #fef2f2;
      border-color: #fca5a5;
    }

    .hrt-visit-modal-due.is-lost .hrt-visit-modal-due-label,
    .hrt-visit-modal-due.is-lost .hrt-visit-modal-due-value {
      color: #991b1b;
    }

    .hrt-visit-modal-note {
      margin-bottom: 0.85rem;
      padding: 0.55rem 0.65rem;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #475569;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .hrt-visit-modal-note.is-overdue {
      background: #fff7ed;
      border-color: #fed7aa;
      color: #c2410c;
    }

    .hrt-visit-modal-note.is-lost {
      background: #fef2f2;
      border-color: #fecaca;
      color: #b91c1c;
    }

    .hrt-visit-modal-note.is-ok {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #15803d;
    }

    .hrt-visit-modal-close {
      min-height: 44px;
      width: 100%;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-weight: 800;
      touch-action: manipulation;
    }

    @media (max-width: 900px) {
      .hrt-register-desktop { display: none; }
      .hrt-mobile-register { display: flex; }
      #tableState.card-panel {
        border-radius: 12px;
      }
      .hrt-dashboard {
        gap: 0.5rem;
        margin-bottom: 0.7rem;
      }
      .hrt-stat-card {
        min-height: 0;
        padding: 0.65rem 0.7rem;
        border-radius: 12px;
      }
      .hrt-stat-card .stat-icon {
        width: 1.55rem;
        height: 1.55rem;
        font-size: 0.72rem;
        margin-bottom: 0;
      }
      .hrt-stat-card .stat-value {
        font-size: 1.3rem;
      }
      .hrt-stat-card .stat-label {
        font-size: 0.58rem;
        line-height: 1.2;
      }
      .toolbar .hrt-info {
        font-size: 0.74rem;
      }
      .hrt-modal-summary {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 380px) {
      .hrt-mobile-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (hover: none) and (pointer: coarse) {
      .hrt-status-btn,
      .hrt-new-anc-btn {
        min-height: 44px;
        min-width: 44px;
        padding: 0.45rem 0.65rem;
      }
      .hrt-mobile-card-main {
        min-height: 44px;
      }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="hrt-header-row">
      <div class="hrt-header-brand">
        <button type="button" class="hrt-back-btn" onclick="location.href='home.html'" aria-label="Back">
          <i class="fas fa-arrow-left"></i>
        </button>
        <span class="hrt-title">High Risk Pregnancy Tracker</span>
      </div>
      <div class="language-switcher" role="group" aria-label="Language">
        <button type="button" class="language-btn" data-lang="en" onclick="setLang('en')">ENG</button>
        <button type="button" class="language-btn" data-lang="mm" onclick="setLang('mm')">MM</button>
      </div>
    </div>
  </header>

  <div class="main-wrap">
    <div id="offlineBanner" class="alert alert-warning d-none" role="alert"></div>

    <div id="dashboardState" class="d-none">
      <div class="hrt-dashboard">
        <div class="hrt-stat-card hrt-stat-card-clickable danger selected" data-filter="all" onclick="setHrtCardFilter('all')" role="button" tabindex="0">
          <span class="stat-icon"><i class="fas fa-female"></i></span>
          <span class="stat-value" id="statTotalHr">0</span>
          <span class="stat-label" id="statTotalHrLabel">Current HRT Patients</span>
        </div>
        <div class="hrt-stat-card hrt-stat-card-clickable success" data-filter="on_track" onclick="setHrtCardFilter('on_track')" role="button" tabindex="0">
          <span class="stat-icon"><i class="fas fa-calendar-check"></i></span>
          <span class="stat-value" id="statActiveHr">0</span>
          <span class="stat-label" id="statActiveHrLabel">Active follow-up</span>
        </div>
        <div class="hrt-stat-card hrt-stat-card-clickable warning" data-filter="overdue_followup" onclick="setHrtCardFilter('overdue_followup')" role="button" tabindex="0">
          <span class="stat-icon"><i class="fas fa-clock"></i></span>
          <span class="stat-value" id="statOverdueHr">0</span>
          <span class="stat-label" id="statOverdueHrLabel">Overdue follow-up</span>
        </div>
        <div class="hrt-stat-card hrt-stat-card-clickable danger" data-filter="lost_to_followup" onclick="setHrtCardFilter('lost_to_followup')" role="button" tabindex="0">
          <span class="stat-icon"><i class="fas fa-user-slash"></i></span>
          <span class="stat-value" id="statDefaultedHr">0</span>
          <span class="stat-label" id="statDefaultedHrLabel">Defaulted</span>
        </div>
        <div class="hrt-stat-card hrt-stat-card-clickable danger" data-filter="complete" onclick="setHrtCardFilter('complete')" role="button" tabindex="0">
          <span class="stat-icon"><i class="fas fa-circle-check"></i></span>
          <span class="stat-value" id="statCompletedHr">0</span>
          <span class="stat-label" id="statCompletedHrLabel">Completed</span>
          <span class="hrt-stat-breakdown" id="statCompletedBreakdown"></span>
        </div>
      </div>
      <div class="hrt-search-bar">
        <input type="search" id="hrtSearchInput" placeholder="" oninput="filterHrtRows()">
      </div>
    </div>

    <div id="loadingState" class="card-panel text-center py-5">
      <div class="spinner-border text-danger" role="status"></div>
      <p class="mt-2 mb-0 hrt-loading">Loading...</p>
    </div>
    <div id="emptyState" class="card-panel text-center py-5 d-none">
      <i class="fas fa-check-circle text-success fa-3x mb-3"></i>
      <p class="mb-0 hrt-empty"></p>
    </div>

    <div id="tableState" class="card-panel d-none">
      <div class="toolbar">
        <p class="hrt-info"></p>
      </div>
      <div id="hrtRows" class="hrt-rows"></div>
    </div>
  </div>

  <!-- Action Modal -->
  <div class="modal fade" id="actionModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius:16px;border:none;">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title action-modal-title fw-bold"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small mb-3" id="completeModalHint"></p>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="completionReasonSelect">Completion reason</label>
            <select class="form-select" id="completionReasonSelect" style="border-radius:10px;" onchange="updateHrtCompletionFields()">
              <option value="delivered_safely">Delivered</option>
              <option value="transferred">Transferred</option>
              <option value="risk_resolved">Risk resolved</option>
              <option value="loss_of_contact">Loss of contact</option>
              <option value="abortion">Abortion/pregnancy loss</option>
              <option value="death">Maternal death</option>
            </select>
          </div>
          <div class="mb-3" id="maternalOutcomeGroup">
            <label class="form-label fw-semibold" for="maternalOutcomeSelect">Maternal outcome</label>
            <select class="form-select" id="maternalOutcomeSelect" style="border-radius:10px;">
              <option value="alive">Alive</option>
              <option value="death">Dead</option>
              <option value="transfer">Transferred</option>
            </select>
          </div>
          <div class="mb-3" id="newbornOutcomeGroup">
            <label class="form-label fw-semibold" for="newbornOutcomeSelect">Newborn outcome</label>
            <select class="form-select" id="newbornOutcomeSelect" style="border-radius:10px;">
              <option value="alive">Alive</option>
              <option value="stillbirth">Stillbirth</option>
              <option value="neonatal_death">Neonatal death</option>
              <option value="not_applicable">Not applicable</option>
            </select>

    function isRegionalOfficerRole(role) {
      if (!role || typeof role !== 'string') return false;
      return role === 'Regional Officer' || role.toLowerCase().replace(/\s+/g, ' ') === 'regional officer';
    }

    function isTmoRole(role) {
      if (!role || typeof role !== 'string') return false;
      var normalized = role.toLowerCase().replace(/\s+/g, ' ').trim();
      return normalized === 'tmo' || normalized === 'township medical officer';
    }

    function formatDateVal(v) {
      if (v == null) return '\u2014';
      var d = v && typeof v.toDate === 'function' ? v.toDate() : new Date(v);
      if (isNaN(d.getTime())) return '\u2014';
      return d.toLocaleDateString(lang === 'mm' ? 'my-MM' : 'en-US', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
    }

    function relativeTime(ms) {
      if (!ms) return '';
      var diff = Date.now() - ms;
      if (diff < 60000) return tr('justNow');
      if (diff < 3600000) return Math.floor(diff / 60000) + tr('minutesAgo');
      if (diff < 86400000) return Math.floor(diff / 3600000) + tr('hoursAgo');
      return Math.floor(diff / 86400000) + tr('daysAgo');
    }

    function parseBloodPressure(str) {
      if (!str || typeof str !== 'string') return null;
      var m = str.trim().match(/^(\d+)\s*\/\s*(\d+)/);
      if (!m) return null;
      return { sys: parseInt(m[1], 10), dia: parseInt(m[2], 10) };
    }

    function clinicalCueTags(latest) {
      if (!latest) return [];
      var tags = [];
      var ref = latest.referral;
      if (ref === 'Yes' || ref === 'yes') tags.push({ cls: 'bg-info text-dark', t: tr('referral') });
      if (latest.dangerSignsPresent === 'yes' || latest.dangerSignsPresent === 'Yes') tags.push({ cls: 'bg-danger', t: tr('danger') });
      if (latest.anemiaStatus === 'Yes' || latest.anemiaStatus === 'yes') tags.push({ cls: 'bg-warning text-dark', t: tr('anemia') });
      var bp = parseBloodPressure(latest.bloodPressure);
      if (bp && (bp.sys >= 140 || bp.dia >= 90)) tags.push({ cls: 'bg-danger', t: tr('bp') });
      var up = (latest.urineProtein || '').toLowerCase();
      if (up.indexOf('++') !== -1 || up === 'positive' || up === 'trace++') tags.push({ cls: 'bg-warning text-dark', t: tr('protein') });
      var us = (latest.urineSugar || '').toLowerCase();
      if (us.indexOf('++') !== -1 || us === 'positive') tags.push({ cls: 'bg-warning text-dark', t: tr('sugar') });
      var hb = latest.hemoglobin != null ? parseFloat(latest.hemoglobin) : NaN;
      if (!isNaN(hb) && hb < 11) tags.push({ cls: 'bg-warning text-dark', t: 'Hb<11' });
      return tags;
    }

    function computeUrgency(daysSince) {
      if (daysSince != null && daysSince > FOLLOWUP_WARN_DAYS) return 'critical';
      if (daysSince != null && daysSince > FOLLOWUP_ALERT_DAYS) return 'high';
      return 'on-track';
    }

    function urgencyLabel(urg) {
      var map = { 'critical': 'urgCritical', 'high': 'urgHigh', 'moderate': 'urgModerate', 'on-track': 'urgOnTrack' };
      return tr(map[urg] || 'urgOnTrack');
    }

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function uniqueStrings(arr) {
      var seen = new Set();
      var out = [];
      (arr || []).forEach(function (x) {
        var s = x == null ? '' : String(x).trim();
        if (s && !seen.has(s)) { seen.add(s); out.push(s); }
      });
      return out;
    }

    var RISK_FACTOR_I18N = {
      'maternal_age_18_or_40 and over': { en: 'Maternal Age ≤18 years or ≥ 40 years', mm: 'အသက် ≤ ၁၈ နှစ် (သို့) ≥ ၄၀ နှစ်' },

    function humanizeRiskLabel(s) {
      var t = String(s == null ? '' : s).trim();

      if (HRT_RISK_LABELS[t]) return HRT_RISK_LABELS[t][lang] || HRT_RISK_LABELS[t].en;

      if (HRT_RISK_LABELS[noSpace]) return HRT_RISK_LABELS[noSpace][lang] || HRT_RISK_LABELS[noSpace].en;
      if (/:/.test(t)) return t;
      if (/_/.test(t)) return t.replace(/_/g, ' ').replace(/\b\w/g, function (ch) { return ch.toUpperCase(); });
      return t;

    }

    function parseDateOnlyLocal(val) {
      if (!val) return null;
      if (val && typeof val.toDate === 'function') val = val.toDate();
      if (val instanceof Date) {
        if (isNaN(val.getTime())) return null;
        return new Date(val.getFullYear(), val.getMonth(), val.getDate());
      }
      var s = String(val).trim();
      var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
      var d = new Date(s);
      if (isNaN(d.getTime())) return null;
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }

    function addDaysLocal(d, days) {
      var out = new Date(d.getTime());
      out.setDate(out.getDate() + days);
      return out;
    }

    function addCalendarMonthsLocal(d, months) {
      var out = new Date(d.getTime());
      out.setMonth(out.getMonth() + months);
      return out;
    }

    function formatDateYMD(d) {
      if (!d || isNaN(d.getTime())) return null;
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    function getRecommendedDateForVisitNumber(lmpStr, targetVisitNumber) {
      var lmp = parseDateOnlyLocal(lmpStr);
      if (!lmp || targetVisitNumber < 1 || targetVisitNumber > 8) return null;
      switch (targetVisitNumber) {
        case 1: return null;
        case 2: return formatDateYMD(addCalendarMonthsLocal(lmp, 5));
        case 3: return formatDateYMD(addCalendarMonthsLocal(lmp, 6));
        case 4: return formatDateYMD(addCalendarMonthsLocal(lmp, 7));
        case 5: return formatDateYMD(addCalendarMonthsLocal(lmp, 8));
        case 6: return formatDateYMD(addDaysLocal(addCalendarMonthsLocal(lmp, 8), 14));
        case 7: return formatDateYMD(addCalendarMonthsLocal(lmp, 9));
        case 8: return formatDateYMD(addDaysLocal(addCalendarMonthsLocal(lmp, 9), 14));
        default: return null;
      }
    }

    function countCompletedAncVisits(visits) {
      var maxNum = 0;
      (visits || []).forEach(function (v) {
        var data = v.data || v;
        var n = parseInt(data.visitNumber, 10);
        if (!isNaN(n) && n > maxNum) maxNum = n;
      });
      if (maxNum > 0) return Math.min(maxNum, 8);
      return Math.min((visits || []).length, 8);
    }

    function isKnownLmpValue(lmp) {
      return !!(lmp && lmp !== 'unknown' && lmp !== 'Unknown' && lmp !== 'Not recorded');
    }

    function getEffectiveLmp(row) {
      var patient = row.patient || {};
      if (isKnownLmpValue(patient.lmp)) return patient.lmp;
      var earliest = null;
      var earliestNum = 999;
      var any = null;
      (row.visits || []).forEach(function (v) {
        var data = v.data || v;
        if (!isKnownLmpValue(data.lmp) || data.lmpStatus === 'unknown') return;
        any = data.lmp;
        var n = parseInt(data.visitNumber, 10);
        if (isNaN(n)) n = 999;
        if (n < earliestNum) {
          earliestNum = n;
          earliest = data.lmp;
        }
      });
      return earliest || any || null;
    }

    function getNextAncVisitNumber(row) {
      return Math.min((row.ancVisitCount || 0) + 1, 8);
    }

    function getFollowUpGraceDays(row) {
      return getNextAncVisitNumber(row) >= 5 ? 14 : 30;
    }

    function getNextVisitDueDate(row) {
      if (row && row._projection) return parseDateOnlyLocal(row.dueDate);
      var latest = row.latestAnc;
      if (latest && (latest.nextVisitDate || latest.next_visit_date)) {
        var parsed = parseDateOnlyLocal(latest.nextVisitDate || latest.next_visit_date);
        if (parsed) return parsed;
      }
      var completed = row.ancVisitCount || 0;
      var nextVisitNum = completed + 1;
      if (nextVisitNum > 8) return null;
      var lmp = getEffectiveLmp(row);
      if (lmp) {
        var recommended = getRecommendedDateForVisitNumber(lmp, nextVisitNum);
        return recommended ? parseDateOnlyLocal(recommended) : null;
      }
      return null;
    }

    function getDaysLateForNextVisit(row) {
      if (isCompleted(row)) return 0;
      if (row && row._projection) return row.daysLate;
      var due = getNextVisitDueDate(row);
      if (!due) return null;
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      return Math.floor((today.getTime() - due.getTime()) / 86400000);
    }

    function getCompleteAction(row) {
      if (!row.actions || !row.actions.length) return null;
      for (var i = 0; i < row.actions.length; i++) {
        var a = row.actions[i];
        if (a && a.type === 'resolved' && (
          a.resolvedReason === 'completed' ||
          a.resolvedReason === 'delivered_safely' ||
          a.resolvedReason === 'death' ||
          a.resolvedReason === 'transferred' ||
          a.outcome === 'alive' ||
          a.outcome === 'death' ||
          a.outcome === 'transfer'
        )) {
          return a;
        }
      }
      return null;
    }

    function isCompleted(row) {
      if (row && row._projection) return row.status === 'complete';
      return !!getCompleteAction(row);
    }

    function rowTrackingStatus(row) {
      if (row && row._projection) {
        var projectionLabels = {
          on_track: 'statusOnTrack',
          overdue_followup: 'statusOverdueFollowup',
          lost_to_followup: 'statusLostToFollowup',
          complete: 'statusComplete'
        };
        return { key: row.status || 'on_track', label: tr(projectionLabels[row.status] || 'statusOnTrack') };
      }
      var completeAction = getCompleteAction(row);
      if (completeAction) {
        return { key: 'complete', label: tr('statusComplete') };
      }
      var daysLate = getDaysLateForNextVisit(row);
      if (daysLate == null || daysLate < 0) return { key: 'on_track', label: tr('statusOnTrack') };
      if (daysLate <= getFollowUpGraceDays(row)) return { key: 'overdue_followup', label: tr('statusOverdueFollowup') };
      return { key: 'lost_to_followup', label: tr('statusLostToFollowup') };
    }

    function rowPatientOutcome(row) {
      if (row && row._projection && row.outcome) {
        if (row.outcome === 'death') return { key: 'death', label: tr('outcomeDead') };
        if (row.outcome === 'transfer') return { key: 'transfer', label: tr('outcomeTransfer') };
        return { key: 'alive', label: tr('outcomeAlive') };
      }
      var completeAction = getCompleteAction(row);
      if (!completeAction) return null;
      var outcome = completeAction.outcome || completeAction.resolvedReason;
      if (outcome === 'death' || completeAction.resolvedReason === 'death') return { key: 'death', label: tr('outcomeDead') };
      if (outcome === 'transfer' || completeAction.resolvedReason === 'transferred') return { key: 'transfer', label: tr('outcomeTransfer') };
      return { key: 'alive', label: tr('outcomeAlive') };
    }

    function statusTrackHtml(completedCount, row) {

      for (var i = 1; i <= 8; i++) {
        var cls = '';
        if (i <= completedCount) cls = 'visited' + (completedOutcomeClass ? ' ' + completedOutcomeClass : '');
        else if (i === nextVisit && completedCount < 8) {
          cls = status.key === 'overdue_followup' || status.key === 'lost_to_followup' ? status.key : 'next';
        }
        dots.push('<span class="hrt-track-dot ' + cls + '">' + i + '</span>');

    function showHrtVisitStatusDetails(patientId) {
      var row = (window._hrtRows || []).find(function (r) { return (r.patient || {}).id === patientId; });

    function getFilteredHrtRows() {
      if (!window._hrtRows) return [];
      var q = (window._hrtFilterQuery || '').trim().toLowerCase();
      var statusFilter = (_hrtCardFilter || window._hrtStatusFilter || 'all').trim();
      return window._hrtRows.filter(function(r) {
        var p = r.patient || {};
        var name = (p.name || p.patientName || '').toLowerCase();
        var reg = String(formatRegisterNo(p)).toLowerCase();
        var phone = [
          patientPhoneValue(p),
          emergencyPhoneValue(p),
          chwPhoneValue(p)
        ].join(' ').toLowerCase();
        if (q && name.indexOf(q) === -1 && reg.indexOf(q) === -1 && phone.indexOf(q) === -1) return false;
        if (statusFilter !== 'all') {
          var status = rowTrackingStatus(r);
          if (statusFilter === 'complete') {
            if (status.key !== 'complete') return false;
          } else if (status.key !== statusFilter) return false;
        } else if (isCompleted(r)) {
          return false;
        }
        return true;
      });
    }

    function filterHrtRows() {
      var input = document.getElementById('hrtSearchInput');
      window._hrtFilterQuery = input ? input.value : '';
      renderAll(getFilteredHrtRows());

    function updateDashboardStats(allRows) {
      var rows = allRows || [];
      var onTrack = 0;
      var overdue = 0;
      var lost = 0;
      var completed = 0;
      var alive = 0;
      var death = 0;
      var transfer = 0;
      var current = 0;
      rows.forEach(function(r) {
        if (isCompleted(r)) {
          completed++;
          var outcome = rowPatientOutcome(r);
          if (outcome && outcome.key === 'death') death++;
          else if (outcome && outcome.key === 'transfer') transfer++;
          else alive++;
          return;
        }
        current++;
        var status = rowTrackingStatus(r);
        if (status.key === 'on_track') onTrack++;
        else if (status.key === 'overdue_followup') overdue++;
        else if (status.key === 'lost_to_followup') lost++;
      });
      document.getElementById('statTotalHr').textContent = current;
      document.getElementById('statActiveHr').textContent = onTrack;
      document.getElementById('statOverdueHr').textContent = overdue;
      document.getElementById('statDefaultedHr').textContent = lost;
      document.getElementById('statCompletedHr').textContent = completed;
      var breakdownEl = document.getElementById('statCompletedBreakdown');
      if (breakdownEl) {
        breakdownEl.innerHTML =
          escapeHtml(tr('outcomeAlive')) + ': <strong>' + alive + '</strong> · ' +
          escapeHtml(tr('outcomeDead')) + ': <strong>' + death + '</strong> · ' +
          escapeHtml(tr('outcomeTransfer')) + ': <strong>' + transfer + '</strong>';
      }

      try {
        sessionStorage.setItem('hrtActiveFollowUpCount', String(onTrack + overdue + lost));
        sessionStorage.setItem('hrtActiveFollowUpCountAt', String(Date.now()));
      } catch (e) { /* ignore */ }
    }

    function openCompleteModal(patientId) {
      _currentActionPatientId = patientId;
      document.getElementById('actionNote').value = '';
      document.getElementById('completionReasonSelect').value = 'delivered_safely';
      document.getElementById('maternalOutcomeSelect').value = 'alive';
      document.getElementById('newbornOutcomeSelect').value = 'alive';
      updateHrtCompletionFields();
      var modal = new bootstrap.Modal(document.getElementById('actionModal'));
      modal.show();
    }

    function updateHrtCompletionFields() {
      var reason = document.getElementById('completionReasonSelect').value;
      var clinicalOutcome = reason === 'delivered_safely' || reason === 'death' || reason === 'abortion';
      document.getElementById('maternalOutcomeGroup').classList.toggle('d-none', !clinicalOutcome);
      document.getElementById('newbornOutcomeGroup').classList.toggle('d-none', !clinicalOutcome);
      if (reason === 'death') document.getElementById('maternalOutcomeSelect').value = 'death';
      if (reason === 'abortion') document.getElementById('newbornOutcomeSelect').value = 'not_applicable';
    }

    async function saveAction() {
      if (!_currentActionPatientId || !_currentUser) return;
      var btn = document.getElementById('btnSaveAction');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>';

      var completionReason = document.getElementById('completionReasonSelect').value;
      var includeClinicalOutcomes = completionReason === 'delivered_safely' ||
        completionReason === 'death' || completionReason === 'abortion';
      var outcome = completionReason === 'transferred' ? 'transfer' :
        (completionReason === 'death' ? 'death' : 'alive');
      var db = firebase.firestore();
      var data = {
        type: 'resolved',
        completionReason: completionReason,
        // Keep legacy readers working while structured completion rolls out.
        resolvedReason: 'completed',
        outcome: outcome,
        recordedBy: _currentUser.uid,
        recordedByName: _currentUserName,
        recordedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      if (includeClinicalOutcomes) {
        data.maternalOutcome = document.getElementById('maternalOutcomeSelect').value;
        data.newbornOutcome = document.getElementById('newbornOutcomeSelect').value;
      }
      var note = document.getElementById('actionNote').value.trim();
      if (note) data.note = note;

      try {
        await db.collection('patients').doc(_currentActionPatientId).collection('hrt_actions').add(data);
        if (window.AnalyticsRefreshQueue) {
          await AnalyticsRefreshQueue.requestSafely(_currentActionPatientId, 'hrt_action');
        }
        var modal = bootstrap.Modal.getInstance(document.getElementById('actionModal'));
        if (modal) modal.hide();
        var projectionRow = (window._hrtRows || []).find(function (row) {
          return row._projection && row.patientId === _currentActionPatientId;
        });
        if (projectionRow) {
          projectionRow.status = 'complete';
          projectionRow.explicitCompletion = true;
          projectionRow.completionSource = 'clinical_action';
          projectionRow.completionReason = completionReason;
          projectionRow.outcome = outcome;
          projectionRow.actions = [data];
        } else {
          await refreshActions(_currentActionPatientId);
        }
        renderAll(getFilteredHrtRows());
      } catch (err) {
        console.error('Save action failed', err);
        alert((err && err.message) || 'Failed to save action');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save me-1"></i><span class="action-btn-save">' + escapeHtml(tr('save')) + '</span>';
      }
    }

    async function refreshActions(patientId) {
      if (!window._hrtRows) return;
      var db = firebase.firestore();
      for (var i = 0; i < window._hrtRows.length; i++) {
        if (window._hrtRows[i].patient.id === patientId) {
          window._hrtRows[i].actions = await fetchHrtActions(db, patientId);
          break;
        }
      }
    }

    async function fetchHrtActions(db, patientId) {
      try {
        var snap = await db.collection('patients').doc(patientId).collection('hrt_actions')
          .orderBy('recordedAt', 'desc').limit(5).get();
        var list = [];
        if (snap && snap.docs) {
          snap.docs.forEach(function(d) { list.push(d.data() || {}); });
        }
        return list;
      } catch (e) {
        console.warn('fetchHrtActions', patientId, e);
        return [];
      }
    }

    /* Data fetching (same RBAC as before) */
    async function fetchPatientsForRole(db, currentUser, userRole) {
      var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
      var query = db.collection('patients');
      var allPatients = [];

      if (userRole === 'Midwife' || userRole === 'midwife' || !userRole) {
        var patientMap = new Map();
        var newSnap = await smartFirestoreQuery(
          Promise.resolve(db.collection('patients').where('created_by', '==', currentUser.uid)),
          { preferCache: isIOS, timeout: 10000, retries: 2, fallbackToCache: true }
        );
        var oldSnap = await smartFirestoreQuery(
          Promise.resolve(db.collection('patients').where('createdBy', '==', currentUser.uid)),
          { preferCache: isIOS, timeout: 10000, retries: 2, fallbackToCache: true }
        );
        var sharedSnap = await smartFirestoreQuery(
          Promise.resolve(db.collection('patients').where('care_team_midwife_ids', 'array-contains', currentUser.uid)),
          { preferCache: isIOS, timeout: 10000, retries: 2, fallbackToCache: true }
        );
        [newSnap, oldSnap, sharedSnap].forEach(function (snap) {
          if (snap && typeof snap.forEach === 'function' && !snap.empty) {
            snap.forEach(function (doc) {
              if (doc && doc.id && doc.data && !patientMap.has(doc.id)) {
                patientMap.set(doc.id, { id: doc.id, ...doc.data() });
              }
            });
          }
        });
        allPatients = Array.from(patientMap.values());
      } else if (userRole === 'Regional Officer' || isRegionalOfficerRole(userRole)) {
        var uDoc = await smartFirestoreQuery(
          Promise.resolve(db.collection('users').doc(currentUser.uid)),
          { preferCache: isIOS, timeout: 5000, retries: 1, fallbackToCache: true }
        );
        if (uDoc && uDoc.exists) {
          var reg = uDoc.data().region;
          if (reg) {
            var rs = await smartFirestoreQuery(
              Promise.resolve(query.where('region', '==', reg)),
              { preferCache: isIOS, timeout: 10000, retries: 2, fallbackToCache: true }
            );
            if (rs && typeof rs.forEach === 'function' && !rs.empty) {
              rs.forEach(function (doc) {
                if (doc && doc.id && doc.data) allPatients.push({ id: doc.id, ...doc.data() });
              });
            }
          }
        }
      } else if (isTmoRole(userRole)) {
        var uDoc2 = await smartFirestoreQuery(
          Promise.resolve(db.collection('users').doc(currentUser.uid)),
          { preferCache: isIOS, timeout: 5000, retries: 1, fallbackToCache: true }
        );
        if (uDoc2 && uDoc2.exists) {
          var tw = uDoc2.data().township;
          if (tw) {
            var ts = await smartFirestoreQuery(
              Promise.resolve(query.where('township', '==', tw)),
              { preferCache: isIOS, timeout: 10000, retries: 2, fallbackToCache: true }
            );
            if (ts && typeof ts.forEach === 'function' && !ts.empty) {
              ts.forEach(function (doc) {
                if (doc && doc.id && doc.data) allPatients.push({ id: doc.id, ...doc.data() });
              });
            }
          }
        }
      } else if (userRole === 'Super Admin' || userRole === 'admin') {
        var snapshot = await smartFirestoreQuery(
          Promise.resolve(query),
          { preferCache: isIOS, timeout: 10000, retries: 2, fallbackToCache: true }
        );
        if (snapshot && typeof snapshot.forEach === 'function' && !snapshot.empty) {
          snapshot.forEach(function (doc) {
            if (doc && doc.id && doc.data) allPatients.push({ id: doc.id, ...doc.data() });
          });
        }
      }
      return allPatients;
    }

    async function fetchAllAncVisitsForPatient(db, patientId) {
      var ref = db.collection('patients').doc(patientId).collection('antenatal_visits');
      var snap;
      try { snap = await ref.orderBy('visitDate', 'desc').limit(20).get(); }
      catch (e) {
        try { snap = await ref.orderBy('timestamp', 'desc').limit(20).get(); }
        catch (e2) { snap = await ref.limit(20).get(); }
      }
      var visits = [];
      if (snap && snap.docs) snap.docs.forEach(function(d) { visits.push({ id: d.id, data: d.data() || {} }); });
      return visits;
    }

    async function mapWithConcurrency(items, limit, fn) {
      var out = [];
      for (var i = 0; i < items.length; i += limit) {
        var batch = items.slice(i, i + limit);
        var part = await Promise.all(batch.map(fn));
        out.push.apply(out, part);
      }
      return out;
    }

    function applyAgeToHrtRow(row, age) {
      if (age == null || !row) return row;
      row.patientAge = age;
      row.age = age;
      if (row.patient) {
        row.patient.age = age;
        if (row.patient._trackingProjection) row.patient._trackingProjection.patientAge = age;
      }
      return row;
    }

    async function hydrateHrtPatientAges(rows) {
      var db = firebase.firestore();
      var missing = [];
      (rows || []).forEach(function (row) {
        var id = (row.patient && row.patient.id) || row.patientId || row.rowId || row.id;
        var existing = parseStoredAge(row.patient && row.patient.age) ||
          parseStoredAge(row.patientAge) ||
          parseStoredAge(row.age) ||
          parseStoredAge(_hrtAgeByPatientId[id]);
        if (existing != null) {
          if (id) _hrtAgeByPatientId[id] = existing;
          applyAgeToHrtRow(row, existing);
          return;
        }
        if (id) missing.push({ row: row, id: id });
      });
      if (!missing.length) return rows;
      await mapWithConcurrency(missing, CONCURRENCY, async function (item) {
        try {
          var snap = await db.collection('patients').doc(item.id).get();
          if (!snap.exists) return;
          var data = snap.data() || {};
          var age = parseStoredAge(data.age) || parseStoredAge(data.Age) ||
            parseStoredAge(data.patientAge);
          if (age == null) return;
          _hrtAgeByPatientId[item.id] = age;
          applyAgeToHrtRow(item.row, age);
        } catch (error) {
          console.warn('HRT age load', item.id, error);
        }
      });
      return rows;
    }

    function projectionHrtRow(row) {
      var patientId = row.patientId || row.rowId || row.id;
      var patient = {
        id: patientId,
        name: row.patientName,
        patientName: row.patientName,
        patient_id: row.patientCode,
        phone: row.patientPhone,
        age: parseStoredAge(row.patientAge) || parseStoredAge(row.age) ||
          parseStoredAge(_hrtAgeByPatientId[patientId]),
        infectionFlags: row.infectionFlags || {},
        _trackingProjection: row
      };
      return Object.assign({}, row, {
        _projection: true,
        patient: patient,
        factorsUnique: row.riskFactors || [],
        ancVisitCount: row.visitCount || 0,
        daysSince: row.daysLate,
        latestAnc: null,
        actions: row.status === 'complete' ? [{
          type: 'resolved',
          resolvedReason: row.completionReason || 'completed',
          outcome: row.outcome
        }] : []
      });
    }

    function setHrtPageState(state, message) {
      document.getElementById('loadingState').classList.toggle('d-none', state !== 'loading');
      document.getElementById('emptyState').classList.toggle('d-none', state !== 'empty' && state !== 'error');
      document.getElementById('dashboardState').classList.toggle('d-none', state === 'loading' || state === 'error');
      document.getElementById('tableState').classList.toggle('d-none', state === 'loading' || state === 'error' || state === 'empty');
      if (message) document.querySelector('.hrt-empty').textContent = message;
    }

    async function loadHrtProjectionPage(append) {
      if (_hrtLoadingPage && append) return;
      _hrtLoadingPage = true;
      _hrtPageError = '';
      if (!append) setHrtPageState('loading');
      else renderAll(getFilteredHrtRows());
      try {
        var result = await TrackingReader.call(
          'queryHrtTracking',
          TrackingReader.payload(_hrtFilters, append ? _hrtNextPageToken : null)
        );
        if (result.schemaVersion !== 'tracking-hrt-v1' || !Array.isArray(result.rows)) {
          throw new Error('Unexpected HRT tracking response.');
        }
        var mapped = result.rows.map(projectionHrtRow);
        window._hrtRows = append ? (window._hrtRows || []).concat(mapped) : mapped;
        _hrtNextPageToken = result.nextPageToken || null;
        if (!append) {
          _hrtCardFilter = 'all';
          window._hrtStatusFilter = 'all';
        }
        setHrtPageState(window._hrtRows.length ? 'ready' : 'empty');
        renderAll(getFilteredHrtRows());
        await hydrateHrtPatientAges(mapped);
        renderAll(getFilteredHrtRows());
      } catch (error) {
        var message = (error && error.message) || 'Unable to load tracking data.';
        if (!append) setHrtPageState('error', message);
        else _hrtPageError = message;
        if (append) return;
        throw error;
      } finally {
        _hrtLoadingPage = false;
        if (window._hrtRows && window._hrtRows.length) renderAll(getFilteredHrtRows());
      }
    }

    async function loadAllHrtProjections() {
      var loadId = ++_hrtLoadId;
      await loadHrtProjectionPage(false);
      fillRemainingHrtPages(loadId);
    }

    function fillRemainingHrtPages(loadId) {
      (async function () {
        try {
          while (_hrtNextPageToken && !_hrtPageError && loadId === _hrtLoadId) {
            await loadHrtProjectionPage(true);
          }
        } catch (error) {
          if (loadId === _hrtLoadId) {
            _hrtPageError = (error && error.message) || 'Unable to load remaining patients.';
            renderAll(getFilteredHrtRows());
          }
        }
      })();
    }

    async function initializeHrtProjection(userData) {
      if (!window.TrackingReader || !TrackingReader.enabled()) return false;
      var controls = TrackingReader.createControls({
        kind: 'hrt',
        role: userData && userData.role,
        userData: userData || {},
        onApply: async function (filters) {
          _hrtFilters = filters;
          TrackingReader.restoreUrl(filters);
          try { await loadAllHrtProjections(); }
          catch (error) { console.error('HRT projection reload', error); }
        },
        onReset: function () { location.href = location.pathname; }
      });
      _hrtRoleLevel = controls.level;
      _hrtFilters = controls.filters;
      TrackingReader.restoreUrl(_hrtFilters);
      window._hrtRows = [];
      window._hrtFilterQuery = '';
      await loadAllHrtProjections();
      return true;
    }

    /* Main load */
    firebase.auth().onAuthStateChanged(async function (user) {
      if (!user) { window.location.href = 'login.html'; return; }
      _currentUser = user;
      applyStaticI18n();

      var offline = window.OfflineManager && window.OfflineManager.isOfflineMode();
      if (offline) {
        document.getElementById('offlineBanner').textContent = tr('offline');
        document.getElementById('offlineBanner').classList.remove('d-none');
        document.getElementById('loadingState').classList.add('d-none');
        document.getElementById('emptyState').classList.remove('d-none');
        return;
      }

      var db = firebase.firestore();
      var userRole = 'Midwife';
      var userData = null;
      try {
        userData = window.UserCache ? await window.UserCache.get(user.uid) : null;
        if (!userData) {
          var uq = await smartFirestoreQuery(
            Promise.resolve(db.collection('users').doc(user.uid)),
            { preferCache: /iPhone|iPad|iPod/.test(navigator.userAgent), timeout: 8000, retries: 2, fallbackToCache: true }
          );
          userData = uq && uq.exists ? uq.data() : null;
        }
        if (userData && userData.role) userRole = userData.role;
        if (userData && userData.name) _currentUserName = userData.name;
        else if (user.displayName) _currentUserName = user.displayName;
      } catch (e) {
        console.warn('HRT role load', e);
      }

      try {
        try {
          if (await initializeHrtProjection(userData || { role: userRole })) return;
        } catch (projectionError) {
          if (!TrackingReader.shouldFallback(projectionError)) throw projectionError;
          console.warn('HRT projection unavailable; using temporary legacy reader.', projectionError);
          var filterForm = document.getElementById('hrtTrackingFilters');
          if (filterForm) filterForm.remove();
        }
        var patients = await fetchPatientsForRole(db, user, userRole);

        var enriched = await mapWithConcurrency(patients, CONCURRENCY, async function (p) {
          var visits = await fetchAllAncVisitsForPatient(db, p.id);
          var bundle = { antenatalVisits: visits };
          if (!window.HighRiskUtils || !window.HighRiskUtils.isPatientHighRisk(bundle)) return null;

          var actions = [];
          try {
            actions = await fetchHrtActions(db, p.id);
          } catch (e) {
            console.warn('HRT actions fetch', p.id, e);
          }

          var factors = window.HighRiskUtils.getPatientRiskFactorsFromANC(bundle);
          var factorsUnique = uniqueStrings(factors);
          var lastMs = window.HighRiskUtils.getLatestAncVisitTimeMs(bundle);
          var latestAnc = window.HighRiskUtils.getLatestAncVisitData(bundle);
          var daysSince = null;
          if (lastMs != null) daysSince = Math.floor((Date.now() - lastMs) / 86400000);
          var ancVisitCount = countCompletedAncVisits(visits);

          return {
            patient: p,
            factorsUnique: factorsUnique,
            daysSince: daysSince,
            actions: actions,
            latestAnc: latestAnc || null,
            ancVisitCount: ancVisitCount,
            latestAncVisitDate: latestAnc ? (latestAnc.visitDate || latestAnc.visit_date || latestAnc.timestamp || latestAnc.createdAt || latestAnc.created_at || null) : null
          };
        });

        var rows = enriched.filter(Boolean);
        rows.sort(function (a, b) {
          var aDone = isCompleted(a), bDone = isCompleted(b);
          if (aDone !== bDone) return aDone ? 1 : -1;
          var lateA = getDaysLateForNextVisit(a);
          var lateB = getDaysLateForNextVisit(b);
          if (lateA !== lateB) return lateB - lateA;
          var da = a.daysSince, db_ = b.daysSince;
          if (da == null && db_ == null) return 0;
          if (da == null) return 1;
          if (db_ == null) return -1;
          return db_ - da;
        });

        window._hrtRows = rows;
        window._hrtFilterQuery = '';
        _hrtCardFilter = 'all';
        window._hrtStatusFilter = 'all';

        document.getElementById('loadingState').classList.add('d-none');
        if (rows.length === 0) {
          try {
            sessionStorage.setItem('hrtActiveFollowUpCount', '0');
            sessionStorage.setItem('hrtActiveFollowUpCountAt', String(Date.now()));
          } catch (e) { /* ignore */ }
          document.getElementById('emptyState').classList.remove('d-none');
        } else {
          document.getElementById('dashboardState').classList.remove('d-none');
          document.getElementById('tableState').classList.remove('d-none');
          renderAll(getFilteredHrtRows());
        }
      } catch (err) {
        console.error(err);
        document.getElementById('loadingState').classList.add('d-none');
        document.getElementById('emptyState').classList.remove('d-none');
        document.querySelector('.hrt-empty').textContent = (err && err.message) || String(err);
      }
    });
  </script>
</body>
</html>
