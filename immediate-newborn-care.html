<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Essential Newborn Care - Maternal & Child Health Care System</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="css/vendor/fontawesome-all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/vendor/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/patient-session.js"></script>
  <script src="js/session-manager.js"></script>
  <style>
    :root {
      --primary-color: #10b981;
      --secondary-color: #059669;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --card-hover-shadow: 0 16px 32px rgba(15, 23, 42, 0.12);
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Inter', 'Myanmar Text', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header-section {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 1.25rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .header-section .container, .hub-main-container { max-width: 760px; }
    .header-section h1 { font-size: 1.45rem; font-weight: 800; margin: 0; line-height: 1.25; }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .hub-main-container {
      flex: 1;
      width: 100%;
      padding: 1.25rem 1rem 2rem;
    }

    #patientBanner > div {
      border-radius: 16px !important;
      margin-bottom: 1rem !important;
      padding: 0.9rem 1rem !important;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.12) !important;
    }

    .care-modules {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.85rem;
    }

    .module-card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 16px;
      padding: 1rem 1.1rem;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
      transition: all 0.3s ease;
      cursor: pointer;
      border: 1px solid rgba(16, 185, 129, 0.15);
      border-left: 5px solid var(--primary-color);
      display: flex;
      align-items: center;
      gap: 1rem;
      min-height: 92px;
    }

    .module-card:hover { transform: translateY(-2px); box-shadow: var(--card-hover-shadow); }

    .module-icon {
      width: 48px; height: 48px; border-radius: 14px; background: #d1fae5;
      display: inline-flex; align-items: center; justify-content: center;
      flex: 0 0 48px; font-size: 1.35rem; color: var(--primary-color);
    }

    .module-title { font-size: 1.05rem; font-weight: 800; color: #111827; margin-bottom: 0.2rem; }
    .module-description { color: #6b7280; font-size: 0.9rem; margin: 0; line-height: 1.45; }
    .module-content { flex: 1; min-width: 0; }
    .module-arrow { color: #94a3b8; }

    .footer {
      background: rgba(255, 255, 255, 0.95);
      color: #374151;
      text-align: center;
      padding: 1.25rem;
      margin-top: auto;
      border-radius: 20px 20px 0 0;
    }

    .language-switcher { display: flex; gap: 0.25rem; }
    .language-btn {
      padding: 0.375rem 0.75rem; font-size: 0.875rem; border-radius: 8px;
      background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white;
    }
    .language-btn.active { background: rgba(255,255,255,0.4); font-weight: 600; }

    @media (max-width: 768px) {
      .header-section h1 { font-size: 1.2rem; }
      .header-actions .btn-outline-light { flex: 1 1 0; }
    }
  </style>
</head>
<body>
  <div class="header-section">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6">
          <h1><i class="fas fa-baby me-3"></i><span class="lang-text" data-en="Essential Newborn Care" data-mm="မွေးကင်းစကလေး စောင့်ရှောက်မှု">Essential Newborn Care</span></h1>
        </div>
        <div class="col-md-6">
          <div class="header-actions">
            <div class="language-switcher">
              <button type="button" class="btn btn-sm language-btn" data-lang="en"><span>🇬🇧</span> ENG</button>
              <button type="button" class="btn btn-sm language-btn active" data-lang="mm"><span>🇲🇲</span> MM</button>
            </div>
            <a href="#" class="btn btn-outline-light btn-sm" onclick="goBackToHub(); return false;">
              <i class="fas fa-arrow-left me-2"></i><span class="lang-text" data-en="Back to Hub" data-mm="ပြန်သွားရန်">Back to Hub</span>
            </a>
            <button class="btn btn-outline-light btn-sm" onclick="firebase.auth().signOut(); localStorage.clear(); sessionStorage.clear(); window.location='login.html';">
              <i class="fas fa-sign-out-alt me-2"></i><span class="lang-text" data-en="Logout" data-mm="ထွက်ရန်">Logout</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <main class="container hub-main-container">
    <div id="patientBanner"></div>
    <div class="care-modules">
      <div class="module-card" onclick="navigateToImmediateNewbornCare()">
        <div class="module-icon"><i class="fas fa-baby"></i></div>
        <div class="module-content">
          <div class="module-title lang-text" data-en="Immediate Newborn Care" data-mm="မွေးပြီးပြီးချင်း ကလေးစောင့်ရှောက်မှု">Immediate Newborn Care</div>
          <div class="module-description lang-text" data-en="Record immediate care procedures right after birth." data-mm="မွေးဖွားပြီးချင်း ချက်ချင်း လုပ်ဆောင်ရမည့် စောင့်ရှောက်မှုများကို မှတ်တမ်းတင်ရန်">Record immediate care procedures right after birth.</div>
        </div>
        <i class="fas fa-chevron-right module-arrow"></i>
      </div>
      <div class="module-card" onclick="navigateToNewbornCarePage()">
        <div class="module-icon"><i class="fas fa-clipboard-list"></i></div>
        <div class="module-content">
          <div class="module-title lang-text" data-en="Newborn Care" data-mm="မွေးကင်းစကလေး စောင့်ရှောက်မှု">Newborn Care</div>
          <div class="module-description lang-text" data-en="Comprehensive newborn assessment and follow-up records." data-mm="မွေးကင်းစကလေး စစ်ဆေးမှုနှင့် နောက်ဆက်တွဲ မှတ်တမ်းများ">Comprehensive newborn assessment and follow-up records.</div>
        </div>
        <i class="fas fa-chevron-right module-arrow"></i>
      </div>
      <div class="module-card" onclick="navigateToNewbornReport()">
        <div class="module-icon"><i class="fas fa-file-medical-alt"></i></div>
        <div class="module-content">
          <div class="module-title lang-text" data-en="Newborn Report" data-mm="ကလေး စောင့်ရှောက်မှု အစီရင်ခံစာ">Newborn Report</div>
          <div class="module-description lang-text" data-en="Review and print the newborn care summary." data-mm="ကလေးစောင့်ရှောက်မှု အကျဉ်းချုပ်ကို ကြည့်ရှု/ထုတ်ယူရန်">Review and print the newborn care summary.</div>
        </div>
        <i class="fas fa-chevron-right module-arrow"></i>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p class="mb-0"><i class="fas fa-heart me-2"></i>MNCH App 2025 | Developed by Jhpiego Myanmar for MoH.</p>
  </footer>

  <script>
    let currentLanguage = localStorage.getItem('appLanguage') || 'mm';

    function switchLanguage(lang) {
      currentLanguage = lang;
      localStorage.setItem('appLanguage', lang);
      document.querySelectorAll('.language-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      document.querySelectorAll('.lang-text').forEach(function (el) {
        el.textContent = el.dataset[lang] || el.dataset.en || el.textContent;
      });
    }

    function hubT(en, mm) { return currentLanguage === 'en' ? en : mm; }

    function getPatientId() {
      return sessionStorage.getItem('selectedPatientId');
    }

    function goBackToHub() {
      var patientId = getPatientId();
      window.location.href = patientId ? 'patient-care-hub.html?patient=' + patientId : 'patient-care-hub.html';
    }

    function navigateToImmediateNewbornCare() {
      var patientId = getPatientId();
      if (!patientId) { alert(hubT('No patient selected.', 'လူနာ မရွေးချယ်ရသေးပါ။')); window.location.href = 'list.html'; return; }
      window.location.href = 'immediate-newborn-care-form.html?patient=' + patientId;
    }

    function navigateToNewbornCarePage() {
      var patientId = getPatientId();
      if (!patientId) { alert(hubT('No patient selected.', 'လူနာ မရွေးချယ်ရသေးပါ။')); window.location.href = 'list.html'; return; }
      window.location.href = 'newborn-care-page.html?patient=' + patientId;
    }

    function navigateToNewbornReport() {
      var patientId = getPatientId();
      if (!patientId) { alert(hubT('No patient selected.', 'လူနာ မရွေးချယ်ရသေးပါ။')); window.location.href = 'list.html'; return; }
      if (typeof navigator !== 'undefined' && navigator.onLine === false) {
        alert(hubT('This report is available online only.', 'ဤအစီရင်ခံစာကို အင်တာနက်ရှိမှသာ ကြည့်ရှုနိုင်ပါသည်။'));
        return;
      }
      window.location.href = 'newborn-report.html?patient=' + patientId;
    }

    firebase.auth().onAuthStateChanged(async function (user) {
      user = window.resolvePilotAuthUser ? window.resolvePilotAuthUser(user) : user;
      if (!user) { window.location.href = 'login.html'; return; }
      var patientSession = initializePatientSession(true);
      if (patientSession) await displayPatientBanner('patientBanner');
    });

    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.language-btn').forEach(function (btn) {
        btn.addEventListener('click', function () { switchLanguage(btn.dataset.lang); });
      });
      switchLanguage(currentLanguage);
    });
  </script>
</body>
</html>
