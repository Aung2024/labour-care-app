<!DOCTYPE html>
<html lang="en">
<head>
  <title>Patient Transfer Record</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <style>
    :root {
      --primary-color: #10b981;
      --secondary-color: #059669;
      --accent-color: #34d399;
      --light-bg: #f0fdf4;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body {
      background: var(--light-bg);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header-section {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .transfer-form-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    
    
    .form-section {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      border: 1px solid #e5e7eb;
    }
    
    .form-section h3 {
      color: #374151;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #f59e0b;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .form-section h3 i {
      color: #f59e0b;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #374151;
    }
    
    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    
    .form-control:focus {
      outline: none;
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
    }
    
    .form-control:invalid {
      border-color: #ef4444;
    }
    
    .required-field::after {
      content: " *";
      color: #ef4444;
      font-weight: bold;
    }
    
    .action-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 30px;
      padding: 20px;
      background: #f9fafb;
      border-radius: 12px;
    }
    
    .btn-save-transfer {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }
    
    .btn-save-transfer:hover {
      background: linear-gradient(135deg, #d97706, #b45309);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    }
    
    .btn-back {
      background: #6b7280;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-back:hover {
      background: #4b5563;
      transform: translateY(-1px);
    }
    
    .success-message {
      display: none;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin: 20px 0;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }
    
    .success-message i {
      font-size: 2rem;
      margin-bottom: 10px;
      display: block;
    }
    
    .patient-info {
      background: #f3f4f6;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 25px;
      border-left: 4px solid #f59e0b;
    }
    
    .patient-info h4 {
      color: #374151;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .patient-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    
    .info-item {
      display: flex;
      flex-direction: column;
    }
    
    .info-label {
      font-size: 0.9rem;
      color: #6b7280;
      font-weight: 500;
      margin-bottom: 5px;
    }
    
    .info-value {
      font-weight: 600;
      color: #374151;
    }
    
    .transfer-reason-section {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .transfer-reason-section h4 {
      color: #92400e;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .reason-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    
    .reason-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid #f59e0b;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .reason-option:hover {
      background: #fef3c7;
      border-color: #d97706;
    }
    
    .reason-option input[type="radio"] {
      margin: 0;
    }
    
    .reason-option label {
      margin: 0;
      cursor: pointer;
      font-weight: 500;
    }

    /* Simplified Patient Info Card */
    .patient-info-simple {
      background: #f3f4f6;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 25px;
      border-left: 4px solid #10b981;
    }
    
    .patient-info-simple h4 {
      color: #374151;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
    }

    /* Collapse Icon Styling */
    .collapse-icon {
      transition: transform 0.3s ease;
      font-size: 0.8rem;
    }
    
    .collapsed .collapse-icon {
      transform: rotate(-90deg);
    }
    
    .btn-link {
      color: var(--primary-color);
      text-decoration: none;
    }
    
    .btn-link:hover {
      color: var(--secondary-color);
    }

    .footer {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      color: #374151;
      text-align: center;
      padding: 2rem;
      margin-top: 2rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    @media (max-width: 768px) {
      .header-section .d-flex {
        flex-wrap: wrap;
        justify-content: flex-start;
      }
      
      .header-section .btn-outline-light {
        order: 1;
      }
    }
  </style>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/status-manager.js"></script>
  <script src="js/session-manager.js"></script>
  <script src="js/audit-logger.js"></script>
  <script src="js/offline-manager.js"></script>
  <script src="js/register-sw.js"></script>
  <script src="js/lang-apply.js"></script>
</head>
<body>
  <!-- Header Section -->
  <div class="header-section">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center flex-wrap">
        <div>
          <h1 class="mb-2">
            <i class="fas fa-ambulance me-3"></i>
            <span class="lang-text" data-en="Patient Referral Record" data-mm="လူနာညွှန်းပို့သည့် မှတ်တမ်း">Patient Referral Record</span>
          </h1>
        </div>
        <div class="d-flex align-items-center gap-3">
          <a href="patient-care-hub.html" class="btn btn-outline-light btn-sm">
            <i class="fas fa-arrow-left me-2"></i><span class="lang-text" data-en="Back to Hub" data-mm="ပြန်သွားရန်">Back to Hub</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="main-container">
    <div class="transfer-form-container">

      <!-- Patient Information Display -->
      <div class="patient-info-simple">
        <h4><i class="fas fa-user-injured"></i> <span id="patientName">Loading...</span></h4>
      </div>

      <!-- Transfer Information Form -->
      <form id="transferForm" onsubmit="saveTransferRecord(event)">
        <!-- Referral Details Section -->
        <div class="form-section">
          <h3>
            <i class="fas fa-hospital"></i> <span class="lang-text" data-en="Referral Details" data-mm="လွှဲပြောင်းပေးပို့မှုအသေးစိတ်အချက်အလက်များ">Referral Details</span>
            <button class="btn btn-link p-0 ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#transferDetailsCollapse" aria-expanded="true" aria-controls="transferDetailsCollapse">
              <i class="fas fa-chevron-down collapse-icon"></i>
            </button>
          </h3>
          <div class="collapse show" id="transferDetailsCollapse">
          
          <div class="form-row">
            <div class="form-group">
              <label for="referralTime" class="required-field lang-text" data-en="Referral Time (Calendar)" data-mm="ညွှန်းပို့နေ့စွဲ">Referral Time (Calendar)</label>
              <input type="datetime-local" id="referralTime" name="referralTime" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="referralMode" class="lang-text" data-en="Referral Mode (Drop down)" data-mm="သွားရောက်ရန်အသုံးပြုသည့်ယာဉ်">Referral Mode (Drop down)</label>
              <select id="referralMode" name="referralMode" class="form-control">
                <option value="" data-en="Select referral mode" data-mm="ညွှန်းပို့ရန်အသုံးပြုသည့်ယာဉ်ကို ရွေးချယ်ပါ">Select referral mode</option>
                <option value="Ambulance" data-en="Ambulance" data-mm="ဆေးရုံကားဖြင့်">Ambulance</option>
                <option value="Private Vehicle" data-en="Private Vehicle" data-mm="ကိုယ်ပိုင်ယာဉ်">Private Vehicle</option>
                <option value="Public Transport" data-en="Public Transport" data-mm="အများပြည်သူသွားလာရေးယာဉ်">Public Transport</option>
                <option value="Other" data-en="Other" data-mm="အခြား">Other</option>
              </select>
            </div>
          </div>
          
            <div class="form-group">
            <label for="referralFacility" class="lang-text" data-en="Referral Facility (Type)" data-mm="လွှဲပြောင်းညွှန်းပို့မည့်ဆေးရုံ/ကျန်းမာရေးဌာနအမည်">Referral Facility (Type)</label>
            <input type="text" id="referralFacility" name="referralFacility" class="form-control" placeholder="Enter facility name">
          </div>
          
          <div class="form-group">
            <label for="mainSymptoms" class="lang-text" data-en="Main symptoms and duration (if the patient is pregnant, please also describe the obstetric history) (Type)" data-mm="အဓိကရောဂါလက္ခဏာများနှင့် ကြာမြင့်ချိန် (မွေးလူနာကိုယ်ဝန်ဆောင်ဖြစ်ပါက မွေးဖွားရာဇဝင်များပါ ဖော်ပြပါ။)">Main symptoms and duration (if the patient is pregnant, please also describe the obstetric history) (Type)</label>
            <textarea id="mainSymptoms" name="mainSymptoms" class="form-control" rows="4" placeholder="Describe main symptoms, duration, and obstetric history if applicable"></textarea>
          </div>
          
          <div class="form-group">
            <label for="treatmentBeforeReferral" class="lang-text" data-en="Treatment given before referral" data-mm="မလွှဲပြောင်းမီ ကုသပေးမှုများ">Treatment given before referral</label>
            <textarea id="treatmentBeforeReferral" name="treatmentBeforeReferral" class="form-control" rows="3" placeholder="Describe treatment provided before referral"></textarea>
          </div>
          
          <div class="form-group">
            <label for="medications" class="lang-text" data-en="Medications (Type)" data-mm="ဆေးဝါးများ">Medications (Type)</label>
            <textarea id="medications" name="medications" class="form-control" rows="3" placeholder="List medications given"></textarea>
          </div>
          </div>
        </div>


        <!-- Patient's Condition at Referral Section -->
        <div class="form-section">
          <h3>
            <i class="fas fa-heartbeat"></i> <span class="lang-text" data-en="Patient's condition at referral" data-mm="လွှဲပြောင်းစဉ် လူနာ၏အခြေအနေ">Patient's condition at referral</span>
            <button class="btn btn-link p-0 ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#patientConditionCollapse" aria-expanded="true" aria-controls="patientConditionCollapse">
              <i class="fas fa-chevron-down collapse-icon"></i>
            </button>
          </h3>
          <div class="collapse show" id="patientConditionCollapse">
          
          <div class="form-row">
            <div class="form-group">
              <label for="patientGeneralCondition" class="lang-text" data-en="Patient's General Condition (Drop down - Good, Fair, Poor, Serious)" data-mm="လူနာ၏အခြေအနေ (ကောင်း၊ ပျမ်းမျှ၊ မကောင်း၊ ပြင်းထန်)">Patient's General Condition (Drop down - Good, Fair, Poor, Serious)</label>
              <select id="patientGeneralCondition" name="patientGeneralCondition" class="form-control">
                <option value="" data-en="Select condition" data-mm="အခြေအနေကို ရွေးချယ်ပါ">Select condition</option>
                <option value="Good" data-en="Good" data-mm="ကောင်း">Good</option>
                <option value="Fair" data-en="Fair" data-mm="ပျမ်းမျှ">Fair</option>
                <option value="Poor" data-en="Poor" data-mm="မကောင်း">Poor</option>
                <option value="Serious" data-en="Serious" data-mm="ပြင်းထန်">Serious</option>
              </select>
            </div>
            <div class="form-group">
              <label for="vitalSigns" class="lang-text" data-en="Vital signs (BP, Pulse, Temperature)" data-mm="Vital signs (သွေးပေါင်ချိန်၊ သွေးခုန်နှုန်း၊ ကိုယ်အပူချိန်)">Vital signs (BP, Pulse, Temperature)</label>
              <input type="text" id="vitalSigns" name="vitalSigns" class="form-control" placeholder="e.g., BP: 120/80, Pulse: 72, Temp: 37.5°C">
            </div>
          </div>
          
            <div class="form-group">
            <label for="initial" class="lang-text" data-en="Initial" data-mm="လက်မှတ်">Initial</label>
            <input type="text" id="initial" name="initial" class="form-control" placeholder="Signature / Initials">
          </div>
          </div>
        </div>


        <!-- Action Buttons -->
        <div class="action-buttons">
          <button type="button" class="btn-back" onclick="goBack()">
            <i class="fas fa-arrow-left"></i> <span class="lang-text" data-en="Back" data-mm="ပြန်သွားရန်">Back</span>
          </button>
          <button type="submit" class="btn-save-transfer">
            <i class="fas fa-save"></i> <span class="lang-text" data-en="Save Referral Record" data-mm="ညွှန်းပို့မှတ်တမ်း သိမ်းဆည်းရန်">Save Referral Record</span>
          </button>
        </div>
      </form>

      <!-- Success Message -->
      <div id="successMessage" class="success-message">
        <i class="fas fa-check-circle"></i>
        <h4 class="lang-text" data-en="Referral Record Saved Successfully!" data-mm="ညွှန်းပို့မှတ်တမ်း သိမ်းဆည်းပြီးပါပြီ!">Referral Record Saved Successfully!</h4>
        <p class="lang-text" data-en="The patient referral information has been recorded. You can now view the complete referral record." data-mm="လူနာ ညွှန်းပို့မှု အချက်အလက်များကို မှတ်တမ်းတင်ပြီးပါပြီ။ ယခု ပြည့်စုံသော ညွှန်းပို့မှတ်တမ်းကို ကြည့်ရှုနိုင်ပါသည်။">The patient referral information has been recorded. You can now view the complete referral record.</p>
        <button class="btn btn-light mt-3" onclick="viewTransferRecord()">
          <i class="fas fa-eye"></i> <span class="lang-text" data-en="View Referral Record" data-mm="ညွှန်းပို့မှတ်တမ်းကို ကြည့်ရှုရန်">View Referral Record</span>
        </button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p class="mb-0">
        <i class="fas fa-heart me-2"></i>
        MNCH App 2025 | Developed by Jhpiego Myanmar for MoH.
      </p>
    </div>
  </footer>

  <script>
    // Get patient ID from URL parameters
    function getPatientIdFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('patient');
    }

    // Load patient information
    async function loadPatientInfo() {
      try {
        const patientId = getPatientIdFromUrl();
        if (!patientId) {
          document.body.innerHTML = '<div class="alert alert-danger">Patient ID not found.</div>';
          return;
        }

        // Check if user is authenticated
        const user = firebase.auth().currentUser;
        if (!user) {
          window.location.href = "login.html";
          return;
        }

        var patientData = null;
        if (navigator.onLine) {
          try {
            const patientDoc = await firebase.firestore()
              .collection("patients").doc(patientId).get();
            if (patientDoc.exists) patientData = patientDoc.data();
          } catch (e) { console.warn('Firestore load failed:', e); }
        }
        if (!patientData) {
          var cached = sessionStorage.getItem('selectedPatientData');
          if (cached) patientData = JSON.parse(cached);
          else if (window.OfflineManager) {
            var c = await window.OfflineManager.getCachedPatient(patientId);
            if (c) patientData = c;
          }
        }
        if (!patientData) {
          document.body.innerHTML = '<div class="alert alert-danger">Patient data not available.</div>';
          return;
        }
        
        // Populate simplified patient info display
        document.getElementById('patientName').textContent = patientData.name || 'Unknown Patient';

        // Set default referral time to current time
        const now = new Date();
        const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
        const referralTimeEl = document.getElementById('referralTime');
        if (referralTimeEl) {
          referralTimeEl.value = localDateTime.toISOString().slice(0, 16);
        }

      } catch (error) {
        console.error('Error loading patient info:', error);
        document.body.innerHTML = `<div class="alert alert-danger">Error loading patient information: ${error.message}</div>`;
      }
    }

    // Save transfer record
    async function saveTransferRecord(event) {
      event.preventDefault();
      
      try {
        const patientId = getPatientIdFromUrl();
        if (!patientId) {
          alert('Patient ID not found.');
          return;
        }

        // Helper function to safely get element value
        const getValue = (id) => {
          const el = document.getElementById(id);
          return el ? el.value : '';
        };
        
        // Collect form data with new field names
        const formData = {
          referralTime: getValue('referralTime'),
          referralMode: getValue('referralMode'),
          referralFacility: getValue('referralFacility'),
          mainSymptoms: getValue('mainSymptoms'),
          treatmentBeforeReferral: getValue('treatmentBeforeReferral'),
          medications: getValue('medications'),
          patientGeneralCondition: getValue('patientGeneralCondition'),
          vitalSigns: getValue('vitalSigns'),
          initial: getValue('initial'),
          patientId: patientId,
          recordedBy: firebase.auth().currentUser?.uid || 'unknown',
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };

        // Save transfer record to Firestore
        await firebase.firestore()
          .collection('patients')
          .doc(patientId)
          .collection('records')
          .doc('transferRecord')
          .set(formData);

        // Save endTreatment document with outcome 'transfer'
        await firebase.firestore()
          .collection('patients')
          .doc(patientId)
          .collection('records')
          .doc('endTreatment')
          .set({
            outcome: 'transfer',
            recordedBy: firebase.auth().currentUser?.uid || 'unknown',
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });

        // Get transfer type from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const transferType = urlParams.get('type') || 'anc'; // Default to 'anc' if not specified
        
        // Map transfer type to status
        let transferStatus;
        let transferReason;
        switch(transferType) {
          case 'labour':
            transferStatus = 'labour_transfer';
            transferReason = 'Transferred during labour care';
            break;
          case 'pnc':
            transferStatus = 'pnc_transfer';
            transferReason = 'Transferred during postnatal care';
            break;
          case 'anc':
          default:
            transferStatus = 'anc_transfer';
            transferReason = 'Transferred during antenatal care';
            break;
        }

        // Update patient status using StatusManager
        if (window.StatusManager) {
          const statusUpdated = await StatusManager.checkAndUpdateToTransfer(
            patientId,
            transferStatus,
            transferReason
          );
          if (statusUpdated) {
            console.log(`✅ Patient status updated to ${transferStatus}`);
          }
        } else {
          // Fallback if StatusManager is not available
          await firebase.firestore()
            .collection('patients')
            .doc(patientId)
            .update({
              status: transferStatus,
              last_updated: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        console.log('Transfer record saved successfully and patient status updated');
        
        // Redirect to Patient Care Hub after successful save
        window.location.href = `patient-care-hub.html?patient=${patientId}`;

      } catch (error) {
        console.error('Error saving transfer record:', error);
        alert(`Error saving transfer record: ${error.message}`);
      }
    }

    // Go back to the previous page the user came from
    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'patient-care-hub.html';
      }
    }

    // View transfer record
    function viewTransferRecord() {
      const patientId = getPatientIdFromUrl();
      if (patientId) {
        // You can create a transfer-record-view.html page or redirect to summary
        window.location.href = `summary.html?patient=${patientId}`;
      }
    }

    // Load data when page loads
    firebase.auth().onAuthStateChanged(function(user) {
      if (!user) {
        window.location.href = "login.html";
      } else {
        loadPatientInfo();
      }
    });
  </script>
</body>
</html>
