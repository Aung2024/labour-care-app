<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Newborn Competency - Quality Improvement</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/vendor/bootstrap.min.css" />
  <link rel="stylesheet" href="css/vendor/fontawesome-all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/vendor/bootstrap.bundle.min.js"></script>
  <script src="js/vendor/firebase-app.js"></script>
  <script src="js/vendor/firebase-auth.js"></script>
  <script src="js/vendor/firebase-firestore.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/user-cache.js"></script>
  <script src="js/nav-back.js"></script>
  <script src="js/ui-dialogs.js"></script>
  <script src="js/quality-scoring.js"></script>
  <script src="js/quality-improvement.js"></script>
  <style>
    :root {
      --primary-color: #0d9488;
      --secondary-color: #0f766e;
    }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Inter', 'Myanmar Text', 'Segoe UI', sans-serif;
      min-height: 100dvh;
    }
    .header-section {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 0.85rem 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .header-section .container, .page-main { max-width: 920px; }
    .header-section h1 { font-size: 1.15rem; font-weight: 800; margin: 0; }
    .header-actions {
      display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; flex-wrap: wrap;
    }
    .header-actions .btn, .language-btn, .filter-bar select, .filter-bar button, .qi-btn {
      min-height: 44px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .page-main { padding: 1rem 1rem 2.5rem; margin: 0 auto; width: 100%; }
    .filter-bar, .summary-card, .indicator-card {
      background: rgba(255,255,255,0.97);
      border-radius: 16px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(13, 148, 136, 0.12);
    }
    .filter-bar { padding: 0.9rem 1rem; margin-bottom: 0.85rem; }
    .filter-bar .form-label { font-weight: 700; font-size: 0.85rem; color: #334155; margin-bottom: 0.25rem; }
    .summary-card {
      padding: 1rem 1.1rem;
      margin-bottom: 0.85rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .summary-pct {
      width: 88px; height: 88px; border-radius: 50%;
      background: linear-gradient(135deg, #ccfbf1, #99f6e4);
      color: #115e59;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 1.35rem; font-weight: 900;
      flex: 0 0 88px;
    }
    .summary-meta { flex: 1; min-width: 180px; }
    .summary-meta h2 { font-size: 1.05rem; font-weight: 800; margin: 0 0 0.25rem; color: #0f172a; }
    .summary-meta p { margin: 0; color: #64748b; font-size: 0.9rem; }
    .indicator-list { display: grid; gap: 0.85rem; }
    .indicator-card {
      padding: 1rem 1.05rem;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .indicator-card:hover, .indicator-card:focus {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.14);
      outline: 3px solid rgba(20, 184, 166, 0.28);
    }
    .indicator-top {
      display: flex; justify-content: space-between; gap: 0.75rem; align-items: flex-start;
    }
    .indicator-title { font-size: 0.98rem; font-weight: 800; color: #0f172a; margin: 0 0 0.25rem; }
    .indicator-source { font-size: 0.8rem; color: #64748b; margin: 0; }
    .pct-badge {
      min-width: 64px;
      text-align: center;
      border-radius: 12px;
      padding: 0.45rem 0.55rem;
      background: #ecfeff;
      color: #0f766e;
      font-weight: 900;
      font-size: 1.05rem;
      line-height: 1.1;
    }
    .pct-badge small { display: block; font-size: 0.68rem; font-weight: 700; color: #64748b; }
    .meter {
      height: 8px; border-radius: 999px; background: #e2e8f0; margin: 0.75rem 0 0.5rem; overflow: hidden;
    }
    .meter > span {
      display: block; height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, #14b8a6, #0d9488);
    }
    .qi-muted { color: #64748b; font-size: 0.85rem; }
    .qi-btn {
      border: none;
      border-radius: 10px;
      padding: 0.55rem 0.85rem;
      font-weight: 700;
      font-size: 0.88rem;
      background: #0d9488;
      color: white;
    }
    .qi-btn.secondary { background: #e2e8f0; color: #334155; }
    .status-banner {
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      margin-bottom: 0.85rem;
      color: #334155;
      font-weight: 600;
    }
    .status-banner.error { background: #fef2f2; color: #991b1b; }
    .action-modal .modal-dialog { max-width: 720px; }
    .action-modal .modal-content { border: 0; border-radius: 18px; overflow: hidden; }
    .action-modal .modal-header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      border: 0;
    }
    .action-modal .modal-title { font-size: 1.05rem; font-weight: 800; }
    .action-modal .form-label { color: #334155; font-weight: 700; }
    .action-modal .form-control, .action-modal .form-select { min-height: 44px; }
    .modal-score {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 82px;
      min-height: 54px;
      border-radius: 14px;
      background: #ccfbf1;
      color: #115e59;
      font-size: 1.3rem;
      font-weight: 900;
    }
    .language-switcher { display: flex; gap: 0.25rem; }
    .language-btn {
      min-width: 44px; padding: 0.375rem 0.75rem; font-size: 0.875rem; border-radius: 8px;
      background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white;
    }
    .language-btn.active { background: rgba(255,255,255,0.4); font-weight: 600; }
    @media (max-width: 768px) {
      .header-section .row > [class*="col-"] { width: 100%; }
      .header-actions { justify-content: flex-start; margin-top: 0.5rem; }
    }
  </style>
</head>
<body>
  <div class="header-section">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-6">
          <h1><i class="fas fa-baby me-2"></i><span class="lang-text" data-en="Newborn Competency" data-mm="မွေးကင်းစ ကျွမ်းကျင်မှု">Newborn Competency</span></h1>
        </div>
        <div class="col-md-6">
          <div class="header-actions">
            <div class="language-switcher" role="group" aria-label="Language">
              <button type="button" class="btn btn-sm language-btn" data-lang="en" aria-label="English">ENG</button>
              <button type="button" class="btn btn-sm language-btn active" data-lang="mm" aria-label="Myanmar">MM</button>
            </div>
            <a href="quality-competency.html" class="btn btn-outline-light btn-sm" aria-label="Back">
              <i class="fas fa-arrow-left me-2"></i><span class="lang-text" data-en="Back" data-mm="ပြန်သွားရန်">Back</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <main class="page-main container">
    <div id="statusBanner" class="status-banner" role="status" aria-live="polite">
      <span class="lang-text" data-en="Loading newborn competency scores…" data-mm="မွေးကင်းစ ကျွမ်းကျင်မှု အမှတ်များ တင်နေသည်…">Loading newborn competency scores…</span>
    </div>

    <div class="filter-bar">
      <div class="row g-2 align-items-end">
        <div class="col-sm-3">
          <label class="form-label lang-text" for="monthSelect" data-en="Score month" data-mm="အမှတ် လ">Score month</label>
          <select id="monthSelect" class="form-select" aria-label="Score month"></select>
        </div>
        <div class="col-sm-4" id="midwifeFilterWrap" style="display:none;">
          <label class="form-label lang-text" for="midwifeSelect" data-en="Midwife" data-mm="သားဖွား">Midwife</label>
          <select id="midwifeSelect" class="form-select" aria-label="Midwife"></select>
        </div>
        <div class="col-sm-2">
          <button type="button" class="btn btn-success w-100 qi-btn" id="refreshBtn" aria-label="Refresh scores">
            <i class="fas fa-sync-alt me-1"></i><span class="lang-text" data-en="Refresh" data-mm="ပြန်တင်ရန်">Refresh</span>
          </button>
        </div>
        <div class="col-sm-3">
          <a href="quality-review-actions.html" class="btn btn-outline-success w-100 qi-btn secondary" id="reviewActionsBtn">
            <i class="fas fa-list-check me-1"></i><span class="lang-text" data-en="Review Actions" data-mm="လုပ်ဆောင်ချက်များ ပြန်ကြည့်ရန်">Review Actions</span>
          </a>
        </div>
      </div>
    </div>

    <div class="summary-card" id="summaryCard" style="display:none;">
      <div class="summary-pct" id="summaryPct">0%</div>
      <div class="summary-meta">
        <h2 id="summaryTitle">—</h2>
        <p id="summarySubtitle" class="qi-muted"></p>
        <p id="summaryHint" class="qi-muted mt-1"></p>
      </div>
    </div>

    <div class="indicator-list" id="indicatorList" aria-live="polite"></div>
  </main>

  <div class="modal fade action-modal" id="actionModal" tabindex="-1" aria-labelledby="actionModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="actionModalTitle">Quality Improvement Action</h2>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex gap-3 align-items-start justify-content-between mb-3">
            <p class="mb-0 fw-bold" id="modalIndicatorTitle"></p>
            <div class="modal-score" id="modalScore">0%</div>
          </div>
          <p class="qi-muted" id="modalScoreDetail"></p>
          <div class="mb-3">
            <label class="form-label" for="modalReasonCategory">Reason category</label>
            <select class="form-select" id="modalReasonCategory"></select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="modalReasonText">Reason details</label>
            <textarea class="form-control" id="modalReasonText" rows="3"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label" for="modalNextAction">Next Action</label>
            <textarea class="form-control" id="modalNextAction" rows="3"></textarea>
          </div>
          <div class="row g-3">
            <div class="col-md-7">
              <label class="form-label" for="modalActionOwner">Who will do this action?</label>
              <input type="text" class="form-control" id="modalActionOwner" />
            </div>
            <div class="col-md-5">
              <label class="form-label" for="modalTarget">Next target (%)</label>
              <input type="number" min="0" max="100" class="form-control" id="modalTarget" />
            </div>
          </div>
          <p class="qi-muted mt-3 mb-0" id="modalReadOnlyHint" style="display:none;"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-success qi-btn" id="saveActionBtn">Save Action</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentLanguage = localStorage.getItem('appLanguage') || localStorage.getItem('language') || 'mm';
    let viewer = null;
    let midwives = [];
    let selectedProviderId = null;
    let selectedMonth = null;
    let currentSummary = null;
    let currentPlan = null;
    let selectedIndicatorId = null;
    let actionModal = null;

    function t(en, mm) {
      return currentLanguage === 'en' ? en : mm;
    }

    function applyLanguage(lang) {
      currentLanguage = lang;
      localStorage.setItem('appLanguage', lang);
      document.querySelectorAll('.language-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      document.querySelectorAll('.lang-text').forEach(function (el) {
        var text = lang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-mm');
        if (text) el.textContent = text;
      });
      if (currentSummary) renderAll();
    }

    function setStatus(message, isError) {
      var banner = document.getElementById('statusBanner');
      if (!banner) return;
      banner.style.display = message ? '' : 'none';
      banner.classList.toggle('error', !!isError);
      banner.textContent = message || '';
    }

    function monthOptions() {
      var options = ['all'];
      var cursor = QualityScoring.currentYangonMonthKey(new Date());
      for (var i = 0; i < 12; i++) {
        options.push(cursor);
        cursor = QualityScoring.previousMonthKey(cursor);
        if (!cursor) break;
      }
      return options;
    }

    function fillMonthSelect() {
      var select = document.getElementById('monthSelect');
      select.innerHTML = monthOptions().map(function (month) {
        var label = month === 'all' ? t('All time', 'အချိန်အားလုံး') : month;
        return '<option value="' + month + '">' + label + '</option>';
      }).join('');
      select.value = 'all';
      selectedMonth = 'all';
    }

    function actionScoreMonth() {
      return selectedMonth === 'all'
        ? QualityScoring.currentYangonMonthKey(new Date())
        : selectedMonth;
    }

    function fillMidwifeSelect() {
      var wrap = document.getElementById('midwifeFilterWrap');
      var select = document.getElementById('midwifeSelect');
      if (!QualityImprovement.isSupervisorRole(viewer.role)) {
        wrap.style.display = 'none';
        selectedProviderId = viewer.uid;
        return;
      }
      wrap.style.display = '';
      select.innerHTML = midwives.map(function (midwife) {
        return '<option value="' + midwife.id + '">' + escapeHtml(midwife.name) +
          (midwife.township ? (' · ' + escapeHtml(midwife.township)) : '') + '</option>';
      }).join('');
      if (!midwives.length) {
        select.innerHTML = '<option value="">' + t('No midwives found', 'သားဖွား မတွေ့ပါ') + '</option>';
        selectedProviderId = null;
        return;
      }
      selectedProviderId = select.value || midwives[0].id;
      select.value = selectedProviderId;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function selectedProviderMeta() {
      if (!QualityImprovement.isSupervisorRole(viewer.role)) {
        return {
          id: viewer.uid,
          name: viewer.name,
          township: viewer.township,
          region: viewer.region,
          facility_code: viewer.facility_code
        };
      }
      return midwives.find(function (item) { return item.id === selectedProviderId; }) || null;
    }

    function indicatorTitle(indicator) {
      return currentLanguage === 'en' ? indicator.en : indicator.mm;
    }

    function indicatorSource(indicator) {
      return currentLanguage === 'en' ? indicator.dataSourceEn : indicator.dataSourceMm;
    }

    function planEntry(plan, indicatorId) {
      return (plan && plan.indicators && plan.indicators[indicatorId]) || null;
    }

    function renderSummary() {
      var card = document.getElementById('summaryCard');
      var meta = selectedProviderMeta();
      if (!currentSummary || !meta) {
        card.style.display = 'none';
        return;
      }
      card.style.display = 'flex';
      document.getElementById('summaryPct').textContent = (currentSummary.summaryPercentage || 0) + '%';
      document.getElementById('summaryTitle').textContent = meta.name || selectedProviderId;
      var periodLabel = selectedMonth === 'all' ? t('all time', 'အချိန်အားလုံး') : selectedMonth;
      document.getElementById('summarySubtitle').textContent = t(
        'Average of scored newborn indicators for ' + periodLabel,
        periodLabel + ' အတွက် မွေးကင်းစ အမှတ် ပျမ်းမျှ'
      );
      document.getElementById('summaryHint').textContent = currentSummary.computedLocally
        ? t('Computed from this midwife’s patient records for the demo.', 'ဒီမိုအတွက် သားဖွား၏ လူနာမှတ်တမ်းများမှ တွက်ချက်ထားသည်။')
        : t('Loaded from cached QI summary.', 'သိမ်းဆည်းထားသော QI အနှစ်ချုပ်မှ တင်ထားသည်။');
    }

    function renderIndicatorCard(indicator) {
      var totals = (currentSummary && currentSummary.indicators && currentSummary.indicators[indicator.id]) ||
        { numerator: 0, denominator: 0, percentage: 0 };
      var pct = totals.percentage || 0;

      var html = '';
      html += '<article class="indicator-card" id="indicator-' + indicator.id +
        '" role="button" tabindex="0" data-indicator-id="' + indicator.id +
        '" aria-label="' + escapeHtml(indicatorTitle(indicator)) + ', ' + pct + ' percent">';
      html += '<div class="indicator-top">';
      html += '<div><h3 class="indicator-title">' + escapeHtml(indicatorTitle(indicator)) + '</h3>';
      html += '<p class="indicator-source">' + escapeHtml(indicatorSource(indicator)) + '</p></div>';
      html += '<div class="pct-badge" aria-label="' + pct + ' percent">' + pct + '%<small>' +
        totals.numerator + '/' + totals.denominator + '</small></div></div>';
      html += '<div class="meter" aria-hidden="true"><span style="width:' + Math.min(100, pct) + '%"></span></div>';
      html += '</article>';
      return html;
    }

    function renderAll() {
      renderSummary();
      document.getElementById('indicatorList').innerHTML = QualityScoring.INDICATOR_DEFS.map(renderIndicatorCard).join('');
    }

    async function refreshScores() {
      var meta = selectedProviderMeta();
      if (!selectedProviderId || !meta) {
        setStatus(t('Select a midwife to view scores.', 'အမှတ်များကြည့်ရန် သားဖွား ရွေးပါ။'), true);
        return;
      }
      setStatus(t('Loading scores…', 'အမှတ်များ တင်နေသည်…'));
      document.getElementById('refreshBtn').disabled = true;
      try {
        QualityImprovement.clearSummaryCache(selectedProviderId, selectedMonth);
        currentSummary = await QualityImprovement.loadProviderMonthSummary(selectedProviderId, selectedMonth, meta);
        currentPlan = await QualityImprovement.loadActionPlan(selectedProviderId, actionScoreMonth());
        updateReviewActionsLink();
        setStatus('');
        renderAll();
      } catch (error) {
        console.error(error);
        setStatus(error.message || t('Could not load scores.', 'အမှတ်များ တင်၍မရပါ။'), true);
      } finally {
        document.getElementById('refreshBtn').disabled = false;
      }
    }

    function updateReviewActionsLink() {
      var url = 'quality-review-actions.html';
      if (selectedProviderId) url += '?provider=' + encodeURIComponent(selectedProviderId);
      document.getElementById('reviewActionsBtn').href = url;
    }

    function openActionModal(indicatorId) {
      var indicator = QualityScoring.INDICATOR_DEFS.find(function (item) {
        return item.id === indicatorId;
      });
      if (!indicator) return;
      selectedIndicatorId = indicatorId;
      var totals = currentSummary.indicators[indicatorId] ||
        { numerator: 0, denominator: 0, percentage: 0 };
      var entry = planEntry(currentPlan, indicatorId) || {};
      var canEdit = QualityImprovement.isMidwifeRole(viewer.role) &&
        viewer.uid === selectedProviderId;
      document.getElementById('modalIndicatorTitle').textContent = indicatorTitle(indicator);
      document.getElementById('modalScore').textContent = (totals.percentage || 0) + '%';
      document.getElementById('modalScoreDetail').textContent =
        totals.numerator + ' / ' + totals.denominator + ' ' +
        t('newborn babies met this indicator.', 'မွေးကင်းစကလေးများ ဤအချက်နှင့် ကိုက်ညီသည်။');
      document.getElementById('modalReasonCategory').innerHTML =
        '<option value="">' + t('Select category', 'အမျိုးအစား ရွေးပါ') + '</option>' +
        QualityScoring.REASON_CATEGORIES.map(function (category) {
          var selected = entry.reasonCategory === category.id ? ' selected' : '';
          return '<option value="' + category.id + '"' + selected + '>' +
            escapeHtml(currentLanguage === 'en' ? category.en : category.mm) + '</option>';
        }).join('');
      document.getElementById('modalReasonText').value = entry.explanation || '';
      document.getElementById('modalNextAction').value = entry.nextAction || '';
      document.getElementById('modalActionOwner').value = entry.actionOwner || viewer.name || '';
      document.getElementById('modalTarget').value =
        entry.nextTargetPercent != null ? entry.nextTargetPercent : indicator.defaultTarget;
      if (!entry.explanation) applyReasonTemplate();

      ['modalReasonCategory', 'modalReasonText', 'modalNextAction',
        'modalActionOwner', 'modalTarget'].forEach(function (id) {
        document.getElementById(id).disabled = !canEdit;
      });
      document.getElementById('saveActionBtn').style.display = canEdit ? '' : 'none';
      var hint = document.getElementById('modalReadOnlyHint');
      hint.style.display = canEdit ? 'none' : '';
      hint.textContent = t(
        'This action is read-only here. Supervisors can comment from Review Actions.',
        'ဤနေရာတွင် ဖတ်ရှုရန်သာဖြစ်သည်။ ကြီးကြပ်သူသည် လုပ်ဆောင်ချက်များ ပြန်ကြည့်ရန် စာမျက်နှာမှ မှတ်ချက်ပေးနိုင်သည်။'
      );
      if (!actionModal) actionModal = new bootstrap.Modal(document.getElementById('actionModal'));
      actionModal.show();
    }

    function applyReasonTemplate() {
      var categoryId = document.getElementById('modalReasonCategory').value;
      var textarea = document.getElementById('modalReasonText');
      var category = QualityScoring.REASON_CATEGORIES.find(function (item) {
        return item.id === categoryId;
      });
      if (!category) return;
      var template = currentLanguage === 'en' ? category.defaultEn : category.defaultMm;
      var templates = QualityScoring.REASON_CATEGORIES.reduce(function (list, item) {
        list.push(item.defaultEn, item.defaultMm);
        return list;
      }, []);
      var current = String(textarea.value || '').trim();
      if (!current || templates.indexOf(current) >= 0) textarea.value = template;
    }

    async function handleSaveAction() {
      if (!selectedIndicatorId) return;
      var saveButton = document.getElementById('saveActionBtn');
      saveButton.disabled = true;
      try {
        currentPlan = await QualityImprovement.saveActionPlanIndicator(
          viewer,
          selectedProviderId,
          actionScoreMonth(),
          selectedIndicatorId,
          {
            reasonCategory: document.getElementById('modalReasonCategory').value,
            explanation: document.getElementById('modalReasonText').value,
            nextAction: document.getElementById('modalNextAction').value,
            actionOwner: document.getElementById('modalActionOwner').value,
            nextTargetPercent: document.getElementById('modalTarget').value
          }
        );
        actionModal.hide();
        await AppDialog.alert(
          t('Improvement action saved.', 'တိုးတက်ရေး လုပ်ဆောင်ချက် သိမ်းပြီးပါပြီ။'),
          { title: 'Quality Improvement' }
        );
      } catch (error) {
        alert(error.message || t('Could not save.', 'သိမ်း၍မရပါ။'));
      } finally {
        saveButton.disabled = false;
      }
    }

    document.getElementById('indicatorList').addEventListener('click', function (event) {
      var row = event.target.closest('[data-indicator-id]');
      if (row) openActionModal(row.getAttribute('data-indicator-id'));
    });
    document.getElementById('indicatorList').addEventListener('keydown', function (event) {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      var row = event.target.closest('[data-indicator-id]');
      if (!row) return;
      event.preventDefault();
      openActionModal(row.getAttribute('data-indicator-id'));
    });
    document.getElementById('saveActionBtn').addEventListener('click', handleSaveAction);
    document.getElementById('modalReasonCategory').addEventListener('change', applyReasonTemplate);

    document.getElementById('monthSelect').addEventListener('change', function () {
      selectedMonth = document.getElementById('monthSelect').value;
      refreshScores();
    });
    document.getElementById('midwifeSelect').addEventListener('change', function () {
      selectedProviderId = document.getElementById('midwifeSelect').value;
      updateReviewActionsLink();
      refreshScores();
    });
    document.getElementById('refreshBtn').addEventListener('click', refreshScores);
    document.querySelectorAll('.language-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { applyLanguage(btn.dataset.lang); });
    });

    firebase.auth().onAuthStateChanged(async function (user) {
      if (!user) return;
      try {
        applyLanguage(currentLanguage);
        fillMonthSelect();
        viewer = await QualityImprovement.loadCurrentUserProfile();
        if (QualityImprovement.isSupervisorRole(viewer.role)) {
          midwives = await QualityImprovement.listScopedMidwives(viewer);
        }
        fillMidwifeSelect();
        await refreshScores();
      } catch (error) {
        console.error(error);
        setStatus(error.message || t('Could not initialize page.', 'စာမျက်နှာ စတင်၍မရပါ။'), true);
      }
    });
  </script>
</body>
</html>
